    return `<div class="hrow ${i===S.foco?'on':''}">
      <input type="checkbox" data-act="toggle" data-k="${esc(k)}" ${S.sel[k]?'checked':''} ${d?'disabled':''} aria-label="Seleccionar ${esc(x.ubicacion)}">
      <button class="nm" data-act="goto" data-i="${i}" title="${esc(x.ubicacion)}">${esc(x.ubicacion)}</button>
      ${estado}
    </div>`;
  }).join('');
  return `<div class="card right">
    <h3 class="dec-tit">Hallazgos</h3>
    <div class="hrow" style="border-bottom:1px solid var(--sep);flex:none">
      <input type="checkbox" data-act="todos" ${todos?'checked':''} aria-label="Seleccionar todos">
      <span class="small sel-todos">Seleccionar todos</span>
    </div>
    <div class="lista-scroll">${filas}</div>
    <div class="motivo-scroll">${vPresencia(rs[S.foco])}${vMotivo(rs[S.foco])}${vDebate(rs[S.foco])}</div>
    <label class="small" for="fcom" style="display:block;margin-top:12px;flex:none">Comentario <span style="font-weight:400">· se guarda al pulsar Aprobar o Rechazar</span></label>
    <textarea id="fcom" rows="2" style="width:100%;margin-top:6px;flex:none" placeholder="Explica tu criterio">${esc(S.comment)}</textarea>
    <div class="fbtns" style="flex:none">
      <button class="ok" data-act="aprobar" ${puedes&&pAp?'':'disabled'} ${pAp?'':`title="${esc(sinPermiso('revisiones','aprobar'))}"`}>Aprobar</button>
      <button class="warn" data-act="rechazar" ${puedes&&pRe?'':'disabled'} ${pRe?'':`title="${esc(sinPermiso('revisiones','rechazar'))}"`}>Rechazar</button>
    </div>
    ${bloq?`<p class="note" style="flex:none;margin:6px 0 0">${esc(bloq)}</p>`:''}
    ${pAp&&pRe?'':`<p class="note" style="flex:none;margin:6px 0 0">${!pAp&&!pRe?`Tu rol (${esc(nombreRol(miRol()))}) puede consultar, pero no aprobar ni rechazar validaciones de IA.`:esc(sinPermiso('revisiones',pAp?'rechazar':'aprobar'))}</p>`}
  </div>`;
}

// ---------- Escalamiento: un documento se asigna a UNA persona con rol Dueño de Proceso, que es la única que puede
// editarlo (y solo mientras su revisión no esté Completada). El servidor comprueba todo al escalar y al guardar.
function duenos(){return S.equipo.filter(m=>m.rol==='dueno_proceso');}
function bloqueoDecision(doc){                       // mismo criterio que el servidor (P.bloqueo_decision)
  const e=(S.escalados||{})[doc];
  return e&&!e.corregido?`El documento está devuelto a ${e.para} para que lo corrija: aprobar y rechazar se activan cuando guarde los cambios.`:null;
}
function vEscalado(doc){
  if(!SRV) return '';
  const e=(S.escalados||{})[doc], yo=S.user.nombre, mot=motivoEditar(doc), puedeEsc=puede('revisiones','escalar');
  const hist=(S.escHist||[]).filter(h=>h.doc===doc).slice(-5).reverse();
  const ACC={escalar:'devolvió el documento a',cambiar:'cambió el destinatario a',quitar:'quitó el escalamiento de',corregir:'guardó los cambios:'};
  let estado='';
  if(e){
    const dest=S.equipo.find(m=>m.n===e.para), sigueDueno=dest&&dest.rol==='dueno_proceso';
    const corr=e.corregido?`<div class="esc-ok">${esc(e.para)} guardó los cambios (v${e.corregido.version}) el ${fmtFecha(e.corregido.fecha)}. Ya se puede aprobar o rechazar.</div>`
      :`<div class="esc-esp">Esperando a que ${esc(e.para)} corrija el documento. Aprobar y Rechazar se activan cuando guarde los cambios.</div>`;
    estado=`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span><b>Devuelto a ${esc(e.para)}</b> <span class="small">por ${esc(e.por)} · ${fmtFecha(e.fecha)}</span></span>
        ${puedeEsc||e.para===yo?`<button class="enlace" data-act="escQuitar" style="margin-left:auto">${e.para===yo&&!puedeEsc?'He terminado: quitar escalamiento':'Quitar escalamiento'}</button>`:''}</div>
      ${e.nota?`<div class="small" style="margin-top:4px"><b>Qué tiene que corregir:</b> ${esc(e.nota)}</div>`:''}
      ${corr}
      ${!sigueDueno?`<div class="small" style="color:#c76a00;margin-top:4px">${esc(e.para)} ya no tiene el rol Dueño de Proceso: no puede editarlo hasta que se devuelva a otra persona.</div>`:''}
      <div class="small" style="margin-top:4px">${e.para===yo?(mot?esc(mot):'Puedes editar este documento con el botón «Editar».'):`Solo ${esc(e.para)} puede editar este documento.`}</div>`;
  }
  let form='';
  if(S.escOpen&&puedeEsc){
    const ds=duenos(), v=S.escVals||{};
    form=`<div class="esc-form">
        <label class="small" style="display:flex;flex-direction:column;gap:4px">Devolver a (Dueño de Proceso)
          <select id="escPara" ${ds.length?'':'disabled'}><option value="">${ds.length?'Elige a una persona…':'No hay nadie con ese rol'}</option>${ds.map(m=>`<option value="${esc(m.n)}" ${(v.para||'')===m.n?'selected':''} ${e&&e.para===m.n?'disabled':''}>${esc(m.n)} · ${esc(m.c)}${e&&e.para===m.n?' (actual)':''}</option>`).join('')}</select></label>
        <label class="small" style="display:flex;flex-direction:column;gap:4px;flex:1;min-width:240px">Qué tiene que corregir
          <input id="escNota" value="${esc(v.nota||'')}" maxlength="300" autocomplete="off" placeholder="Por ejemplo: el plazo de SEC-REQ-009 no cumple IS.I.OR.210"></label>
        <button class="ghost" data-act="escAbrir">Cancelar</button><button class="ok" data-act="escGuardar" ${ds.length?'':'disabled'}>${e?'Cambiar destinatario':'Devolver'}</button>
        ${ds.length?'':`<p class="small" style="flex-basis:100%;margin:2px 0 0">Para devolver un documento, alguien del equipo tiene que tener el rol Dueño de Proceso.${puede('configuracion','gestionar_usuarios')?' <button class="enlace" data-act="nav" data-v="usuarios">Asignarlo en Configuración → Usuarios</button>':' Pídeselo a un administrador.'}</p>`}
        <p class="small" style="flex-basis:100%;margin:2px 0 0">Mientras tanto, Aprobar y Rechazar quedan desactivados hasta que esa persona guarde sus cambios.</p></div>`;
  }
  if(!e&&!form) return '';
  return `<div class="card esc-card">${estado||'<div class="small"><b>Escalar el documento</b> · devuélvelo a su Dueño de Proceso para que lo corrija.</div>'}${form}
    ${hist.length?`<details style="margin-top:6px"><summary class="small">Historial</summary>${hist.map(h=>`<div class="small">· ${esc(h.por)} ${ACC[h.accion]||h.accion} ${h.accion==='corregir'?esc(h.nota||''):esc(h.para)} · ${fmtFecha(h.fecha)}${h.nota&&h.accion!=='corregir'?' · '+esc(h.nota):''}</div>`).join('')}</details>`:''}</div>`;
}

// Contenido del modal lateral de criterios: jerarquía, y por cada hallazgo qué se leyó, contra qué se contrastó y por qué.

function estadoDoc(rs){
  const pend=rs.filter(r=>!decOf(r)).length;
  return !rs.length?'Sin hallazgos':pend===0?'Completado':pend===rs.length?'Pendiente':'En revisión';
}

// Colores de las etiquetas (paleta de Apple): [texto, fondo, barra]
const GRIS=['#6e6e73','rgba(142,142,147,.16)','var(--sep)'];
const TCOL={'No cumple':['#d70015','rgba(255,59,48,.12)'],'Inconsistencia':['#c76a00','rgba(255,159,10,.16)'],
  'Cobertura faltante':['#a442d6','rgba(175,82,222,.13)'],'Trazabilidad incorrecta':['#0a6fd6','rgba(10,132,255,.12)'],'No verificable':GRIS};
const ECOL={'Pendiente':['#0a6fd6','rgba(10,132,255,.12)','var(--tint)'],'En revisión':['#c76a00','rgba(255,159,10,.16)','var(--warn)'],
  'Completado':['#248a3d','rgba(52,199,89,.15)','var(--ok)'],'Sin hallazgos':GRIS,'Cargado · sin procesar':GRIS};
function pill(txt,c){return `<span class="pill" style="--pc:${c[0]};--pb:${c[1]}">${txt}</span>`;}

// ---------- Documentos: prioridad, plazo, trabajo en equipo y documentos cargados
const CORPUS=new Set(Object.keys(DOCS));                         // los del corpus auditado; el resto se cargó desde Auditorías
const PRANGO={Alta:0,Media:1,Baja:2};
const PCOL={Alta:['#d70015','rgba(255,59,48,.12)'],Media:['#c76a00','rgba(255,159,10,.16)'],Baja:GRIS};
function metaDoc(d){return (S.docs_meta||{})[d]||{};}
// Índice por documento: hallazgos, decisiones, comentarios, ediciones y compartidos, recorriendo cada lista UNA vez.
// Auditorías lo prepara una vez por redibujo y cada fila solo consulta su entrada (antes, cada fila recorría todas
// las listas, varias veces). Se conserva el orden original de cada lista: «Trabajado con …» sale en el mismo orden.
// Con `solo`, prepara solo la entrada de ese documento (para Revisión).
const VACIO_DOC={rs:[],dec:[],coms:[],eds:[],comp:[]};
function indiceDocs(solo){
  const ix=new Map(), doc=k=>{const s=String(k), i=s.indexOf('|'); return i<0?null:s.slice(0,i);};
  const g=d=>{if(d===null||(solo!==undefined&&d!==solo)) return null; let x=ix.get(d); if(!x){x={rs:[],dec:[],coms:[],eds:[],comp:[]}; ix.set(d,x);} return x;};
  RES.forEach(r=>{const x=g(r.documento); if(x) x.rs.push(r);});
  Object.entries(S.dec||{}).forEach(([k,v])=>{const x=g(doc(k)); if(x) x.dec.push(v);});
  (S.coms||[]).forEach(c=>{const x=g(doc(c.key)); if(x) x.coms.push(c);});
  Object.entries(S.ediciones||{}).forEach(([k,l])=>{const x=g(doc(k)); if(x) (l||[]).forEach(e=>x.eds.push(e));});
  (S.compartidos||[]).forEach(c=>{const x=g(c.doc); if(x) x.comp.push(c);});
  return ix;
}
function datosDoc(d,x){return x||indiceDocs(d).get(d)||VACIO_DOC;}
// Sugerencia: 5 o más «No cumple» → Alta; algún hallazgo → Media; sin hallazgos → Baja. Un cargado: la que se eligió.
function prioridadSugerida(d,x){
  const c=(DOCS[d]||{}).cargado; if(c) return c.prioridad||'Media';
  const rs=datosDoc(d,x).rs, nc=rs.filter(r=>r.tipo==='No cumple').length;
  return nc>=5?'Alta':rs.length?'Media':'Baja';
}
function prioridadDe(d,x){const p=metaDoc(d).prioridad; return p?p.valor:prioridadSugerida(d,x);}
// Un documento sin hallazgos que alguien ha marcado como revisado cuenta como Completado
function estadoDocDe(d,x){const rs=datosDoc(d,x).rs; return rs.length?estadoDoc(rs):metaDoc(d).revisado?'Completado':'Sin hallazgos';}
// Necesita revisión: tiene hallazgos sin decidir, o es un documento cargado (sin auditar) que nadie ha dado por revisado
function necesitaRevision(d,x){const e=estadoDocDe(d,x); return e==='Pendiente'||e==='En revisión'||(!!(DOCS[d]||{}).cargado&&e!=='Completado');}
// «En equipo»: compartido contigo o por ti, o trabajado por ti y al menos otra persona (decisiones, comentarios,
// ediciones de hallazgos, versiones o carga del documento)
function equipoDe(d,x){
  x=datosDoc(d,x);
  const u=new Set(), add=v=>{if(v) u.add(v);}, yo=S.user.nombre;
  x.dec.forEach(v=>add(v.user));
  x.coms.forEach(c=>add(c.user));
  x.eds.forEach(e=>add(e.user));
  versionesDe(d).forEach(v=>add(v.user));
  if((DOCS[d]||{}).cargado) add(DOCS[d].cargado.user);
  const comp=x.comp;
  comp.forEach(c=>{add(c.de); c.para.forEach(add);});
  const otros=[...u].filter(v=>v!==yo);
  const motivos=comp.map(c=>c.de===yo?`Compartido por ti con ${c.para.join(', ')}`:`Te lo compartió ${c.de}`);
  const en=comp.length>0||(u.has(yo)&&otros.length>0);
  if(en&&!comp.length) motivos.push(`Trabajado con ${otros.join(', ')}`);
  return {en,gente:[...u].sort(),motivos:[...new Set(motivos)]};
}
// Documentos cargados (los manda el servidor): se añaden a DOCS para abrirlos en Revisión como los del corpus.
// Su clave la decide el servidor al confirmarlos (código, o nombre del archivo; «.c» + final del id si ya existe).
function claveCargado(c,usadas){
  let k=c.clave;
  if(!k){
    const base=(c.codigo||String(c.archivo||'').replace(/\.[^.]+$/,'')).replace(/[^\w.\-]+/g,'_').slice(0,100)||'documento';
    k=CORPUS.has(base)||usadas.has(base)?`${base}.c${c.id.slice(-5)}`:base;
  }
  if(usadas.has(k)) k='UP-'+c.id;
  usadas.add(k); return k;
}
function fusionarCargados(){
  for(const k of Object.keys(DOCS)) if(!CORPUS.has(k)) delete DOCS[k];
  const usadas=new Set();
  (S.cargados||[]).forEach(c=>{
    DOCS[claveCargado(c,usadas)]={slug:'up_'+c.id,titulo:c.titulo||c.archivo,version:c.version||'',familia:c.familia||'Sin familia',
      paginas:c.paginas||1,escaneado:!!c.escaneado,cargado:c};
  });
  S.tabs=(S.tabs||[]).filter(d=>DOCS[d]);
  if(S.view==='revision'&&!DOCS[S.doc]) S.view='inicio';
}
function familiaSugerida(cod){
  if(!cod) return '';
  const pre=cod.split('-')[0], n={};
  for(const k of CORPUS) if(k.split('-')[0]===pre) n[DOCS[k].familia]=(n[DOCS[k].familia]||0)+1;
  return (Object.entries(n).sort((a,b)=>b[1]-a[1])[0]||[''])[0];
}
function familiasConocidas(){return [...new Set(Object.values(DOCS).map(x=>x.familia).filter(Boolean))].sort();}

// Días para responder: plazo (Configuración → Reglas) menos los días pasados desde el inicio de la auditoría.
// Un documento completado ya está respondido; uno sin hallazgos no necesita respuesta. Un documento CARGADO cuenta
// desde el día en que se cargó y, mientras nadie lo dé por revisado, sí necesita respuesta.
function guardarReglasLocal(){try{localStorage.setItem(LS+'_reglas',JSON.stringify(S.reglas));}catch(e){}}
function hoyISO(){const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function inicioDe(d){const c=(DOCS[d]||{}).cargado; return c?String(c.fecha).slice(0,10):(S.config||{}).inicio;}
function diasRestantes(est,d){
  if(est==='Completado') return {tipo:'hecho'};
  const cargado=d&&(DOCS[d]||{}).cargado;
  if(est==='Sin hallazgos'&&!cargado) return {tipo:'na'};
  const ini=d?inicioDe(d):(S.config||{}).inicio; if(!ini) return {tipo:'na'};
  const pasados=Math.floor((Date.parse(hoyISO())-Date.parse(ini))/86400000);
  return {tipo:'dias',n:((S.config||{}).plazo_dias||15)-pasados,pasados};
}
function celdaDias(x){
  if(x.tipo==='hecho') return pill('✓ Respondido',['#248a3d','rgba(52,199,89,.14)']);
  if(x.tipo==='na') return '<span class="small">—</span>';
  const n=x.n;
  if(n<0) return pill(`Vencido hace ${-n} ${-n===1?'día':'días'}`,['#d70015','rgba(255,59,48,.12)']);
  if(n===0) return pill('Vence hoy',['#d70015','rgba(255,59,48,.12)']);
  return pill(`${n} ${n===1?'día':'días'}`,n<=3?['#c76a00','rgba(255,159,10,.16)']:['#00205b','rgba(0,32,91,.08)']);
}
const ORD_EST={'Pendiente':0,'En revisión':1,'Completado':2,'Sin hallazgos':3};
const valDias=d=>d.dias.tipo==='dias'?d.dias.n:d.dias.tipo==='hecho'?1e6:1e7;
// Sin orden elegido: URGENCIA = primero lo que hay que revisar, por prioridad y, dentro de cada una, lo que menos
// plazo tiene (o más lleva esperando). Con una columna elegida, el orden de esa columna (Prioridad incluida).
function ordenarDocs(ds){
  const o=S.orden;
  if(!o) return ds.slice().sort((a,b)=>(b.nec-a.nec)||(PRANGO[a.prio]-PRANGO[b.prio])||(valDias(a)-valDias(b))||(b.pend-a.pend)||a.nombre.localeCompare(b.nombre));
  const val=d=>o.col==='est'?(ORD_EST[d.est]??9):o.col==='dias'?valDias(d):o.col==='prio'?PRANGO[d.prio]:String(d[o.col]||'').toLowerCase();
  const s=o.dir==='asc'?1:-1;
  return ds.slice().sort((a,b)=>{const x=val(a),y=val(b); return (x<y?-1:x>y?1:0)*s||a.nombre.localeCompare(b.nombre);});
}

function norm(s){return String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
const VACIAS=new Set('que cual cuales como donde cuando cuanto cuantos cuantas los las del con por para una uno unos unas sobre hay tiene tienen esta estan este esto son ver dame muestrame ensename busca buscar quiero necesito lista listado the and with for show find what which how many are of in on to me all todos todas'.split(' '));
function palabras(s){return norm(s).split(/[^a-z0-9.\-]+/).filter(w=>w.length>2&&!VACIAS.has(w));}
function listaH(hits){return hits.slice(0,6).map(h=>`<mark>${esc(h.documento)} · ${esc(h.ubicacion)}</mark>`).join(', ')+(hits.length>6?'…':'');}
function plural(n,uno,varios){return `${n} ${n===1?uno:varios}`;}

function answer(q){
  const s=norm(q).trim(), ws=palabras(q);
  const partes=[], ctas=[], vistos=new Set();
  const add=(label,detalle,dest)=>{const k=JSON.stringify(dest); if(vistos.has(k)) return; vistos.add(k); ctas.push({label,detalle,dest});};
  const verH=(hits,txt,extra={})=>add(`Ver ${plural(hits.length,'hallazgo','hallazgos')} en Histórico`,`Histórico · ${txt}`,
    {view:'historico',hl:hits.map(key),hlTxt:txt,...extra});
  const hablaDocs=/document|expedient|archivo/.test(s), hablaHall=/hallazg|defect|finding/.test(s);

  // 1. Hallazgos: tipo, cláusula, documento concreto, decisiones
  const TIPOS_N=[['no verificable','No verificable'],['inconsist','Inconsistencia'],['no cumple','No cumple'],['incumpl','No cumple'],
                 ['cobertura','Cobertura faltante'],['trazab','Trazabilidad incorrecta']];
  const tipo=(TIPOS_N.find(([k])=>s.includes(k))||[])[1];
  const cl=s.match(/(?:is\.?i\.?or\.?\s*)?\b(2[0-6]\d)\b/);
  const doc=Object.keys(DOCS).find(c=>s.includes(norm(c)));
  let base=doc?RES.filter(r=>r.documento===doc):RES;
  if(tipo){
    const hits=base.filter(r=>r.tipo===tipo);
    partes.push(hits.length?`Hay ${plural(hits.length,'hallazgo','hallazgos')} de tipo <b>${esc(tipo)}</b>${doc?' en '+esc(doc):''}: ${listaH(hits)}.`:`No hay hallazgos de tipo <b>${esc(tipo)}</b>${doc?' en '+esc(doc):''}.`);
    if(hits.length) add(`Ver «${tipo}» en Histórico`,`Histórico · Tipo: ${tipo}${doc?' · '+doc:''}`,{view:'historico',tipo,q:doc||''});
  }
  if(cl){
    const c='IS.I.OR.'+cl[1], hits=base.filter(r=>r.clausula===c);
    partes.push(hits.length?`La cláusula <b>${c}</b> aparece en ${plural(hits.length,'hallazgo','hallazgos')}: ${listaH(hits)}.`:`Ningún hallazgo cita la cláusula <b>${c}</b>.`);
    if(hits.length) verH(hits,'Cláusula '+c);
  }
  const dec=/aprobad|approved/.test(s)?'approved':/rechazad|rejected/.test(s)?'rejected':null;
  if(dec){
    const hits=base.filter(r=>decOf(r)&&decOf(r).dec===dec), txt=DECTXT[dec];
    partes.push(hits.length?`Has marcado como <b>${txt.toLowerCase()}</b> ${plural(hits.length,'hallazgo','hallazgos')}: ${listaH(hits)}.`:`Todavía no hay hallazgos ${txt.toLowerCase()}s.`);
    if(hits.length) verH(hits,'Decisión: '+txt);
  }
  if(/pendient|sin decid|sin revis|por revis/.test(s)&&(hablaHall||doc)&&!hablaDocs){
    const hits=base.filter(r=>!decOf(r));
    partes.push(`Quedan ${plural(hits.length,'hallazgo','hallazgos')} sin decisión${doc?' en '+esc(doc):''}.`);
    if(hits.length) verH(hits,'Sin decisión'+(doc?' · '+doc:''));
  }
  if(doc){
    const info=DOCS[doc], rs=RES.filter(r=>r.documento===doc);
    partes.push(`<b>${esc(doc)}</b> · ${esc(info.titulo)} (v${esc(info.version)}, ${esc(info.familia)}): ${plural(rs.length,'hallazgo','hallazgos')}, estado <b>${esc(estadoDoc(rs))}</b>.`);
    if(rs.length) add(`Revisar ${doc} junto al PDF`,'Revisión · '+plural(rs.length,'hallazgo','hallazgos'),{view:'revision',doc});
  }

  // 2. Documentos (Inicio): estado y familia
  const EST_N=[['sin hallazgo','Sin hallazgos'],['en revision','En revisión'],['complet','Completado'],['terminad','Completado'],['pendient','Pendiente']];
  const iest=(EST_N.find(([k])=>s.includes(k))||[])[1];
  const familias=[...new Set(Object.values(DOCS).map(d=>d.familia))];
  const fam=familias.find(f=>s.includes(norm(f)))||familias.find(f=>palabras(f).some(w=>w.length>5&&ws.includes(w)));
  if((hablaDocs||fam||(iest&&!hablaHall&&!doc))&&(iest||fam)){
    const docsF=Object.keys(DOCS).filter(c=>{const rs=RES.filter(r=>r.documento===c);return (!iest||estadoDoc(rs)===iest)&&(!fam||DOCS[c].familia===fam);});
    const cual=[iest&&`estado «${iest}»`,fam&&`familia «${fam}»`].filter(Boolean).join(' y ');
    partes.push(`Hay ${plural(docsF.length,'documento','documentos')} con ${esc(cual)}${docsF.length?': '+docsF.slice(0,6).map(c=>`<mark>${esc(c)}</mark>`).join(', ')+(docsF.length>6?'…':''):''}.`);
    add('Ver documentos en Auditorías',`Auditorías · ${[iest&&'Estado: '+iest,fam&&'Familia: '+fam].filter(Boolean).join(' · ')}`,{view:'inicio',iest:iest||'',itipo:fam||''});
  }

  // 3. Panel de control IA: métricas y agentes
  let ag=ETAPAS.findIndex(e=>s.includes(norm(e.n)));            // nombre completo del agente, o «agente» + una palabra suya
  if(ag<0&&/agente/.test(s)) ag=ETAPAS.findIndex(e=>palabras(e.n).some(w=>w.length>4&&w!=='agente'&&ws.includes(w)));
  if(MET&&/\bf1\b|precis|recall|exhaust|metric|puntu|resultado|clave|rendimiento|acierto/.test(s)){
    partes.push(`Resultado frente a la clave: F1 <b>${esc(MET.f1)}</b>, precisión ${esc(MET.precision)}, recall ${esc(MET.recall)}, defectos encontrados ${esc(MET.encontrados)}.`);
    add('Ver métricas en el Panel de control IA','Panel de control IA · Resultado frente a la clave',{view:'ia'});
  }
  if(ag>=0||/agente|flujo|pipeline|descart|registro de ejec|log\b/.test(s)){
    const e=ETAPAS[ag>=0?ag:0];
    partes.push(ag>=0?`<b>Agente ${ag+1} · ${esc(e.n)}</b>: ${esc(e.d)}`:`La solución tiene ${ETAPAS.length} agentes: ${ETAPAS.map((x,i)=>`${i+1}. ${esc(x.n)}`).join(' · ')}.`);
    add(ag>=0?`Ver el agente ${ag+1} en el Panel de control IA`:'Ver el flujo de agentes',`Panel de control IA${ag>=0?' · Agente '+(ag+1)+' abierto':''}`,{view:'ia',agente:ag>=0?ag:null});
  }

  // 4. Configuración: reglas, criterio de aceptación, equipo
  if(/regla|umbral|criterio|aceptac|\bv[1-5]\b|jerarq|std-sec|lista-doc|normativ|verificador/.test(s)){
    partes.push(`Hay ${plural((S.reglas||[]).filter(r=>r.activa).length,'regla de aceptación activa','reglas de aceptación activas')}${(S.reglas||[]).length?': '+(S.reglas||[]).filter(r=>r.activa).map(r=>`<b>${esc(r.nombre)}</b> (${esc(textoRegla(r))})`).join(', '):''}. Están en Configuración → Reglas, junto al plazo de respuesta y las reglas del verificador (V1 a V5).`);
    add('Ir a Configuración · Reglas','Configuración · Reglas y criterio de aceptación',{view:'reglas'});
  }
  const persona=S.equipo.find(m=>ws.includes(norm(m.n)));
  if(persona){
    const hits=RES.filter(r=>decOf(r)&&decOf(r).user===persona.n);
    partes.push(`<b>${esc(persona.n)}</b> es ${esc(nombreRol(persona.rol))} (${esc(persona.c)}) y ha decidido ${plural(hits.length,'hallazgo','hallazgos')}.`);
    if(hits.length) verH(hits,'Decididos por '+persona.n);
    add(`Ver a ${persona.n} en Usuarios y roles`,'Configuración · Usuarios y roles',{view:'usuarios'});
  } else if(/equipo|usuario|rol\b|roles|miembro|admin|aprobador|revisor|quien/.test(s)){
    partes.push(`El equipo tiene ${plural(S.equipo.length,'persona','personas')}: ${S.equipo.map(m=>`${esc(m.n)} (${esc(nombreRol(m.rol))})`).join(', ')}.`);
    add('Ir a Usuarios y roles','Configuración · Usuarios y roles',{view:'usuarios'});
  }

  // 5. Chat del equipo
  if(/chat|mensaje|canal|conversa/.test(s)){
    partes.push(SRV?`Hay ${plural((S.mensajes||[]).length,'mensaje','mensajes')} en ${plural((S.chats||[]).length,'chat','chats')}.`:'El chat del equipo necesita la revisión en equipo (python servidor.py).');
    add('Ir al Chat','Chat · #'+(S.canal||'general'),{view:'chat',canal:S.canal||'general'});
  }

  // 6. Sin intención clara: búsqueda por texto en hallazgos, documentos y mensajes
  if(!partes.length&&ws.length){
    const hits=RES.filter(r=>{const t=norm(r.documento+' '+r.ubicacion+' '+r.justificacion+' '+r.tipo+' '+(r.leido||''));return ws.some(w=>t.includes(w));});
    if(hits.length){partes.push(`Encontré ${plural(hits.length,'hallazgo que menciona','hallazgos que mencionan')} «${esc(q.trim())}»: ${listaH(hits)}.`); verH(hits,'Texto: '+q.trim());}
    const docsT=Object.keys(DOCS).filter(c=>ws.some(w=>norm(c+' '+DOCS[c].titulo).includes(w)));
    if(docsT.length){partes.push(`${plural(docsT.length,'documento coincide','documentos coinciden')}: ${docsT.slice(0,6).map(c=>`<mark>${esc(c)}</mark>`).join(', ')}${docsT.length>6?'…':''}.`);
      add('Ver documentos en Auditorías','Auditorías · Búsqueda: '+ws[0],{view:'inicio',iq:ws[0]});}
    const msgs=(S.mensajes||[]).filter(m=>ws.some(w=>norm(m.texto).includes(w)));
    if(msgs.length){partes.push(`También aparece en ${plural(msgs.length,'mensaje','mensajes')} del chat.`); add('Ver en el Chat','Chat · #'+msgs[msgs.length-1].canal,{view:'chat',canal:msgs[msgs.length-1].canal});}
  }
  const text=partes.length?partes.join('<br><br>')
    :'No encuentro nada con esos términos. Prueba con un tipo de hallazgo («no cumple»), una cláusula («IS.I.OR.230»), un código de documento, «documentos pendientes», «F1», «reglas» o el nombre de alguien del equipo.';
  return {text,ctas:ctas.slice(0,4),vacia:!partes.length};
}

// ---------- Asistente IA con modelo (RAG local: ChromaDB + Llama en Ollama, vía servidor.py → _rag/servidor_rag.py).
// Primero se enseña al instante la búsqueda en la app (con sus botones «Ver…»); después llega la respuesta del modelo,

const plano=h=>{const d=document.createElement('div'); d.innerHTML=h; return d.textContent||'';};
// Datos ya calculados de la app para el Asistente IA (la IA no cuenta ni resta: solo lee estas cifras)
function fIA(f){return String(f||'').replace('T',' ').slice(0,16);}
function estadoApp(q){
  const s=' '+norm(q)+' ', yo=S.user.nombre||'', L=[];
  const hay=(...ws)=>ws.some(w=>s.includes(w));
  const nombres=S.equipo.map(p=>p.n), citado=nombres.filter(n=>s.includes(norm(n)));
  const h=new Date(), dd=n=>String(n).padStart(2,'0');
  L.push(`Fecha y hora actual: ${h.getFullYear()}-${dd(h.getMonth()+1)}-${dd(h.getDate())} ${dd(h.getHours())}:${dd(h.getMinutes())}. Usuario que pregunta: ${yo||'(sin nombre)'} · rol: ${miRol()?nombreRol(miRol()):'sin rol'}.`);
  // Revisión de hallazgos
  const decs=RES.map(r=>decOf(r)), apr=decs.filter(d=>d&&d.dec==='approved').length, rec=decs.filter(d=>d&&d.dec==='rejected').length;
  L.push(`Revisión del equipo: ${RES.length} hallazgos en total; ${apr} aprobados, ${rec} rechazados y ${RES.length-apr-rec} sin decidir (pendientes de revisar).`);
  const porDoc={}; RES.forEach(r=>(porDoc[r.documento]=porDoc[r.documento]||[]).push(r));
  const ix=indiceDocs(), est={}; Object.keys(DOCS).forEach(d=>{const e=estadoDocDe(d,ix.get(d)); (est[e]=est[e]||[]).push(d);});
  L.push('Documentos por estado: '+['Pendiente','En revisión','Completado','Sin hallazgos'].map(e=>`${e} ${(est[e]||[]).length}`).join(', ')+'.');
  if(hay('document','complet','estado','en revision','terminad'))
    ['Completado','En revisión'].forEach(e=>{if(est[e]) L.push(`Documentos «${e}»: ${est[e].slice(0,25).join(', ')}.`);});
  if(hay('pendiente','falta','queda','revisar','sin decidir')){
    const top=Object.entries(porDoc).map(([d,rs])=>[d,rs.filter(r=>!decOf(r)).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).slice(0,8);
    if(top.length) L.push('Documentos con más hallazgos pendientes: '+top.map(([d,n])=>`${d} (${n})`).join(', ')+'.');
  }
  // Prioridad, plazos, escalados, compartidos y cargados (Daniela y Valentina)
  if(hay('prioridad','urgente','vencid','plazo','antigu','atrasad')){
    const pr={Alta:[],Media:[],Baja:[]}, venc=[];
    Object.keys(DOCS).forEach(d=>{const x=ix.get(d); pr[prioridadDe(d,x)].push(d); const r=diasRestantes(estadoDocDe(d,x),d); if(r.tipo==='dias'&&r.n<0) venc.push(d);});
    L.push(`Documentos por prioridad: Alta ${pr.Alta.length}, Media ${pr.Media.length}, Baja ${pr.Baja.length}.`);
    L.push(`Documentos de prioridad alta: ${pr.Alta.slice(0,20).join(', ')||'ninguno'}.`);
    L.push(`Documentos vencidos (plazo de respuesta pasado): ${venc.length}${venc.length?': '+venc.slice(0,20).join(', '):''}.`);
    const c=S.config||{}; if(c.inicio) L.push(`Plazo de respuesta de la auditoría: ${c.plazo_dias||15} días desde ${c.inicio}.`);
  }
  if(hay('escal','dueno','dueño')){
    const es=Object.entries(S.escalados||{});
    L.push(`Documentos escalados: ${es.length}${es.length?': '+es.map(([d,e])=>`${d} a ${e.para}`).join(', '):''}.`);
    const mios=es.filter(([d,e])=>e.para===yo).map(([d])=>d);
    L.push(`Documentos escalados a ti: ${mios.length}${mios.length?': '+mios.join(', '):''}.`);
  }
  if(hay('compart')){
    const cs=S.compartidos||[], conmigo=cs.filter(c=>c.para.includes(yo)), mios=cs.filter(c=>c.de===yo);
    L.push(`Documentos compartidos contigo: ${conmigo.length}${conmigo.length?': '+conmigo.slice(-8).map(c=>`${c.doc} (de ${c.de}, ${fIA(c.fecha)})`).join('; '):''}.`);
    L.push(`Documentos que has compartido: ${mios.length}${mios.length?': '+mios.slice(-8).map(c=>`${c.doc} con ${c.para.join(', ')}`).join('; '):''}.`);
  }
  if(hay('cargad','subid','subio')){
    const cg=S.cargados||[];
    L.push(`Documentos cargados a mano: ${cg.length}${cg.length?': '+cg.slice(-10).map(c=>`${c.archivo} (por ${c.user}, ${fIA(c.fecha)})`).join('; '):''}.`);
  }
  // Decisiones por persona
  const quien={}; Object.values(S.dec||{}).forEach(d=>{if(d&&d.user){const c=quien[d.user]=quien[d.user]||{a:0,r:0}; d.dec==='approved'?c.a++:c.r++;}});
  nombres.forEach(n=>{const c=quien[n]; L.push(c?`Decisiones de ${n}${n===yo?' (tú)':''}: ${n} ha aprobado ${c.a} y ha rechazado ${c.r} hallazgos.`
    :`Decisiones de ${n}${n===yo?' (tú)':''}: ${n} no ha aprobado ni rechazado ningún hallazgo (0 decisiones).`);});
  const objetivo=citado.length?citado:(hay(' mis ',' yo ',' he ',' mias ',' mios ')?[yo]:[]);
  if(hay('aprob','rechaz','decid','decision','revis')) objetivo.forEach(n=>{
    const ls=Object.entries(S.dec||{}).filter(([k,d])=>d&&d.user===n).slice(-10);
    if(ls.length) L.push(`Hallazgos decididos por ${n}: `+ls.map(([k,d])=>`${k.replace('|',' · ')} → ${DECTXT[d.dec]} (${fIA(d.fecha)}${d.note?', comentario «'+String(d.note).slice(0,60)+'»':''})`).join('; ')+'.');
  });
  // Ediciones, versiones, comentarios y lo que la IA no vio
  const ed=Object.entries(S.ediciones||{}).filter(([k,v])=>v&&v.length);
  L.push(`Hallazgos editados: ${ed.length}.`+(ed.length&&hay('edit','modific','cambi')?' '+ed.slice(0,10).map(([k,v])=>`${k.replace('|',' · ')} (última edición de ${v[v.length-1].user}, ${fIA(v[v.length-1].fecha)})`).join('; ')+'.':''));
  const vs=Object.entries(S.versiones||{}).filter(([d,v])=>v&&v.length);
  if(hay('version')) L.push('Versiones de PDF guardadas: '+(vs.length?vs.map(([d,v])=>`${d}: ${v.length} versiones (la última de ${v[v.length-1].user}, ${fIA(v[v.length-1].fecha)})`).join('; '):'ninguna')+'.');
  if(hay('coment','debate')) L.push(`Comentarios en hallazgos: ${(S.coms||[]).length}.`+(S.coms||[]).slice(-5).map(c=>` ${c.user} (${fIA(c.fecha)}) en ${String(c.key).replace('|',' · ')}: «${String(c.texto).slice(0,80)}»`).join(';'));
  if(hay('no vio','no detect','extra','añadid','anadid')) L.push(`Comentarios de «lo que la IA no vio»: ${(S.extra||[]).length}.`);
  // Chat y avisos: solo lo que esta persona puede ver
  if(SRV&&hay('mensaje','chat','escrib','mencion','leid','notific','aviso','canal','grupo','privad','mandaron','enviaron','dijo','dicho','hablad')){
    const sin=(S.avisos||[]).filter(a=>!a.leido), chats=S.chats||[], nc=id=>nombreChat(chats.find(c=>c.id===id))||id;
    const porChat=chats.map(c=>[nombreChat(c),sin.filter(a=>a.key==='chat:'+c.id).length]).filter(x=>x[1]);
    L.push(`Mensajes y avisos sin leer en total: tienes ${sin.length} sin leer`+(porChat.length?' ('+porChat.map(([n,k])=>`${n}: ${k}`).join(', ')+')':'')+'.');
    const menc=sin.filter(a=>a.mencion||!String(a.key).startsWith('chat:'));
    L.push(`Menciones sin leer: ${menc.length}.`+menc.slice(-5).map(a=>` ${a.de} (${fIA(a.fecha)}): «${String(a.texto||'').slice(0,80)}»`).join(';'));
    chats.forEach(c=>{const ms=(S.mensajes||[]).filter(m=>m.canal===c.id);
      L.push(`Chat ${c.tipo} ${nombreChat(c)}: tiene ${ms.length} mensajes en total; ${sin.filter(a=>a.key==='chat:'+c.id).length} sin leer para ti.`);});
    const otros=(S.mensajes||[]).filter(m=>m.user!==yo&&(!citado.length||citado.includes(m.user))).slice(-6).reverse();
    if(!otros.length) L.push(citado.length?`Mensajes de ${citado.join(' y ')}: ninguno; no te ha escrito ningún mensaje.`:'Mensajes que te han escrito: ninguno.');
    otros.forEach(m=>L.push(`Mensaje que te escribió ${m.user} en el chat ${nc(m.canal)} el ${fIA(m.fecha)}: «${String(m.texto||'(adjunto)').slice(0,120)}»`));
  }
  if(hay('conectad','en linea','online','quien esta')) L.push('Conectados ahora: '+(nombres.filter(n=>enLinea(n)).join(', ')||'nadie')+'.');
  return L.join('\n');
}
function datosApp(q,a){
  const s=norm(q), ws=palabras(q), L=[estadoApp(q)];
  L.push(`Documentos auditados: ${Object.keys(DOCS).length}. Hallazgos de la solución: ${RES.length}.`);
  if(MET) L.push(`Métricas frente a la clave: F1 ${MET.f1}, precisión ${MET.precision}, recall ${MET.recall}, defectos encontrados ${MET.encontrados}.`);
  if(!a.vacia) L.push('Resultado de la búsqueda en la app: '+plano(a.text));
  const doc=Object.keys(DOCS).find(c=>s.includes(norm(c)));
  const hits=doc?RES.filter(r=>r.documento===doc)
    :RES.filter(r=>{const t=norm(r.documento+' '+r.ubicacion+' '+r.justificacion+' '+r.tipo+' '+r.clausula);return ws.some(w=>t.includes(w));});
  if(doc) L.push(`Documento ${doc}: ${DOCS[doc].titulo} (v${DOCS[doc].version}, ${DOCS[doc].familia}).`);
  hits.slice(0,15).forEach(r=>{const d=decOf(r);
    L.push(`- Hallazgo ${r.documento} · ${r.ubicacion} · ${r.tipo} · ${r.clausula}${d?' · decisión: '+DECTXT[d.dec]:''} · ${String(r.justificacion||'').slice(0,220)}`);});
  return L.join('\n').slice(0,6000);
}
function textoIA(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');}
function bajarAsis(){const m=document.getElementById('msgs'); if(m) m.scrollTop=m.scrollHeight;}

async function preguntarIA(q,a){
  const historial=S.msgs.filter(m=>m.r==='u'||m.ia).slice(-7,-1).map(m=>({r:m.r,t:plano(m.t).slice(0,600)}));
  const m={r:'a',ia:true,t:'<span class="small">Leyendo los documentos…</span>'};
  S.msgs.push(m); render(); bajarAsis();
  try{
    const r=await fetch('/api/asistente',{method:'POST',headers:{'Content-Type':'application/json','X-Sesion':S.token||''},
      body:JSON.stringify({user:S.user.nombre||'anon',pregunta:q.trim(),datos_app:datosApp(q,a),historial})});
    const d=await r.json();
    if(!r.ok||d.error) throw new Error(d.error||r.status);
    const fu=([]).map(f=>`<mark>${esc(f.split('/').pop())}</mark>`).join(' ');
    m.t=`<b>Asistente IA</b><br>${textoIA(d.respuesta)}${fu?`<div class="small" style="margin-top:6px">Fuentes: ${fu}</div>`:''}`;
  }catch(e){
    m.t=`<span class="small">El asistente con IA no responde (${esc(String(e.message||e))}). Arriba tienes lo que encontré en la app.</span>`;
  }
  render(); bajarAsis();
}

function sendChat(q){
  if(!q||!q.trim()) return;
  S.msgs.push({r:'u',t:esc(q.trim())});
  const a=answer(q);
  if(!(SRV&&a.vacia)) S.msgs.push({r:'a',t:a.text,ctas:a.ctas});   // con IA, no enseñar «no encuentro nada»

let _arrastre=null;
document.addEventListener('pointerdown',e=>{
  const f=e.target.closest&&e.target.closest('.fab'); if(!f||e.button!==0) return;
  const r=f.getBoundingClientRect();
  _arrastre={f,dx:e.clientX-r.left,dy:e.clientY-r.top,x0:e.clientX,y0:e.clientY,movido:false};
  try{f.setPointerCapture(e.pointerId);}catch(err){}
});
document.addEventListener('pointermove',e=>{
  if(!_arrastre) return;
  if(!_arrastre.movido&&Math.hypot(e.clientX-_arrastre.x0,e.clientY-_arrastre.y0)<6) return;   // un clic normal no mueve nada
  _arrastre.movido=true;

// Histórico con el mismo esquema que Auditorías: título con botón principal, filtros con título en una línea,
// columnas ordenables, filas como tarjetas y paginador abajo. Cada fila es un hallazgo; al abrirla se ve el documento
// en consulta histórica (sin columna de decisiones) y «Volver» regresa aquí.
const DEC_FIL={'':'Todas',approved:'Aprobado',rejected:'Rechazado',pend:'Sin decisión'};
function vHist(){
  const q=(S.q||'').trim().toLowerCase(), h=new Set(S.hl);
  let rows=RES.filter(r=>{const d=decOf(r), dv=d?d.dec:'pend';
    return (!S.tipo||r.tipo===S.tipo)&&(!S.hfcla||r.clausula===S.hfcla)&&(!S.hfdec||S.hfdec===dv)
      &&(!q||(r.documento+' '+r.ubicacion+' '+r.justificacion+' '+((DOCS[r.documento]||{}).titulo||'')).toLowerCase().includes(q));});
  if(S.soloHl&&S.hl.length) rows=rows.filter(r=>h.has(key(r)));
  // orden por columna
  const o=S.horden;
  if(o){const val=r=>o.col==='hallazgo'?(r.documento+' '+r.ubicacion).toLowerCase():o.col==='tipo'?r.tipo:o.col==='clausula'?(r.clausula||''):(decOf(r)?DECTXT[decOf(r).dec]:'~');
    const sg=o.dir==='asc'?1:-1; rows=rows.slice().sort((a,b)=>{const x=val(a),y=val(b); return (x<y?-1:x>y?1:0)*sg;});}
  // paginador (vuelve a la página 1 si cambian filtros u orden)
  const firma=JSON.stringify([S.q,S.tipo,S.hfcla,S.hfdec,S.horden,S.hporPag,S.soloHl,S.hl.length]);
  if(firma!==S._hfirma){S._hfirma=firma; S.hpag=1;}
  const porPag=S.hporPag||10, nPag=Math.max(1,Math.ceil(rows.length/porPag)); S.hpag=Math.min(Math.max(1,S.hpag||1),nPag);
  const desde=(S.hpag-1)*porPag, pagina=rows.slice(desde,desde+porPag);
  const campo=(t,html,cls='',para='')=>`<div class="fcampo ${cls}">${para?`<label class="ftit" for="${para}">${t}</label>`:`<span class="ftit">${t}</span>`}${html}</div>`;
  const clausulas=[...new Set(RES.map(r=>r.clausula).filter(Boolean))].sort();
  const filtros=`<div class="ffil">
      ${campo('Buscar',`<input id="flt" type="search" placeholder="Documento, ubicación o texto" value="${esc(S.q||'')}">`,'fbus','flt')}

      ${campo('Cláusula',`<select id="hfcla"><option value="">Todas</option>${clausulas.map(c=>`<option ${S.hfcla===c?'selected':''}>${esc(c)}</option>`).join('')}</select>`,'','hfcla')}
      ${campo('Decisión',`<select id="hfdec">${Object.entries(DEC_FIL).map(([v,l])=>`<option value="${v}" ${(S.hfdec||'')===v?'selected':''}>${l}</option>`).join('')}</select>`,'','hfdec')}
    </div>`;
  const COLS=[['hallazgo','Hallazgo'],['tipo','Motivo'],['clausula','Cláusula'],['decision','Decisión']];
  const cab=`<div class="dcab hcab" role="row">${COLS.map(([k,l])=>{const on=o&&o.col===k, dir=on?o.dir:'';
      return `<button class="dcol ${on?'on':''} ${k==='decision'?'der':''}" data-act="hordenar" data-v="${k}" aria-sort="${on?(dir==='asc'?'ascending':'descending'):'none'}" title="Ordenar por ${l.toLowerCase()}">${l}<span class="flecha-ord" aria-hidden="true">${on?(dir==='asc'?'▲':'▼'):'↕'}</span></button>`;}).join('')}</div>`;
  const filas=pagina.map(r=>{const d=decOf(r), c=TCOL[r.tipo]||GRIS, info=DOCS[r.documento]||{};
    return `<div class="drow hrowc ${h.has(key(r))?'hl':''}" style="--c:${c[0]}" data-act="abrirH" data-doc="${esc(r.documento)}" data-u="${esc(r.ubicacion)}" role="button" tabindex="0" aria-label="Abrir ${esc(r.documento)} · ${esc(r.ubicacion)}">
      <div><div class="cod">${esc(r.ubicacion)}</div><div class="small">${esc(r.documento)}${info.familia?' · '+esc(info.familia):''}</div></div>
      <div><div style="margin-bottom:4px">${pill(esc(r.tipo),c)}</div><div class="small hjust">${esc(r.justificacion)}</div></div>
      <div class="small">${esc(r.clausula||'—')}</div>
      <div class="estado">${d?pill(DECTXT[d.dec],d.dec==='approved'?['#248a3d','rgba(52,199,89,.14)']:['#d70015','rgba(255,59,48,.12)']):pill('Sin decisión',GRIS)}${d?`<div class="small" style="margin-top:4px">${esc(d.user||'')}${d.fecha?' · '+fmtFecha(d.fecha):''}</div>`:''}</div>
    </div>`;}).join('');
  const nums=(()=>{const b=[]; for(let i=1;i<=nPag;i++){if(i===1||i===nPag||Math.abs(i-S.hpag)<=1) b.push(i); else if(b[b.length-1]!=='…') b.push('…');} return b;})();
  const pie=`<div class="dpie">
      <span class="small">${rows.length?`${desde+1}–${desde+pagina.length} de ${rows.length} hallazgos`:'0 hallazgos'}${rows.length!==RES.length?` (de ${RES.length})`:''}</span>
      <nav class="pager" aria-label="Paginación">
        <button class="ghost" data-act="hpag" data-v="${S.hpag-1}" ${S.hpag<=1?'disabled':''} aria-label="Página anterior">‹</button>
        ${nums.map(n=>n==='…'?'<span class="small">…</span>':`<button class="${n===S.hpag?'on':'ghost'}" data-act="hpag" data-v="${n}" ${n===S.hpag?'aria-current="page"':''}>${n}</button>`).join('')}
        <button class="ghost" data-act="hpag" data-v="${S.hpag+1}" ${S.hpag>=nPag?'disabled':''} aria-label="Página siguiente">›</button>

  const hayFil=S.q||S.tipo||S.hfcla||S.hfdec;
  const pR=puede('historico','descargar_respuestas'), pV=puede('historico','descargar_revision');
  const chip=S.soloHl&&S.hl.length?`<div class="chipf" style="margin:0 0 12px">Filtro del asistente: ${esc(S.hlTxt)}<button data-act="limpiarHl" aria-label="Quitar el filtro del asistente">Quitar ×</button></div>`:'';
  return `<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><h2 style="margin:0">Histórico</h2>
      ${hayFil?'<button class="enlace" data-act="hlimpiar">Limpiar filtros</button>':''}
      ${pR||pV?`<button class="btn-principal" data-act="menuExp" aria-expanded="${!!S.expOpen}" style="margin-left:auto;border:0">Exportar</button>`:''}</div>
    ${S.expOpen&&(pR||pV)?`<div class="card" style="margin-bottom:12px">${menuExportar().replace(/<button class="ok" data-act="menuExp"[^>]*>[^<]*<\/button>/,'')}</div>`:''}
    ${chip}${filtros}
    ${rows.length?cab:''}
    <div class="dlist">${filas||'<div class="card small">Ningún hallazgo coincide con el filtro.</div>'}</div>
    ${pie}`;
}

// ---------- Reglas de aceptación: deciden si un documento con todos sus hallazgos decididos se APRUEBA, se RECHAZA o
// pasa a REVISIÓN MANUAL. Cada regla es una condición sobre los hallazgos aprobados por el auditor; si no se cumple,
// aplica su efecto. Se guardan en el servidor (comunes al equipo); aquí se evalúan con los datos de la pantalla.
const TIPOS_REGLA=[
  {id:'porcentaje_aprobados',n:'Porcentaje mínimo de aceptación',d:'El porcentaje de hallazgos aprobados por el auditor tiene que llegar a un mínimo.',params:[['min_pct','Mínimo (%)','num',0,100,80]]},
  {id:'max_hallazgos_tipo',n:'Máximo de hallazgos de un tipo',d:'Limita cuántos hallazgos aprobados de un tipo admite el documento (por ejemplo, 0 «No cumple»).',params:[['tipo','Tipo de hallazgo','tipo'],['max','Máximo permitido','num',0,999,0]]},
  {id:'clausula_critica',n:'Cláusula crítica',d:'Ningún hallazgo aprobado puede afectar a esta cláusula de la Part-IS.',params:[['clausula','Cláusula','clausula']]},
  {id:'confianza_minima',n:'Confianza mínima de la IA',d:'Todos los hallazgos aprobados deben tener al menos esta confianza; si no, conviene revisarlos a mano.',params:[['min_pct','Confianza mínima (%)','num',0,100,70]]},
  {id:'plazo_respuesta',n:'Respuesta dentro de plazo',d:'La última decisión del documento tiene que estar dentro del plazo de respuesta (Reglas → Plazo de respuesta).',params:[]}];
const EFECTO_TXT={rechazar:'Rechazar el documento',revisar:'Enviar a revisión manual'};
function tipoRegla(id){return TIPOS_REGLA.find(t=>t.id===id)||TIPOS_REGLA[0];}
function textoRegla(r){
  const p=r.params||{};
  return {porcentaje_aprobados:`Aprobados ≥ ${p.min_pct} %`,max_hallazgos_tipo:`Como mucho ${p.max} «${p.tipo}»`,
    clausula_critica:`Sin hallazgos en ${p.clausula}`,confianza_minima:`Confianza ≥ ${p.min_pct} %`,plazo_respuesta:'Decisión dentro de plazo'}[r.tipo]||r.tipo;
}
function efTipo(r){const e=edicionDe(r); return e?e.tipo:r.tipo;}
function efClausula(r){const e=edicionDe(r); return e?e.clausula:r.clausula;}
// ¿Cumple el documento la regla? Devuelve null si cumple, o el motivo si no.
function fallaRegla(regla,doc,rs){
  const dec=rs.filter(r=>decOf(r)), ap=dec.filter(r=>decOf(r).dec==='approved'), p=regla.params||{};
  if(regla.tipo==='porcentaje_aprobados'){const pct=dec.length?Math.round(ap.length/dec.length*100):100; return pct<p.min_pct?`${pct} % aprobados (mínimo ${p.min_pct} %)`:null;}
  if(regla.tipo==='max_hallazgos_tipo'){const n=ap.filter(r=>efTipo(r)===p.tipo).length; return n>p.max?`${n} hallazgos «${p.tipo}» (máximo ${p.max})`:null;}
  if(regla.tipo==='clausula_critica'){const n=ap.filter(r=>efClausula(r)===p.clausula).length; return n?`${n} hallazgo${n>1?'s':''} en ${p.clausula}`:null;}
  if(regla.tipo==='confianza_minima'){const n=ap.filter(r=>Math.round((r.conf||0)*100)<p.min_pct).length; return n?`${n} con confianza menor del ${p.min_pct} %`:null;}
  if(regla.tipo==='plazo_respuesta'){const c=S.config||{}; if(!c.inicio||!dec.length) return null;
    const limite=Date.parse(c.inicio)+((c.plazo_dias||15)+1)*86400000, ult=Math.max(...dec.map(r=>Date.parse(decOf(r).fecha)||0));
    return ult>limite?'Decidido fuera de plazo':null;}
  return null;
}
// Veredicto de un documento: solo cuando todos sus hallazgos están decididos
function evaluarDoc(doc,reglas){
  const rs=RES.filter(r=>r.documento===doc);
  if(!rs.length) return {v:'Sin hallazgos',fallos:[]};
  if(rs.some(r=>!decOf(r))) return {v:'En revisión',fallos:[]};
  const fam=(DOCS[doc]||{}).familia;
  const fallos=(reglas||S.reglas||[]).filter(r=>r.activa&&(!r.familia||r.familia===fam))
    .map(r=>({regla:r,motivo:fallaRegla(r,doc,rs)})).filter(x=>x.motivo);
  return {v:fallos.some(x=>x.regla.efecto==='rechazar')?'Rechazado':fallos.length?'Revisión manual':'Aprobado',fallos};
}
const VCOL={Aprobado:['#248a3d','rgba(52,199,89,.14)'],Rechazado:['#d70015','rgba(255,59,48,.12)'],'Revisión manual':['#c76a00','rgba(255,159,10,.16)']};

      :`<div class="vacio">Todavía no hay reglas: todos los documentos decididos se aprobarían.${ok?' Pulsa «Crear regla» para añadir la primera.':''}</div>`}
    ${ok?'':`<p class="note">${esc(sinPermiso('configuracion','gestionar_reglas'))}</p>`}
    <p class="note">Aplica a: ${esc(fams.length)} familias de documentos. Los veredictos se ven en Auditorías (columna Estado) y en el detalle de cada revisión.</p></div>`;

// La barra del editor no roba el foco: así «Negrita» o «+ Fila» actúan donde está el cursor
document.addEventListener('mousedown',e=>{if(e.target.closest&&e.target.closest('.ed-barra button')) e.preventDefault();});
document.addEventListener('click',e=>{
  if(S.asigOpen&&!e.target.closest('.fasig')){S.asigOpen=false; render();}
  if(!e.target.closest('.usrwrap')&&!document.getElementById('menuUsr').classList.contains('hidden')) menuUsr(false);
  if(S.avisosOpen&&!e.target.closest('#avisos,#bell')){S.avisosOpen=false; pintarBarra(); aplicarIdioma();}
  if(S.sug&&!e.target.closest('#sugMenc,#ctx,#ccom')) cerrarSug();
  const el=e.target.closest('[data-act]');
  if(!el||el.disabled) return;
  const a=el.dataset.act;
  if(a==='elegirMencion'){elegirMencion(el.dataset.v); return;}
  if(a==='editarMsg'){
    const m=(S.mensajes||[]).find(x=>x.id===Number(el.dataset.id));
    if(!m||minEditables(m)<=0){aviso(`Solo se puede editar un mensaje durante ${EDITAR_MIN} minutos`); render(); return;}
    S.editMsg=Number(el.dataset.id); S.editTxt=undefined; render(); const t=document.getElementById('eMsg'); if(t){t.focus(); t.setSelectionRange(t.value.length,t.value.length);} return;}
  if(a==='cancelarMsg'){S.editMsg=null; S.editTxt=undefined; render(); return;}
  if(a==='guardarMsg'){
    const id=Number(el.dataset.id), texto=(document.getElementById('eMsg').value||'').trim();
    api('/api/mensaje/editar',{id,texto}).then(r=>{if(r.ok){S.editMsg=null; S.editTxt=undefined; sondear();}});
    return;
  }
  if(a==='quitarPend'){S.pend.splice(Number(el.dataset.i),1); render(); return;}
  if(a==='lang'){S.lang=el.dataset.v; try{localStorage.setItem('rv_lang',S.lang);}catch(err){} render(); return;}
  if(a==='avisos'){S.avisosOpen=!S.avisosOpen; pintarBarra(); aplicarIdioma(); return;}
  if(a==='borrarAviso'){                                      // × de una tarjeta, o «Borrar todas» (clave vacía)
    const k=el.dataset.k;
    S.avisos=(S.avisos||[]).filter(x=>k&&x.key!==k);
    pintarBarra(); aplicarIdioma(); api('/api/avisos/borrar',k?{key:k}:{});
    return;
  }
  if(a==='expAviso'){                                         // desplegar / plegar el montón (no marca nada como leído)
    const k=el.dataset.k; S.expAviso.has(k)?S.expAviso.delete(k):S.expAviso.add(k);
    pintarBarra(); aplicarIdioma();

  else if(a==='cancelarEdicion'){S.editH=null; S.editVals={}; render();}
  else if(a==='verOriginal'){S.verOrig=S.verOrig===el.dataset.k?null:el.dataset.k; render();}
  else if(a==='guardarEdicion'||a==='deshacerEdicion'){
    const k=el.dataset.k;
    if(a==='deshacerEdicion'&&!confirm('¿Quitar todas las ediciones y volver al original del auditor?')) return;
    const campos=a==='guardarEdicion'?{tipo:document.getElementById('eT').value,clausula:document.getElementById('eC').value.trim(),justificacion:document.getElementById('eJ').value.trim()}:null;
    if(campos&&(!campos.clausula||!campos.justificacion)){aviso('Pon la cláusula y la justificación'); return;}
    if(SRV){
      api(campos?'/api/edicion':'/api/edicion/deshacer',{key:k,...(campos||{})}).then(r=>{if(r.ok){S.editH=null; S.verOrig=null; sondear();}});
    }else{                                                   // sin servidor: se guarda en este navegador
      S.ediciones=S.ediciones||{};
      if(campos) (S.ediciones[k]=S.ediciones[k]||[]).push({user:S.user.nombre,fecha:new Date().toISOString(),...campos}); else delete S.ediciones[k];
      try{localStorage.setItem(LS+'_edic',JSON.stringify(S.ediciones));}catch(err){}
      S.editH=null; S.verOrig=null; render();
    }
  }
  else if(a==='menuExp'){S.expOpen=!S.expOpen; render();}
  else if(a==='exportar'){exportar(el.dataset.c,el.dataset.f);}
  else if(a==='exres'){if(puede('historico','descargar_respuestas')) exportRespuestas(); else aviso(sinPermiso('historico','descargar_respuestas'));}
  else if(a==='exfb'){if(puede('historico','descargar_revision')) exportFeedback(); else aviso(sinPermiso('historico','descargar_revision'));}
  else if(a==='logout'){
    menuUsr(false);
    if(SRV&&S.user.nombre) api('/api/sesion/cerrar',{sid:SID});     // deja de salir en «Sesiones abiertas» y «en línea»
    S.token=''; S.permisos=null; S.cargado=false;                    // el token ya se envió: deja de valer en el servidor
    nuevaSesion();                                                   // al volver a entrar, es una sesión nueva
    clearInterval(S.sondeo); S.sondeo=null;                          // antes seguía sondeando con el usuario anterior
    S.view='inicio'; document.getElementById('app').classList.add('hidden'); document.getElementById('login').classList.remove('hidden'); toggleDrawer(false);
  }
  else if(a==='cuenta'){menuUsr(false); S.view='cuenta'; toggleDrawer(false); render(); window.scrollTo(0,0);}
});

document.addEventListener('input',e=>{
  if(S.reglaForm&&(e.target.id==='rgN'||e.target.id==='rgD')) S.reglaForm[e.target.id==='rgN'?'nombre':'descripcion']=e.target.value;
  if(S.rolForm&&(e.target.id==='rfN'||e.target.id==='rfD')) S.rolForm[e.target.id==='rfN'?'nombre':'descripcion']=e.target.value;
  if(e.target.id==='ueC') S.usrVals={...S.usrVals,c:e.target.value};
  if(e.target.id==='aN'||e.target.id==='aC') S.usrVals={...S.usrVals,[e.target.id]:e.target.value};
  if(e.target.id==='escNota') S.escVals={...S.escVals,nota:e.target.value};
  if(e.target.id==='flt'){S.q=e.target.value; render(); const f=document.getElementById('flt'); if(f){f.focus(); f.setSelectionRange(f.value.length,f.value.length);}}
  if(e.target.id==='iq'){S.iq=e.target.value; render(); const f=document.getElementById('iq'); if(f){f.focus(); f.setSelectionRange(f.value.length,f.value.length);}}
  if(e.target.id==='edDoc'&&S.ed){edSync(); clearTimeout(_tMarcas); _tMarcas=setTimeout(marcarCambios,150);}   // editor de versión: sin redibujar (no se pierde el cursor)
  if(e.target.id==='edNota'&&S.ed){S.ed.nota=e.target.value;}
  if(e.target.id==='edNombre'&&S.ed){S.ed.nombre=e.target.value;}
  if(e.target.id==='claNom'){S.claveForm.nombre=e.target.value;}
  if(e.target.id==='compNota'&&S.comp){S.comp.nota=e.target.value;}
  if(e.target.id==='cgTit'&&S.carga){S.carga.titulo=e.target.value;}
  if(e.target.id==='cgFamOtra'&&S.carga){S.carga.familiaOtra=e.target.value;}
  if(e.target.id==='fcom'){S.comment=e.target.value;}
  if(e.target.id==='ccom'){S.ccom=e.target.value;}
  if(e.target.id==='ctx'){S.ctx=e.target.value;}
  if(e.target.id==='gN'&&S.dlg){S.dlg.nombre=e.target.value;}
  if(['eT','eC','eJ'].includes(e.target.id)){S.editVals=S.editVals||{}; S.editVals[{eT:'tipo',eC:'clausula',eJ:'justificacion'}[e.target.id]]=e.target.value;}
  if(e.target.id==='eMsg'){S.editTxt=e.target.value;}
  if(e.target.id==='ctx'||e.target.id==='ccom') pintarSugerencias(e.target);
  if(e.target.id==='cq'){S.cq=e.target.value;}
  if(e.target.id==='xref'){S.extraForm.ref=e.target.value;}
  if(e.target.id==='xtxt'){S.extraForm.txt=e.target.value;}
});

document.addEventListener('change',e=>{
  if(e.target.id==='ftipo'){S.tipo=e.target.value; render();}
  if(e.target.id==='hfcla'){S.hfcla=e.target.value; render();}
  if(e.target.id==='hfdec'){S.hfdec=e.target.value; render();}
  if(e.target.id==='hporPag'){S.hporPag=Number(e.target.value)||10; render();}
  if(e.target.id==='itipo'){S.itipo=e.target.value; render();}
  if(e.target.id==='htipo'){S.htipo=e.target.value; render();}
  if(e.target.id==='plazoDias'||e.target.id==='plazoIni'){S.plazoVals={...S.plazoVals,[e.target.id==='plazoDias'?'plazo_dias':'inicio']:e.target.value}; render();}
  if(e.target.dataset&&(e.target.dataset.moverrol!==undefined||e.target.dataset.anadirrol!==undefined)&&e.target.value){
    const mover=e.target.dataset.moverrol!==undefined, n=mover?e.target.dataset.moverrol:e.target.value, rol=mover?e.target.value:e.target.dataset.anadirrol;
    if(!confirm(`¿Cambiar a ${n} al rol ${nombreRol(rol)}? Sus permisos cambian al momento.`)){e.target.value=''; return;}
    api('/api/equipo/editar',{n,rol}).then(r=>{if(r.ok) aviso(`${n} ahora tiene el rol ${nombreRol(rol)}`); sondear().then(render);});
  }
  if(e.target.id==='porPag'){S.porPag=Number(e.target.value)||10; render();}
  if(e.target.id==='cmpPag'){compararVersion(e.target.dataset.doc,Number(e.target.dataset.n),Number(e.target.value));}
  if(e.target.id==='hclau'){S.hclau=e.target.value; render();}
  if(['hmios','hnuevos','hcoms','hequipo','hesc'].includes(e.target.id)){S[e.target.id]=e.target.checked; render();}
  if(['iprio','iant'].includes(e.target.id)){S[e.target.id]=e.target.value; render();}
  if(e.target.id==='hdecSel'){S.hdec=e.target.value; render();}
  if(e.target.id==='claDias'){S.claveForm.dias=e.target.value;}
  if(e.target.dataset&&e.target.dataset.clalc){S.claveForm.alcances[e.target.dataset.clalc]=e.target.checked;}
  const mf={mPeriodo:'periodo',mFamilia:'familia',mPrioridad:'prioridad',mTipo:'tipo',mClausula:'clausula'}[e.target.id];
  if(mf){S.metF[mf]=e.target.value; cargarMetricas();}
  const af={actPersona:'persona',actTipo:'tipo',actDocSel:'doc',actDesde:'desde',actHasta:'hasta',actQ:'q'}[e.target.id];
  if(af){S.act.f[af]=e.target.value; S.act.pagina=1; cargarAct();}
  if(e.target.id==='iest'){S.iest=e.target.value; render();}
  // Ventana de regla: se guarda en S para no perderla al redibujar
  if(S.reglaForm&&e.target.name==='rgTipo'){const t=tipoRegla(e.target.value); S.reglaForm.tipo=t.id; S.reglaForm.params=Object.fromEntries(t.params.map(([k,,ty,,,def])=>[k,(S.reglaForm.params||{})[k]??(ty==='num'?def:'')])); render();}
  if(S.reglaForm&&e.target.dataset&&e.target.dataset.rgp){const k=e.target.dataset.rgp; S.reglaForm.params={...S.reglaForm.params,[k]:e.target.type==='number'?Number(e.target.value):e.target.value}; render();}
  if(S.reglaForm&&e.target.id==='rgFam'){S.reglaForm.familia=e.target.value; render();}
  if(S.reglaForm&&e.target.id==='rgAct'){S.reglaForm.activa=e.target.checked;}
  if(e.target.dataset&&e.target.dataset.reglaact){const id=e.target.dataset.reglaact, on=e.target.checked;
    if(!SRV){const r=S.reglas.find(x=>x.id===id); if(r) r.activa=on; guardarReglasLocal(); render(); return;}
    api('/api/regla/editar',{id,activa:on}).then(r=>{if(r.ok) aviso(on?'Regla activada':'Regla desactivada'); sondear().then(render);});}
  // Formularios de Configuración → Usuarios y de escalamiento: se guardan en S para no perderlos al redibujar
  if(e.target.dataset&&e.target.dataset.perm&&S.rolForm){
    const [m,a]=e.target.dataset.perm.split('.'); (S.rolForm.permisos[m]=S.rolForm.permisos[m]||{})[a]=e.target.checked; render();
  }
  if(e.target.id==='ueR'||e.target.id==='aR'){S.usrVals={...S.usrVals,[e.target.id==='ueR'?'rol':'aR']:e.target.value};}
  if(e.target.id==='escPara'){S.escVals={...S.escVals,para:e.target.value};}
  // Ventana de grupo: marcar quién entra y su papel (se guarda al pulsar «Crear grupo» / «Guardar cambios»)
  if(S.dlg&&e.target.dataset&&e.target.dataset.gmiem){
    const n=e.target.dataset.gmiem; S.dlg.nombre=(document.getElementById('gN').value||'');
    if(e.target.checked) S.dlg.miembros[n]=S.dlg.miembros[n]||'miembro'; else delete S.dlg.miembros[n];
    render();
  }
  if(S.dlg&&e.target.dataset&&e.target.dataset.grol){S.dlg.miembros[e.target.dataset.grol]=e.target.value;}
  if(e.target.id==='adjInput'&&e.target.files.length){subirArchivos([...e.target.files]); e.target.value='';}
  if(e.target.id==='nuevoPrivado'&&e.target.value){
    api('/api/chat/crear',{tipo:'privado',con:e.target.value}).then(r=>{if(r.ok){S.canal=r.id; S.chatAbajo=true; S.abierto.privados=true; sondear();}});
  }
  if(e.target.id==='archivo'){
    const f=e.target.files&&e.target.files[0]; e.target.value='';
    if(f) cargarArchivo(f);
  }
  if(e.target.id==='docPrio'){cambiarPrioridad(S.doc,e.target.value);}
  if(S.comp&&e.target.dataset&&e.target.dataset.comp){const n=e.target.dataset.comp; e.target.checked?S.comp.para.add(n):S.comp.para.delete(n); pintarComp();}
  if(S.carga&&e.target.id==='cgFam'){S.carga.familia=e.target.value; S.carga.familiaAuto=false; pintarCarga();}
});

// En el chat, Intro envía y Mayúsculas+Intro hace salto de línea. Con la lista de @ abierta: ↑ ↓ eligen, Intro/Tab
// mencionan y Esc la cierra.
document.addEventListener('keydown',e=>{
  if(S.cmp&&e.key==='Escape'){e.preventDefault(); S.cmp=null; pintarCmp(); return;}
  if(S.comp&&e.key==='Escape'){e.preventDefault(); S.comp=null; pintarComp(); return;}
  if(S.carga&&S.carga.paso==='confirmar'&&e.key==='Escape'){e.preventDefault(); document.querySelector('[data-act="cgCancelar"]')?.click(); return;}
  if(e.key==='Escape'&&S.reglaForm){S.reglaForm=null; render(); return;}
  if(e.key==='Escape'&&S.rolPanel){S.rolPanel=null; S.rolForm=null; render(); return;}
  if(e.key==='Escape'&&S.asigOpen){S.asigOpen=false; render(); document.querySelector('.fasig-btn')?.focus(); return;}
  if(e.key==='Escape'&&!document.getElementById('menuUsr').classList.contains('hidden')){menuUsr(false); document.querySelector('.who').focus(); return;}
  if(e.key==='Escape'&&document.getElementById('drawer').classList.contains('open')){toggleDrawer(false); document.querySelector('.burger').focus(); return;}
  if(S.ed&&e.key==='Escape'){e.preventDefault(); document.querySelector('#editor [data-act="cerrarEditor"]')?.click(); return;}
  if(S.prev){                                                     // vista previa abierta: Esc cierra, Tab no sale de ella
    if(e.key==='Escape'){e.preventDefault(); cerrarPrev(); return;}
    if(e.key==='Tab'){const f=[...document.querySelectorAll('#prevAdj a,#prevAdj button,#prevAdj video,#prevAdj audio,#prevAdj iframe')];
      const i=f.indexOf(document.activeElement); if(e.shiftKey?i<=0:i===f.length-1){e.preventDefault(); f[e.shiftKey?f.length-1:0].focus();}}
  }
  if(S.sug&&e.target.id===S.sug.el){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault(); S.sug.i=(S.sug.i+(e.key==='ArrowDown'?1:-1)+S.sug.items.length)%S.sug.items.length; pintarSugerencias(e.target); return;}
    if(e.key==='Enter'||e.key==='Tab'){e.preventDefault(); elegirMencion(S.sug.items[S.sug.i]); return;}
    if(e.key==='Escape'){cerrarSug(); return;}
  }
  if(e.key==='Escape'&&S.asisOpen){S.asisOpen=false; render(); return;}      // cierra el Asistente IA
  if((e.key==='Enter'||e.key===' ')&&e.target.closest('.met [role=button][data-act]')===e.target){e.preventDefault(); e.target.click(); return;}
  if(e.target.id==='ctx'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault(); enviarMensaje();}
  if(e.target.id==='eMsg'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault(); document.querySelector('[data-act="guardarMsg"]')?.click();}
  if(e.target.id==='eMsg'&&e.key==='Escape'){S.editMsg=null; render();}
});
// Arrastrar archivos sobre el chat para adjuntarlos
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('.chatbox')){e.preventDefault(); e.target.closest('.chatbox').classList.add('soltar');}});
document.addEventListener('dragleave',e=>{const c=e.target.closest&&e.target.closest('.chatbox'); if(c&&!c.contains(e.relatedTarget)) c.classList.remove('soltar');});
document.addEventListener('drop',e=>{
  const c=e.target.closest&&e.target.closest('.chatbox'); if(!c) return;
  e.preventDefault(); c.classList.remove('soltar');
  if(e.dataTransfer&&e.dataTransfer.files.length) subirArchivos([...e.dataTransfer.files]);
});

document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='loginForm'){
    const em=(document.getElementById('em').value||'revisor').trim();
    const entrar=()=>{
      S.user.login=(S.user.correo||em).split('@')[0].toLowerCase(); S.user.desde=new Date().toISOString();
      document.getElementById('login').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      render();
      if(SRV&&!S.sondeo){S.sondeo=setInterval(sondear,2500); sondear();}   // novedades del equipo cada 2,5 s
    };
    if(SRV){
      // Con servidor solo entra quien está dado de alta: el servidor da un token y desde ahí sabe quién eres
      const err=document.getElementById('loginErr'); err.textContent='Entrando…';
      fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({correo:em})})
        .then(r=>r.json().then(j=>({ok:r.ok,j}))).then(({ok,j})=>{
          if(!ok){err.textContent=j.error||'No se pudo entrar'; return;}
          err.textContent=''; S.token=j.token; S.user.nombre=j.n; S.user.correo=j.c; S.user.rol=j.rol;
          S.user.cargo=`${nombreRol(j.rol)} · Calidad Part-IS`; S.cargado=false; entrar();
        }).catch(()=>{err.textContent='Sin conexión con el servidor';});
      return;
    }
    // Sin servidor (doble clic en index.html): como antes, solo en este navegador
    const loc=em.split('@')[0].toLowerCase(), m=S.equipo.find(x=>x.c===em.toLowerCase()||x.n.toLowerCase()===loc.split(/[._\-\s]+/)[0]);
    S.user.nombre=m?m.n:(em.split('@')[0].split(/[._-]+/).filter(Boolean).map(w=>w[0].toUpperCase()+w.slice(1)).join(' ')||'Revisor');
    if(m) S.user.cargo=`${nombreRol(m.rol)} · Calidad Part-IS`;
    S.user.correo=em.includes('@')?em.toLowerCase():(m?m.c:'');          // para «Mi cuenta»
    entrar();
  } else if(e.target.id==='chatForm'){
    sendChat(document.getElementById('cq').value);
    const c=document.getElementById('cq'); if(c) c.focus();
  } else if(e.target.id==='comForm'){
    enviarComentario();
  } else if(e.target.id==='chatEq'){
    enviarMensaje();
  } else if(e.target.id==='altaEq'){
    const n=document.getElementById('aN').value.trim(), c=document.getElementById('aC').value.trim(), rol=document.getElementById('aR').value;
    if(!rol){aviso('Todo usuario necesita un rol'); return;}
    api('/api/equipo/alta',{n,c,rol}).then(r=>{if(r.ok){aviso(`${n} creado con el rol ${nombreRol(rol)}`); S.usrNuevo=false; S.usrVals={}; sondear().then(render);}});
  } else if(e.target.id==='canalForm'){
    const nombre=(document.getElementById('ncanal').value||'').trim(); if(!nombre) return;
    api('/api/chat/crear',{tipo:'canal',nombre}).then(r=>{if(r.ok){S.canal=r.id; S.chatAbajo=true; sondear();}});
  }
});

document.querySelectorAll('img.logo-ref').forEach(i=>{i.src=document.querySelector('.login-card .logo').src;});
render();
