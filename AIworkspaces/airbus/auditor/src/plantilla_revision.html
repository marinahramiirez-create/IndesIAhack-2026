h1,h2,.topbar .title,.login-card h1,.veredicto>div b{font-weight:700}
h3,h4,th,.ftit,.dcol,.rg-paso b,.mu-cab b,.sumrow b,summary b,b,strong{font-weight:600}
button,select,input,textarea,.sub,.small,.note,.login-card p{font-weight:400}
pre,code,kbd,samp{font-family:inherit}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 16px;background:var(--tint);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:#e5e5ea;color:var(--text)}
button.ok{background:var(--ok)}
button.warn{background:var(--warn)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid rgba(10,132,255,.45);outline-offset:2px}
input,select,textarea{font:inherit;padding:9px 11px;border:1px solid var(--sep);border-radius:10px;background:#fff;color:var(--text)}
input[type=checkbox]{width:18px;height:18px;padding:0;margin:0;flex:none;accent-color:var(--tint)}
a{color:var(--tint)}
.hidden{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:#00205b}
/* Fondo: cielo azul Airbus con aviones de fuselaje ancho, medio difuminado (ilustración propia, sin fotos externas) */
.login-fondo{position:absolute;inset:-30px;filter:blur(5px);transform:scale(1.04)}
.login-fondo svg{width:100%;height:100%;display:block}
#login::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,32,91,.15),rgba(0,32,91,.55))}
.login-card{position:relative;z-index:1;background:#fff;border-radius:20px;padding:36px;width:380px;box-shadow:0 20px 60px rgba(0,16,48,.45);text-align:center}
.login-card .logo{display:block;width:150px;max-width:70%;margin:4px auto 18px}
.login-card h1{font-size:26px;font-weight:700;letter-spacing:-.01em;color:#00205b;margin:6px 0 4px}
.login-card p{font-size:15px;color:var(--sec);margin:0 0 22px}
.login-card .field{text-align:left}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;color:var(--sec)}
.login-card button{width:100%;padding:12px}
.topbar{position:sticky;top:0;height:56px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--sep);display:flex;align-items:center;gap:14px;padding:0 20px;z-index:5}
/* Botón «Menú» como en brand.airbus.com: texto + tres líneas de largo decreciente, separado del logo por una línea */
.burger{display:flex;align-items:center;gap:12px;background:none;color:#00205b;padding:0 20px 0 0;margin-left:-4px;height:56px;border-radius:0;border-right:1px solid var(--sep);font-size:16px;font-weight:600}
.burger svg{width:22px;height:16px;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.burger:hover{color:#0a3d91}
.marca-top{height:17px;width:auto;display:block}
.topbar .title{font-size:17px}
/* Menú lateral con la estética del Brand Centre de Airbus: panel blanco, logo y ✕ arriba, opciones en azul Airbus,
   sin iconos y con aire; las secciones con subsecciones llevan «›» y se despliegan */
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(420px,92vw);background:#fff;box-shadow:8px 0 40px rgba(0,16,48,.18);transform:translateX(-102%);transition:transform .3s ease;z-index:20;padding:34px 44px 30px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.drawer.open{transform:none}
.drawer-cab{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}
.drawer-cab img{height:22px;width:auto}
.drawer-x{background:none;color:#00205b;padding:6px;margin-right:-6px;border-radius:8px;display:flex}
.drawer-x svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.drawer-x:hover{background:#f2f4f8}
.drawer .ni{display:none}
.drawer .nav-item{justify-content:space-between;background:none;color:#00205b;font-size:19px;font-weight:400;padding:12px 0;border-radius:0}
.drawer .nav-item:hover{background:none;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.drawer .nav-item.active{background:none;color:#00205b;font-weight:600;box-shadow:inset 3px 0 0 #00205b;padding-left:14px}
.drawer .nav-item.sub{font-size:16px;font-weight:400;padding:9px 0 9px 18px;color:#2b3a55}
.drawer .nav-item.sub.active{background:none;font-weight:600;color:#00205b;box-shadow:inset 3px 0 0 #00205b}
.drawer .chev{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.drawer.cfg-open .chev{transform:rotate(90deg)}
.drawer .nav-item.sub{display:none}
.drawer.cfg-open .nav-item.sub{display:flex}
.scrim{position:fixed;inset:0;background:rgba(0,32,91,.35);z-index:18}
.sidemodal{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.15);z-index:30;padding:22px;overflow:auto}
.dialog{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(520px,92vw);background:#fff;border-radius:16px;padding:22px;z-index:35;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.dialog input,.dialog textarea{width:100%}
.user{padding:14px;border-radius:12px;background:var(--bg);margin-bottom:12px}
.user b{display:block;font-size:16px}
.user span{color:var(--sec);font-size:13px}
.nav-item{text-align:left;background:none;color:var(--text);padding:11px 12px;border-radius:10px;font-size:15px}
.nav-item:hover{background:#f0f0f5}
.nav-item.active{background:#e5f1ff;color:var(--tint);font-weight:600}
.nav-item.sub{padding-left:30px;font-size:14px}
main{padding:18px 20px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.sp{flex:1}
h2{font-size:22px;margin:0 0 4px}
h3{margin:0 0 8px;font-size:16px}
.sub{color:var(--sec);margin:0 0 14px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--sep);font-size:14px;vertical-align:top}
th{color:var(--sec);font-weight:600;font-size:13px}
tr.clic{cursor:pointer}
tr.clic:hover td{background:#f7f7fa}
tr.hl td{background:#fff6cc}
.small{font-size:13px;color:var(--sec)}
.note{font-size:12px;color:var(--sec);background:#f7f7fa;border-radius:10px;padding:10px;margin-top:12px}
.st{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--text);white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.two{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.two.solo{grid-template-columns:minmax(0,1fr)}   /* consulta histórica: solo el documento */
.right{position:sticky;top:74px;max-height:calc(100vh - 150px);display:flex;flex-direction:column;overflow:hidden}
/* Lista de hallazgos del detalle: se ven 2,5 filas (la media fila indica que hay más) y el resto con scroll */
.lista-scroll{--hfila:42px;max-height:calc(var(--hfila) * 2.5);overflow:auto;flex:none}
.lista-scroll .hrow{height:var(--hfila);box-sizing:border-box;padding-top:0;padding-bottom:0}
.lista-scroll .hrow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.motivo-scroll{margin-top:12px;flex:1 1 auto;min-height:90px;overflow:auto}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:8px;border-bottom:1px solid var(--sep)}
.hrow.on{background:#e5f1ff}
.hrow .nm{flex:1;text-align:left;background:none;color:var(--text);padding:0;font-weight:600;font-size:14px}
.pnav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
/* Detalle de una revisión: título que se recorta si no cabe y «Criterios» siempre fijo a la derecha */
.pnav-rev{flex-wrap:nowrap}
.pnav-tit{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px}
.pnav-tit h2{white-space:nowrap}
.pnav-tit .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pnav-rev>button{flex:none}
.pnav-fijo{margin-left:6px}
/* Reglas de aceptación */
.reg-res{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}
.reg-res>div{background:#f8f9fb;border:1px solid var(--sep);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.reg-res b{font-size:22px}
.treg td{vertical-align:top}.treg tr.off td{opacity:.55}
.vacio{padding:22px;text-align:center;color:var(--sec);border:1px dashed var(--sep);border-radius:10px}
.sw{position:relative;display:inline-block;width:38px;height:22px}.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#d1d1d6;border-radius:999px;transition:.2s;cursor:pointer}
.sw span::before{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+span{background:#00205b}.sw input:checked+span::before{transform:translateX(16px)}
.sw input:focus-visible+span{outline:3px solid rgba(10,132,255,.45)}.sw input:disabled+span{opacity:.5;cursor:not-allowed}
.ref-det summary{cursor:pointer}
.dlg-regla{width:min(720px,94vw);max-height:90vh;overflow:auto}
.rg-paso{display:flex;align-items:center;gap:8px;margin:18px 0 8px;color:#00205b}
.rg-n{width:22px;height:22px;border-radius:50%;background:#00205b;color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.rg-f{display:flex;flex-direction:column;gap:4px}
.rg-tipos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.rg-tipo{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--sep);border-radius:10px;padding:10px;cursor:pointer}
.rg-tipo.on{border-color:#00205b;box-shadow:inset 0 0 0 1px #00205b;background:#f6f8fc}
.rg-tipo>span{display:flex;flex-direction:column;gap:3px}.rg-tipo input{margin-top:3px;accent-color:#00205b}
.dlg-regla .fchk{background:none;white-space:nowrap;padding:0 4px}
.rg-prev{margin-top:16px;padding:10px 12px;border-radius:10px;background:#f6f8fc;font-size:14px}
.veredicto{margin:10px 0 14px;padding:12px 14px;border-radius:12px;background:var(--vb);border-left:4px solid var(--vc)}
.veredicto>div{display:flex;flex-direction:column}.veredicto>div b{font-size:20px;color:var(--vc)}
.veredicto ul{margin:8px 0 0;padding-left:18px;font-size:14px}
.pr-u{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--sep)}
.pr-u select{width:150px;height:32px;padding:4px 8px;font-size:13px}
tr.clic{cursor:pointer}tr.clic:hover td{background:#f6f8fb}
.esc-card{margin-bottom:14px;padding:12px 16px;border-left:4px solid #00205b}
.esc-form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:10px}
.esc-esp{margin-top:8px;padding:8px 10px;border-radius:8px;background:rgba(255,159,10,.12);color:#8a4b00;font-size:13px;font-weight:400}
.esc-ok{margin-top:8px;padding:8px 10px;border-radius:8px;background:rgba(52,199,89,.12);color:#1d6b31;font-size:13px;font-weight:400}
.iconbtn{background:#e5e5ea;color:var(--text);padding:8px 10px;display:inline-flex;align-items:center}
.pdfwrap{background:#e9e9ee;border-radius:10px;padding:18px}
.sumrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--sep);font-size:14px}
.rule{background:#f7f7fa;border-radius:10px;padding:12px;font-size:14px;margin:10px 0}
.fbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.fbtns button{font-size:14px;padding:11px 8px}
.log{font-size:12px;color:var(--sec);background:#f7f7fa;border-radius:10px;padding:12px;max-height:320px;overflow:auto}
.chat{display:flex;flex-direction:column;height:520px}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:8px 0}
.m{padding:10px 13px;border-radius:14px;max-width:88%;font-size:14px}
.m.u{align-self:flex-end;background:var(--tint);color:#fff}
.m.a{align-self:flex-start;background:var(--bg)}
.chatin{display:flex;gap:8px}
.chatin input{flex:1}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{background:#e5e5ea;color:var(--text)}
.tabs button.on{background:var(--tint);color:#fff}
mark{background:#ffe27a;padding:0 2px;border-radius:3px}
.cita{border-left:3px solid var(--warn);background:#fff8ec;padding:6px 10px;border-radius:0 8px 8px 0;margin:4px 0;font-size:13px;color:var(--text)}
.hscroll{max-height:560px;overflow:auto}
/* Inicio con la estructura de lista de Marina, en el sistema de diseño de Apple de Valentina */
.seg{display:inline-flex;flex-wrap:wrap;background:#e5e5ea;border-radius:9px;padding:2px;gap:2px}
.seg button{background:none;color:var(--text);padding:6px 12px;border-radius:7px;font-size:13px}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.seg .n{color:var(--sec);margin-left:6px;font-weight:400}
.dlist{display:flex;flex-direction:column;gap:8px}
/* Cabecera con orden por columna (mismas columnas que cada fila) y pie con paginador */
.dcab{display:grid;grid-template-columns:240px minmax(0,1fr) 170px 160px;gap:16px;padding:0 16px 6px 20px}
.dcol{display:flex;align-items:center;gap:6px;background:none;color:var(--sec);font-size:12px;padding:4px 0;border-radius:0;text-align:left}
.dcol.der{justify-content:flex-end}
.dcol:hover,.dcol.on{color:#00205b}
.flecha-ord{font-size:10px;opacity:.7}
.dias{justify-self:end;text-align:right}
.dpie{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:14px 0 4px}
.pager{display:flex;align-items:center;gap:4px}
.pager button{min-width:34px;height:34px;padding:0 10px;font-size:14px}
.pager button.on{background:#00205b;color:#fff}
.dpie select{height:32px;padding:4px 8px}
.btn-principal{cursor:pointer;padding:9px 18px;border-radius:10px;background:var(--tint);color:#fff;font-size:15px;font-weight:600}
.btn-principal:hover{filter:brightness(.95)}
.btn-principal:focus-within{outline:3px solid rgba(10,132,255,.45);outline-offset:2px}
.drow{display:grid;grid-template-columns:240px minmax(0,1fr) 170px 160px;gap:16px;align-items:center;background:#fff;border-radius:12px;padding:12px 16px;border-left:4px solid var(--c);box-shadow:0 1px 2px rgba(0,0,0,.04);cursor:pointer;transition:box-shadow .15s}
.drow:hover{box-shadow:0 3px 10px rgba(0,0,0,.08)}
.drow.off{cursor:default}
.drow.off:hover{box-shadow:0 1px 2px rgba(0,0,0,.04)}
.drow .cod{font-weight:700;font-size:15px}
.drow .tit{font-size:14px;margin-bottom:6px}
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;background:var(--pb);color:var(--pc);margin:0 4px 3px 0;white-space:nowrap}
.estado{justify-self:end;text-align:right}
.mini{height:4px;background:#e5e5ea;border-radius:999px;overflow:hidden;width:120px;margin:6px 0 0 auto}
/* Barra superior: idioma, avisos y usuario; revisión en equipo (debate, menciones, presencia) */
.topbar .seg button{padding:4px 10px;font-size:13px}
.bell{position:relative;background:#f2f2f7;color:var(--text);padding:7px 9px;border-radius:10px;display:inline-flex;align-items:center}
.badge{position:absolute;top:-6px;right:-7px;background:var(--err);color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:18px;height:18px;padding:0 5px;display:flex;align-items:center;justify-content:center}
.who{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;background:none;color:var(--text);padding:4px 8px 4px 4px;border-radius:999px}
.who:hover{background:#f0f0f5}
.who-chev{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--sec)}
/* Desplegable del usuario: Mi cuenta y Cerrar sesión */
.usrwrap{position:relative}
.menuusr{position:absolute;right:0;top:calc(100% + 8px);width:250px;background:#fff;border:1px solid var(--sep);border-radius:10px;box-shadow:0 12px 32px rgba(0,16,48,.16);padding:6px;z-index:40}
.mu-cab{padding:10px 12px 12px;border-bottom:1px solid var(--sep);margin-bottom:6px}
.mu-cab b{display:block;color:#00205b;font-size:15px}
.mu-cab span{color:var(--sec);font-size:13px}
.menuusr button{display:flex;align-items:center;gap:10px;width:100%;background:none;color:#00205b;padding:10px 12px;border-radius:8px;font-size:15px;text-align:left}
.menuusr button:hover,.menuusr button:focus-visible{background:#f2f4f8}
.av{width:28px;height:28px;border-radius:50%;background:#1a4c7c;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.avisos{position:fixed;top:62px;right:16px;width:min(380px,92vw);max-height:70vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.2);z-index:40;padding:16px}
.aviso{display:block;width:100%;text-align:left;background:#fdeef2;color:var(--text);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14px}
.aviso.leido{background:#f7f7fa}
/* Notificaciones tipo macOS: tarjeta translúcida, icono, resumen, «Ver» y × para eliminar */
.avisos{background:rgba(246,246,248,.96);backdrop-filter:blur(14px)}
.noti{position:relative;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.92);border-radius:18px;padding:12px 14px;margin-top:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.noti.leida{opacity:.7}
.noti .ico{width:40px;height:40px;border-radius:10px;background:#eef0f4;display:inline-flex;align-items:center;justify-content:center;font-size:18px;flex:none;color:#3a3a3c;font-weight:700}
.noti .av{width:40px!important;height:40px!important;font-size:14px}
.noti-t{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.noti-m{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.noti-ver{background:#e9e9ee;color:var(--text);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;flex:none}
.noti-x{position:absolute;top:-7px;left:-7px;width:22px;height:22px;border-radius:50%;padding:0;background:#e5e5ea;color:#3a3a3c;font-size:14px;line-height:22px;box-shadow:0 1px 3px rgba(0,0,0,.2);opacity:0;transition:opacity .15s}
.noti:hover .noti-x,.noti-x:focus-visible{opacity:1}
@media (hover:none){.noti-x{opacity:1}}
/* Exportar en varios formatos */
.exp-p{margin-top:8px;border:1px solid var(--sep);border-radius:12px;padding:10px 12px;background:#fff}
.exp-g{padding:6px 0}.exp-g+.exp-g{border-top:1px solid var(--sep);margin-top:4px;padding-top:10px}
.exp-b{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.exp-b button{font-size:13px;padding:6px 12px}
/* Ediciones de un hallazgo */
.editado{font-size:12px;color:#0a6fd6;background:#e5f1ff;border-radius:8px;padding:4px 8px;margin-top:6px}
.orig{font-size:12px;color:var(--sec);background:#f7f7fa;border:1px dashed var(--sep);border-radius:8px;padding:8px 10px;margin-top:8px}
.enlace{background:none;color:var(--tint);padding:0;font-size:12px;text-decoration:underline}
/* Adjuntos del chat */
.adj-img img{max-width:min(320px,100%);max-height:240px;border-radius:10px;margin-top:6px;display:block;border:1px solid var(--sep)}
button.adj-img{all:unset;cursor:zoom-in;display:block;border-radius:10px}
button.adj-img:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
/* Vista previa de adjuntos dentro de la página */
#prevAdj{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:24px}
.prev-fondo{position:absolute;inset:0;background:rgba(0,0,0,.72)}
.prev-caja{position:relative;display:flex;flex-direction:column;width:min(1100px,100%);max-height:100%;background:#1c1c1e;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.prev-cab{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;background:#2c2c2e;color:#fff}
.prev-cab .adj-n{color:#fff}
.prev-x{width:34px;height:34px;border-radius:50%;padding:0;background:rgba(255,255,255,.16);color:#fff;font-size:22px;line-height:34px;flex:none}
.prev-x:hover{background:rgba(255,255,255,.28)}

.mmap-c{all:unset;display:block;min-width:58px;height:30px;line-height:30px;text-align:center;border-radius:4px;font-variant-numeric:tabular-nums;cursor:pointer}
.mmap-c[disabled]{cursor:default}.mmap-c:not([disabled]):hover,.mmap-c:focus-visible{outline:2px solid #0b0b0b;outline-offset:-2px}
.mescala{display:flex;align-items:center;gap:2px;margin-top:8px}.mescala i{width:22px;height:8px;border-radius:2px}.mescala .small{margin:0 6px}
.matn{display:flex;flex-direction:column;gap:2px}
.matn-f{all:unset;display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13px}
.matn-f:hover,.matn-f:focus-visible{background:#f2f6fc}.matn-f:focus-visible{outline:2px solid var(--tint)}
.mvenc{color:#d03b3b;font-weight:600}
#metTip{position:fixed;z-index:95;display:none;background:#fff;border:1px solid rgba(11,11,11,.1);border-radius:8px;padding:7px 10px;box-shadow:0 8px 24px rgba(0,0,0,.14);font-size:12px;color:#52514e;pointer-events:none;max-width:260px}
#metTip b{display:block;color:#0b0b0b;font-size:14px}
@media (max-width:700px){.mkpi.hero{grid-column:auto}.mgrid{grid-template-columns:1fr}}
/* Mi cuenta → Claves de API */
.cla-card .cla-form,.cla-card .note{max-width:720px}
.act-cab{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}.act-bot{display:flex;gap:8px;flex-wrap:wrap}
.act-fil .fcampo input[type=date]{height:36px;padding:6px 8px;font-size:14px}
.act-tabla{overflow-x:auto}.act-tabla table{width:100%;border-collapse:collapse;font-size:13.5px}
.act-tabla th{text-align:left;font-weight:600;color:var(--sec);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--sep)}
.act-tabla td{padding:8px;border-bottom:1px solid var(--sep);vertical-align:top}.act-tabla tr:last-child td{border-bottom:none}
.act-fecha{white-space:nowrap;color:var(--sec)}.act-cambios{margin-top:2px;overflow-wrap:anywhere}
.act-tipo{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:#eef1f5;color:#2b3a4e;white-space:nowrap}
.act-int{border-radius:10px;padding:10px 12px;margin:0 0 12px}.act-bien{background:#eef7ee;border:1px solid #a7d8a7}.act-mal{background:#fdeceb;border:1px solid #f0aaa5}
.act-pag{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px}
.act-doc{margin-top:14px}.act-doc summary{cursor:pointer;list-style-position:inside}.act-doc[open] summary{margin-bottom:8px}
.cla-form{display:flex;flex-direction:column;gap:4px}.cla-form input:not([type=checkbox]){width:100%}.cla-alc .fchk{white-space:nowrap}
.cla-fila{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}.cla-alc{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.cla-f{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--sep)}.cla-f.off{opacity:.6}
.cla-nueva{background:#eef7ee;border:1px solid #a7d8a7;border-radius:10px;padding:10px 12px;margin-bottom:10px;display:flex;flex-direction:column;gap:6px}
.cla-copia{display:flex;gap:8px;align-items:center}.cla-copia code{flex:1;min-width:0;overflow-wrap:anywhere;background:#fff;border:1px solid var(--sep);border-radius:6px;padding:6px 8px;font-size:12px}
/* Mi cuenta */
/* Mi cuenta: listado por secciones, sin recuadros */
.lc{max-width:860px}
.lc-sec{margin-top:26px}
.lc-sec h3{margin:0 0 2px;font-size:15px;color:#00205b}
.lc-d{margin:0 0 6px}
.lc-lista{border-top:1px solid var(--sep)}
.lc-fila{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--sep);font-size:14px}
.lc-k{display:flex;flex-direction:column;gap:2px;min-width:0}
.lc-l1{display:flex;align-items:center;gap:8px;color:var(--text)}
.lc-k .dot{display:inline-block;margin:0}
.lc-fila .lc-k:only-child{flex:1}
.lc-txt{display:block;line-height:1.5}
.lc-sub{font-size:13px}
.lc-v{text-align:right;color:var(--text);overflow-wrap:anywhere}
.lc-fila>.lc-k:first-child:not(:only-child){color:var(--sec)}
.lc-salir{background:none;color:#d70015;padding:12px 0;border-radius:0;font-size:14px;font-weight:600;width:100%;text-align:left;border-bottom:1px solid var(--sep)}
.lc-salir:hover{text-decoration:underline}
.cta-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.cuenta-card h3{margin:0 0 10px}
.cuenta-card .cta-f .seg{justify-self:start}
.cta-f{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px;padding:5px 0;font-size:14px}
.cta-f>span{color:var(--sec)}
.cta-f b{font-weight:400;overflow-wrap:anywhere}
.cta-pronto{margin:0;background:#fff4e0;color:#c76a00}
.cuenta-card button[disabled]{opacity:.55;cursor:not-allowed}
.cta-ses{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--sep);font-size:14px}
.cta-ses .dot{margin-top:6px}
.cta-ul{margin:0;padding-left:18px;font-size:14px;line-height:1.5}
.cta-ul li+li{margin-top:4px}
.cta-prev{color:var(--sec)}
@media (max-width:1100px){.cta-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.cta-grid{grid-template-columns:1fr}}
/* Pestañas de documentos abiertos (como Safari) */
.tabs{display:flex;gap:4px;overflow-x:auto;margin:-4px 0 12px;padding:4px;background:#e5e5ea;border-radius:12px;scrollbar-width:thin}
.tab{display:flex;align-items:center;flex:0 1 220px;min-width:120px;border-radius:9px;background:transparent}
.tab:hover{background:rgba(255,255,255,.55)}
.tab.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tab-b{all:unset;flex:1;min-width:0;display:flex;align-items:center;gap:4px;padding:7px 4px 7px 12px;font-size:13px;cursor:pointer;border-radius:9px}
.tab.on .tab-b{font-weight:600}
.tab-b:focus-visible,.tab-x:focus-visible{outline:2px solid var(--tint);outline-offset:-2px}
.tab-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab-x{background:none;color:var(--sec);width:24px;height:24px;padding:0;border-radius:6px;font-size:16px;line-height:24px;margin-right:4px;flex:none}
.tab-x:hover{background:#d8d8de;color:var(--text)}
/* Aviso emergente (10 s) con el mismo aspecto que las tarjetas de la campanita */
#banners{position:fixed;top:66px;right:16px;width:min(380px,calc(100vw - 32px));z-index:60;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#banners .banner{pointer-events:auto;margin:0;background:rgba(250,250,252,.97);backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.18);animation:bannerIn .25s ease-out}
@keyframes bannerIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#banners .banner{animation:none}}
/* Filtros de hallazgos en Inicio */
.ffil{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:12px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.fcampo{display:flex;flex-direction:column;gap:5px;min-width:0}
.ftit{font-size:12px;color:var(--sec);white-space:nowrap}
.fbus{flex:1 1 150px}.fbus input{width:100%;height:36px;padding:6px 10px}
.fcampo select{width:118px;height:36px;padding:6px 8px;font-size:14px}
.ffil .seg{height:36px;align-items:center}
.ffil .seg button{padding:5px 8px;font-size:13px}
.ffil .fchk{padding:5px 9px;font-size:13px}
.fasig{position:relative}
.fasig-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:170px;height:36px;padding:6px 10px;background:#fff;color:var(--text);border:1px solid var(--sep);border-radius:10px;font-size:14px;text-align:left}
.fasig-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fasig-btn svg{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fasig-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:15;background:#fff;border:1px solid var(--sep);border-radius:10px;box-shadow:0 12px 32px rgba(0,16,48,.16);padding:8px;display:flex;flex-direction:column;gap:6px;min-width:200px}
.fasig-pop .fchk{background:none;border-radius:8px;padding:7px 8px;font-size:14px}
.fasig-pop .fchk:hover{background:#f2f4f8}
.ffil input[type=search]{background:#f2f2f7;border:none}
.fdec button.on{background:#16324f;color:#fff}
.ln-add{background:#fff1b8;border-radius:3px}
.ln-del{background:#ffd9d6;border-radius:3px;text-decoration:line-through;text-decoration-color:rgba(215,0,21,.45)}
.fsel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fsel select{width:100%}
.fopt{display:flex;align-items:center;gap:6px;height:36px}
.fconf{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sec);height:36px}
.fconf input{width:78px;accent-color:#16324f}
.fconf output{font-variant-numeric:tabular-nums;min-width:32px}
.fchk{display:inline-flex;align-items:center;gap:6px;background:#f2f2f7;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.fchk input{margin:0;accent-color:#16324f}
@media (max-width:700px){.fsel{grid-template-columns:1fr}}
@media (max-width:900px){.drow{grid-template-columns:1fr;gap:8px}.estado,.dias{justify-self:start;text-align:left}.mini{margin-left:0}.dcab{display:none}}
@media (max-width:1200px){.two{grid-template-columns:1fr}.right{position:static;max-height:none}.g2{grid-template-columns:1fr}}
/* Asistente IA: botón flotante y panel lateral derecho; busca en toda la aplicación y propone a dónde ir */
.fab.moviendo{cursor:grabbing;transition:none;transform:scale(1.04);box-shadow:0 16px 34px rgba(26,76,124,.45)}
.fab{touch-action:none;user-select:none;cursor:grab}
.fab{position:fixed;right:22px;bottom:22px;z-index:25;display:inline-flex;align-items:center;gap:8px;padding:12px 18px 12px 14px;border-radius:999px;background:#1a4c7c;color:#fff;font-weight:600;box-shadow:0 8px 24px rgba(26,76,124,.35);transition:transform .15s,box-shadow .15s}
.fab:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(26,76,124,.42)}
.asis{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.15);z-index:30;display:flex;flex-direction:column}
.asis.entra{animation:asis-in .22s ease-out}
@keyframes asis-in{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.asis-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--sep)}

.sug{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 10px}
.sug button{background:#f2f2f7;color:var(--text);font-size:13px;padding:6px 10px;border-radius:999px}
.sug button:hover{background:#e5e5ea}
.ctas{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.cta{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:#fff;color:#1a4c7c;border:1px solid #c9dcef;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600}
.cta:hover{background:#e5f1ff}
.cta .fl{font-size:12px;font-weight:400;color:var(--sec);display:block;margin-top:1px}
.chipf{display:inline-flex;align-items:center;gap:8px;background:#e5f1ff;color:#1a4c7c;border-radius:999px;padding:5px 6px 5px 12px;font-size:13px;font-weight:600;margin-bottom:10px}

<script>
// Datos reales: los inserta generar_revision.py (respuestas.csv + traza + corpus). Nada se calcula aquí con IA.
const D=/*__DATOS__*/null;
const RES=D.res, DOCS=D.docs, ETAPAS=D.etapas, MET=D.metricas, LOG=D.log;
const EASA_URL=D.easa;
const COLS=['documento','ubicacion','tipo','clausula','justificacion'];
const TIPOS=['No cumple','Inconsistencia','Cobertura faltante','Trazabilidad incorrecta','No verificable'];
const DECTXT={approved:'Aprobado',rejected:'Rechazado'};
const FUENTES=[
  {r:1,n:'Part-IS de EASA (IS.I.OR.200 a 260)',p:'Obligaciones y plazos legales. Muchos plazos no se repiten en los documentos internos.',url:EASA_URL},
  {r:2,n:'STD-SEC-001 (estándar corporativo, versión vigente)',p:'Valores numéricos de NIMBUS (plazos, longitudes, periodos) y criterios de control operativo.',url:''},
  {r:3,n:'LISTA-DOC (lista maestra)',p:'Documentos y versiones en vigor. Un documento sustituido no es referencia.',url:''},
  {r:4,n:'Políticas, manual, procedimientos, especificaciones (SRS)',p:'Deben respetar lo anterior.',url:''},
  {r:5,n:'Registros, informes, declaraciones, actas',p:'Demuestran si lo anterior se cumple en la práctica.',url:''}
];

const S={
  user:{nombre:'',cargo:'Auditor · Calidad Part-IS'},
  view:'inicio', doc:null, foco:0, pdfPag:1,
  sel:{}, comment:'', q:'', tipo:'', uploads:[],
  criteriosOpen:false, extraOpen:false, extraForm:{ref:'',txt:''},
  iq:'', iest:'', itipo:'', agente:null, reglaForm:null,
  reglas:[{id:'r1',nombre:'Aceptación mínima',descripcion:'Antes era el umbral de aceptación.',tipo:'porcentaje_aprobados',params:{min_pct:80},familia:'',efecto:'rechazar',activa:true}],
  // Filtros de hallazgos en Inicio: un documento se muestra si tiene algún hallazgo que los cumpla
  hdec:'', htipo:'', hclau:'', hmios:false, hnuevos:false, hcoms:false, hequipo:false, hesc:false, orden:null, pag:1, porPag:10,
  config:{plazo_dias:15,inicio:null},
  // Auditorías: filtros de prioridad y antigüedad (el plazo es el común de Configuración → Reglas)
  iprio:'', iant:'',
  dec:{}, extra:[], hl:[],
  msgs:[{r:'a',t:'Hola. Busco en toda la aplicación: documentos, hallazgos, decisiones, agentes y métricas, reglas, equipo y chat. Si la respuesta está en una sección, te propongo ir a ella con los filtros puestos. Con la revisión en equipo encendida, además leo los PDF del corpus y te respondo con la IA citando las fuentes.'}],
  asisOpen:false, soloHl:false, hlTxt:''
};
const LS='rv_real_'+D.id;
try{S.dec=JSON.parse(localStorage.getItem(LS+'_dec')||'{}');}catch(e){S.dec={};}
try{S.extra=JSON.parse(localStorage.getItem(LS+'_extra')||'[]');}catch(e){S.extra=[];}
try{S.lang=localStorage.getItem('rv_lang')||'es';}catch(e){S.lang='es';}
try{S.ediciones=JSON.parse(localStorage.getItem(LS+'_edic')||'{}');}catch(e){S.ediciones={};}
if(!location.protocol.startsWith('http')){
  try{S.config=JSON.parse(localStorage.getItem(LS+'_cfg')||'null')||S.config;}catch(e){}
  try{S.reglas=JSON.parse(localStorage.getItem(LS+'_reglas')||'null')||S.reglas;}catch(e){}
  if(!S.config.inicio){S.config.inicio=new Date().toISOString().slice(0,10); try{localStorage.setItem(LS+'_cfg',JSON.stringify(S.config));}catch(e){}}
}

// ---------- Revisión en equipo: con servidor.py (http://…) las decisiones, comentarios, menciones y presencia se
// comparten; abierta con doble clic (file://) todo sigue funcionando solo en este navegador.
const SRV=location.protocol.startsWith('http');
Object.assign(S,{coms:[],avisos:[],pres:{},ccom:'',cq:'',avisosOpen:false,online:null,
  mensajes:[],canales:['general'],canal:'general',ctx:'',chatAbajo:true,expAviso:new Set()});
let _firma='';
// Equipo: con servidor llega de colaboracion.json (gestionable en Configuración → Usuarios y roles); sin él, esta lista
// Roles y permisos: con servidor llegan de /api/estado y el SERVIDOR los aplica en cada operación (aquí solo se
// enseñan, se desactivan o se explican las acciones). Sin servidor (doble clic en index.html) todo es local y sin permisos.
S.roles=[{id:'admin',nombre:'Admin',descripcion:'Administra la estructura de roles y el equipo; decide sobre los hallazgos.'},
  {id:'aprobador',nombre:'Aprobador',descripcion:'Decide y firma las decisiones de los demás.'},
  {id:'revisor',nombre:'Revisor',descripcion:'Aprueba o rechaza hallazgos y comenta.'},
  {id:'dueno_proceso',nombre:'Dueño de Proceso',descripcion:'Corrige los documentos que se le escalan.'}];
S.histDocs=new Set();
S.origen={};            // documento → vista desde la que se abrió («inicio» = Auditorías, «historico»): la usa «Volver»   // documentos abiertos desde Histórico: solo consulta, sin la columna de hallazgos y decisiones
Object.assign(S,{modulos:[],permisos:null,escalados:{},escHist:[],editables:{},token:'',cargado:false,
  rolForm:null,rolPanel:null,usrTab:'roles',usrEdit:null,usrVals:{},usrNuevo:false,escOpen:false,escVals:{}});
S.equipo=[{n:'Sergio',c:'sergio@airbus.es',rol:'admin'},{n:'Marina',c:'marina@airbus.es',rol:'aprobador'},
  {n:'Nelson',c:'nelson@airbus.es',rol:'revisor'},{n:'Valentina',c:'valentina@airbus.es',rol:'revisor'},
  {n:'Daniela',c:'daniela@airbus.es',rol:'revisor'}];
S.chats=[{id:'general',tipo:'canal',nombre:'general',autor:'',miembros:{}}];
S.abierto={canales:true,grupos:true,privados:true,equipo:true,compartidos:true}; S.dlg=null;
function miRol(){const m=S.equipo.find(x=>x.n===S.user.nombre); return m?m.rol:'';}
function nombreRol(id){const r=(S.roles||[]).find(x=>x.id===id); return r?r.nombre:(id||'Sin rol');}
function esAdmin(){return SRV?!!(S.permisos&&S.permisos.admin_roles):miRol()==='admin';}
function puede(mod,acc){if(!SRV) return true; return !!(S.permisos&&S.permisos[mod]&&S.permisos[mod][acc]);}
function nombreAccion(mod,acc){const m=(S.modulos||[]).find(x=>x[0]===mod); const a=m&&m[2].find(x=>x[0]===acc); return a?a[1]:acc;}
function sinPermiso(mod,acc){return `Tu rol (${nombreRol(miRol())}) no permite: ${nombreAccion(mod,acc)}.`;}
// Editar un documento exige a la vez: escalado + a mí + rol Dueño de Proceso + estado editable. Lo calcula el servidor
// (S.editables: documento → null si puedo, o el motivo) y lo vuelve a comprobar al guardar.
function motivoEditar(doc){
  if(!SRV) return 'Editar documentos necesita la revisión en equipo (python servidor.py).';
  if(!(S.escalados||{})[doc]) return 'El documento no está escalado. Solo se edita cuando se escala a un Dueño de Proceso.';
  const m=(S.editables||{})[doc]; return m===undefined?'Comprobando permisos…':m;
}
function sesionCaducada(){
  if(!S.token) return;
  S.token=''; clearInterval(S.sondeo); S.sondeo=null;
  document.getElementById('app').classList.add('hidden'); document.getElementById('login').classList.remove('hidden');
  aviso('Tu sesión ya no es válida (¿se reinició el servidor o te dieron de baja?). Vuelve a entrar.');
}
function aviso(txt){S.toast=txt; pintarToast(); clearTimeout(S._tt); S._tt=setTimeout(()=>{S.toast=''; pintarToast();},3500);}
function pintarToast(){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div'); t.id='toast'; t.setAttribute('role','status'); document.body.appendChild(t);}
  t.textContent=S.toast||''; t.style.display=S.toast?'block':'none';
}
const COLAV=['#1a4c7c','#c2185b','#248a3d','#a442d6','#c76a00','#0a6fd6'];
const NUM=new Map(RES.map((r,i)=>[r.documento+'|'+r.ubicacion,i+1]));     // #número de cada hallazgo para el chat
function ini(n){return String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');}
function colorDe(n){let h=0; for(const ch of String(n)) h=(h*31+ch.charCodeAt(0))>>>0; return COLAV[h%COLAV.length];}
function av(n,t=32){return `<span class="av" style="width:${t}px;height:${t}px;background:${colorDe(n)}">${esc(ini(n))}</span>`;}
function hace(iso){const m=(Date.now()-new Date(iso))/60000; if(m<1) return 'ahora'; if(m<60) return `hace ${Math.round(m)} min`; if(m<1440) return `hace ${Math.round(m/60)} h`; return fmtFecha(iso);}
function enLinea(n){return n===S.user.nombre||Object.keys(S.pres||{}).some(u=>u.toLowerCase()===n.toLowerCase());}
function menciones(html){return html.replace(/@([\wáéíóúñü.\-]+)/gi,'<span class="mention">@$1</span>');}
async function api(ruta,datos){
  try{
    // El servidor sabe quién eres por el token de sesión (X-Sesion), no por lo que diga el cuerpo de la petición
    const r=await fetch(ruta,{method:'POST',headers:{'Content-Type':'application/json','X-Sesion':S.token||''},body:JSON.stringify(datos||{})});
    const j=await r.json().catch(()=>({}));
    if(r.status===401){sesionCaducada(); return {ok:false,...j};}
    if(!r.ok&&j.error) aviso(j.error);
    return {ok:r.ok,...j};
  }catch(e){aviso('Sin conexión con el servidor'); return {ok:false};}
}
function focoKey(){if(S.view!=='revision') return ''; const r=R()[S.foco]; return r?key(r):'';}
async function sondear(){
  if(!SRV||!S.user.nombre) return;
  try{
    const r=await fetch(`/api/estado?key=${encodeURIComponent(focoKey())}&sid=${SID}`,{cache:'no-store',headers:{'X-Sesion':S.token||''}});
    if(r.status===401){sesionCaducada(); return;}
    if(!r.ok) throw new Error(r.status);
    const d=await r.json();
    Object.assign(S,{dec:d.dec,coms:d.comentarios,avisos:d.avisos,pres:d.presencia,
                     mensajes:d.mensajes||[],chats:d.chats||S.chats,ediciones:d.ediciones||{},versiones:d.versiones||{},
                     sesiones:d.sesiones||[],roles:d.roles||S.roles,modulos:d.modulos||[],permisos:d.permisos||null,
                     escalados:d.escalados||{},escHist:d.escalados_hist||[],editables:d.editables||{},cargado:true,config:d.config||S.config,
                     docs_meta:d.docs_meta||{},compartidos:d.compartidos||[],cargados:d.cargados||[],claves_api:d.claves_api||[],reglas:d.reglas||S.reglas});
    if(d.equipo&&d.equipo.length) S.equipo=d.equipo;
    const yo=S.equipo.find(m=>m.n===S.user.nombre); if(yo) S.user.cargo=`${nombreRol(yo.rol)} · Calidad Part-IS`;   // si te cambian el rol
    fusionarCargados();                                               // documentos cargados → DOCS (se abren como los demás)
    detectarNuevos(S.avisos||[]);
    if(!S.chats.some(c=>c.id===S.canal)) S.canal='general';         // el chat abierto se borró o ya no eres miembro
    const kAbierto='chat:'+S.canal;                                   // lo que ya estás viendo no queda como «nuevo»
    if(S.view==='chat'&&S.avisos.some(x=>x.key===kAbierto&&!x.leido)){
      S.avisos.forEach(x=>{if(x.key===kAbierto) x.leido=true;}); api('/api/leido',{key:kAbierto});
    }
    if(S.view==='metricas'&&S.met&&d.seq!==S._metSeq&&!S.metCargando) cargarMetricas();   // Métricas: solo si hubo novedades
    if(d.seq!==S._metSeq){                                            // Actividad: se recarga solo si hubo novedades
      if(S.view==='actividad'&&S.act.datos&&!S.act.cargando) cargarAct();
      if(S.view==='cuenta'&&S.miAct) cargarMiAct();
      if(S.view==='revision'&&S.actDoc&&S.actDoc.doc===S.doc) cargarActDoc(S.doc);
    }
    S._metSeq=d.seq;
    const firma=d.seq+'|'+JSON.stringify(d.presencia);
    const cambio=firma!==_firma||S.online!==true;      // solo se redibuja si hay novedades
    _firma=firma; S.online=true;
    if(cambio) render();
  }catch(e){if(S.online!==false){S.online=false; render();}}
}
async function enviarComentario(){
  const txt=(S.ccom||'').trim(), r=R().length?R()[S.foco]:(S.doc?docPseudo():null);
  if(!txt||!r) return;
  S.ccom=''; S.coms.push({key:key(r),user:S.user.nombre,texto:txt,fecha:new Date().toISOString()}); render();
  await api('/api/comentario',{key:key(r),texto:txt}); sondear();
}
// Quién más está mirando este hallazgo y el hilo de comentarios con @menciones.
function vPresencia(r){
  if(!SRV||!r) return '';
  const otros=Object.entries(S.pres||{}).filter(([u,k])=>k===key(r)&&u!==S.user.nombre).map(([u])=>u);
  return otros.length?`<div class="pres"><span class="av" style="width:20px;height:20px;font-size:10px;background:#c2185b">${esc(ini(otros[0]))}</span><span>${esc(otros.join(', '))} también ${otros.length>1?'están':'está'} en este hallazgo</span></div>`:'';
}
function vDebate(r){
  if(!r) return '';
  if(!SRV) return `<p class="note">Para comentar y avisar a compañeros con @nombre, abrid la revisión en equipo: <b>python servidor.py</b>.</p>`;
  const lista=(S.coms||[]).filter(c=>c.key===key(r)).map(c=>`<div class="com"><div class="q"><b>${esc(c.user)}</b> · ${fmtFecha(c.fecha)}</div>${menciones(esc(c.texto))}</div>`).join('');
  const enLinea=Object.keys(S.pres||{}).filter(u=>u!==S.user.nombre);
  return `<div class="debate"><b style="font-size:14px">Debate</b>
    ${lista||'<div class="small" style="margin:6px 0">Sin comentarios todavía.</div>'}
    ${puede('revisiones','comentar')?`<form id="comForm" class="chatin" style="margin-top:6px"><input id="ccom" value="${esc(S.ccom)}" placeholder="Comenta; usa @nombre para avisar" autocomplete="off" aria-label="Comentario para el equipo"><button type="submit">Enviar</button></form>`
      :`<p class="small" style="margin:6px 0 0">${esc(sinPermiso('revisiones','comentar'))}</p>`}
    ${enLinea.length?`<div class="small" style="margin-top:6px">En línea: ${enLinea.map(u=>esc(u)).join(', ')}</div>`:''}</div>`;
}
// ---------- Chat del equipo: canales, @menciones (avisan en la campanita) y #número para enlazar un hallazgo.
function tarjetaRef(n){
  const r=RES[n-1]; if(!r) return '';
  const d=decOf(r), est=d?DECTXT[d.dec]:'Pendiente';
  const c=d?(d.dec==='approved'?ECOL['Completado']:GRIS):ECOL['Pendiente'];
  return `<div class="ref" style="--c:${d?(d.dec==='approved'?'var(--ok)':'var(--sec)'):(r.tipo==='No verificable'?'var(--warn)':'var(--err)')}" data-act="abrirH" data-doc="${esc(r.documento)}" data-u="${esc(r.ubicacion)}" role="button" tabindex="0">
    <div style="min-width:0"><b>${esc(r.documento)}</b> <span class="small">${esc(r.ubicacion)}</span>
    <div class="small">${esc(r.justificacion.slice(0,120))}${r.justificacion.length>120?'…':''}</div></div>${pill('● '+est,c)}</div>`;
}
function textoChat(t){
  const h=menciones(esc(t)).replace(/(^|\s)#(\d{1,4})\b/g,(m,a,n)=>`${a}<a href="#" data-act="abrirNum" data-n="${n}" class="mention">#${n}</a>`);
  const nums=[...new Set([...t.matchAll(/(?:^|\s)#(\d{1,4})\b/g)].map(m=>+m[1]))];
  return h+nums.map(tarjetaRef).join('');
}
function vChat(){
  if(!SRV) return `<h2>Chat</h2><div class="card"><p class="sub" style="margin:0">El chat del equipo necesita la revisión en equipo: en la carpeta del auditor ejecuta <b>python servidor.py</b> y abre la dirección que muestra.</p></div>`;
  const actual=S.chats.find(c=>c.id===S.canal)||S.chats[0];
  const canal=actual.id;
  const msgs=(S.mensajes||[]).filter(m=>m.canal===canal);
  const ultMio=msgs.map(m=>m.user).lastIndexOf(S.user.nombre);
  const lista=msgs.map((m,i)=>{
    const mio=m.user===S.user.nombre&&m.id, quedan=mio?minEditables(m):0;
    // siempre visible mientras se pueda editar (antes dependía del ratón y «aparecía y se ocultaba» al enviar).

  // Cada grupo: su nombre y un desplegable con sus integrantes (abierto por defecto el grupo que estás viendo)

  // Cabecera según el tipo de chat

  if(actual.tipo==='grupo'){

    cab='#'+esc(actual.nombre);

  const vaciar=msgs.length?`<button class="ghost" data-act="vaciarChat" data-v="${esc(actual.id)}" style="font-size:13px;padding:6px 12px" title="Borra los mensajes solo para ti">Vaciar chat</button>`:'';
  const accionesGrupo=`<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${vaciar}

  return `<h2>Chat</h2>
    <div class="chatgrid">
      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="card" style="padding:12px">${seccion('canales','Canales',de('canal').length,

        <div class="card" style="padding:12px">${seccion('grupos','Grupos',de('grupo').length,

          return `<div class="card" style="padding:12px">${seccion('compartidos','Compartidos conmigo',mios.length,
            `<div style="margin-top:6px">${items||'<p class="small" style="margin:6px 4px">Nadie ha compartido documentos contigo todavía.</p>'}</div>`)}</div>`;})()}
      </div>
      <div class="card chatbox">
        <div style="border-bottom:1px solid var(--sep);padding-bottom:10px;display:flex;align-items:center;gap:12px">

          <button type="submit">Enviar</button></form>
        <div class="small" style="margin-top:4px">@ para mencionar · usa el clip o arrastra archivos aquí para adjuntarlos (máx. 25 MB)</div>
      </div>
    </div>`;

// Configuración → Usuarios y roles: personas, rol, estado; alta y baja (solo administradores, el servidor lo comprueba)
// ---------- Configuración → Usuarios: Roles (solo el rol Admin los crea, edita o elimina; el resto los consulta) y
// Usuarios (los gestiona quien tenga «Gestionar usuarios»). El servidor aplica todas las reglas; aquí se enseñan.
function permVacios(){const p={}; (S.modulos||[]).forEach(([m,,acc])=>{p[m]={}; acc.forEach(([a])=>{p[m][a]=false;});}); return p;}
function cuentaPerm(r){let si=0,n=0; (S.modulos||[]).forEach(([m,,acc])=>acc.forEach(([a])=>{n++; if(r.permisos&&r.permisos[m]&&r.permisos[m][a]) si++;})); return [si,n];}
function matrizPermisos(r,editable){
  const fijo=r.id==='admin';
  const filas=(S.modulos||[]).map(([m,nm,acc])=>`<tr><th colspan="2" style="background:#f2f2f7;color:var(--text)">${esc(nm)}</th></tr>`+
    acc.map(([a,na,da])=>{
      const on=!!(r.permisos&&r.permisos[m]&&r.permisos[m][a]);
      const soloDueno=m==='revisiones'&&a==='editar_escalados'&&r.id!=='dueno_proceso';
      const bloq=!editable||fijo||soloDueno;
      return `<tr><td><b style="font-weight:600">${esc(na)}</b><div class="small">${esc(da)}${soloDueno?' · solo se puede activar en el rol Dueño de Proceso':''}</div></td>
        <td style="text-align:right;white-space:nowrap">${editable&&!bloq
          ?`<label class="fchk" style="justify-content:flex-end"><input type="checkbox" data-perm="${m}.${a}" ${on?'checked':''} aria-label="${esc(na)}"><span>${on?'Habilitado':'Deshabilitado'}</span></label>`
          :(on?st('ok','✓ Habilitado'):st('neutral','— Deshabilitado'))}</td></tr>`;}).join('')+
    (m==='configuracion'?`<tr><td><b style="font-weight:600">Administrar roles</b><div class="small">Crear, editar y eliminar roles. Exclusivo del rol Admin: no se concede desde ningún otro rol.</div></td>
      <td style="text-align:right">${fijo?st('ok','✓ Solo Admin'):st('neutral','Solo Admin')}</td></tr>`:'')).join('');
  return `<table class="tperm"><tbody>${filas}</tbody></table>`;
}
function vRoles(){
  const admin=SRV&&esAdmin(), usan=id=>S.equipo.filter(m=>m.rol===id).length;
  if(SRV&&!(S.roles||[]).length) return `<div class="card"><p class="small">Todavía no hay roles.</p></div>`;
  const filas=(S.roles||[]).map(r=>{const [si,n]=cuentaPerm(r), u=usan(r.id);
    return `<tr class="clic ${S.rolPanel===r.id?'hl':''}" data-act="rolAbrir" data-v="${esc(r.id)}" tabindex="0" role="button" aria-label="Configurar el rol ${esc(r.nombre)}">
      <td><b>${esc(r.nombre)}</b>${r.sistema?' <span class="rolpill">Sistema</span>':''}<div class="small">${esc(r.descripcion||'')}</div></td>
      <td class="small">${SRV?`${si} de ${n} permisos`:''}</td><td class="small">${u} ${u===1?'usuario':'usuarios'}</td>
      <td style="text-align:right;color:var(--sec)"><svg class="ico-l" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></td></tr>`;}).join('');

// Panel lateral de un rol: datos, matriz de permisos y usuarios asociados. Solo Admin edita el rol; los usuarios

  const filasU=miembros.map(m=>`<div class="pr-u">${av(m.n,28)}<div style="flex:1;min-width:0"><b>${esc(m.n)}</b><div class="small">${esc(m.c)}</div></div>

  const anadir=!nuevo&&gest&&(base.id!=='admin'||admin)&&otros.some(tocable)?`<label class="small" style="display:flex;flex-direction:column;gap:4px;margin-top:10px">Añadir a este rol
      <select data-anadirrol="${esc(base.id)}"><option value="">Elige un usuario…</option>${otros.filter(m=>tocable(m)&&m.n!==S.user.nombre).map(m=>`<option value="${esc(m.n)}">${esc(m.n)} (ahora ${esc(nombreRol(m.rol))})</option>`).join('')}</select></label>`:'';
  return `<div class="scrim" data-act="rolCerrar"></div>
    <aside class="sidemodal" role="dialog" aria-modal="true" aria-label="${nuevo?'Nuevo rol':'Rol '+esc(base.nombre)}">

        <button class="drawer-x" data-act="rolCerrar" aria-label="Cerrar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"/></svg></button></div>
      ${editable?`<div style="display:flex;flex-direction:column;gap:10px">
          <label class="small" style="display:flex;flex-direction:column;gap:4px">Nombre<input id="rfN" value="${esc(f.nombre||'')}" maxlength="40" autocomplete="off" ${f.id==='dueno_proceso'?'disabled title="El nombre de este rol lo usa la regla de edición de documentos"':''}></label>
          <label class="small" style="display:flex;flex-direction:column;gap:4px">Descripción<input id="rfD" value="${esc(f.descripcion||'')}" maxlength="300" autocomplete="off"></label></div>`
        :`<p class="sub">${esc(base.descripcion||'')}</p>${SRV&&!admin?'<p class="note" style="margin-top:0">Solo el rol Admin puede modificar roles. Tú puedes consultarlo.</p>':''}${!nuevo&&base.id==='admin'&&admin?'<p class="note" style="margin-top:0">El rol Admin no se modifica: tiene siempre todos los permisos de administración.</p>':''}`}

      ${f.permisos?matrizPermisos(f,editable):'<p class="small">Sin permiso para ver el detalle.</p>'}
      ${nuevo?'<p class="small" style="margin-top:16px">Guarda el rol para poder asignarle usuarios.</p>':`<h3 style="margin:22px 0 6px">Usuarios con este rol <span class="small">(${miembros.length})</span></h3>
      ${filasU||'<p class="small">Nadie tiene este rol todavía.</p>'}${anadir}
      ${!gest&&SRV?'<p class="note">Tu rol no permite cambiar a qué rol pertenece cada usuario.</p>':''}`}
      <div class="fbtns" style="margin-top:22px">
        ${editable&&!nuevo&&!base.sistema?'<button class="ghost" data-act="rolBorrar" data-v="'+esc(base.id)+'" style="margin-right:auto">Eliminar rol</button>':''}
        <button class="ghost" data-act="rolCerrar">${editable?'Cancelar':'Cerrar'}</button>
        ${editable?`<button class="ok" data-act="rolGuardar">${nuevo?'Crear rol':'Guardar cambios'}</button>`:''}</div>
    </aside>`;
}

        <button class="ok" data-act="usrGuardar" data-v="${esc(m.n)}" style="font-size:13px;padding:6px 12px">Guardar</button></td></tr>`;

function vVisto(m,chat,ultimo){
  if(!m.id) return '<div class="visto"><span class="tk">✓</span>Enviando…</div>';
  const para=chat.tipo==='canal'?S.equipo.map(x=>x.n):Object.keys(chat.miembros||{});
  const otros=para.filter(n=>n!==S.user.nombre), v=Object.keys(m.vistos||{}).filter(n=>n!==S.user.nombre);
  const todos=otros.length>0&&otros.every(n=>v.includes(n));

  if(!v.length) txt='Enviado';
  else if(chat.tipo==='privado') txt=`Visto ${hace(m.vistos[v[0]])}`;
  else if(todos) txt='Visto por todos';
  else txt=`Visto por ${v.length>3?v.slice(0,3).join(', ')+` y ${v.length-3} más`:v.join(', ')}`;
  const titulo=v.length?v.map(n=>`${n} · ${fmtFecha(m.vistos[n])}`).join('\n'):'Todavía no lo ha visto nadie';
  return `<div class="visto ${todos?'si':''}" title="${esc(titulo)}"><span class="tk" aria-hidden="true">${v.length?'✓✓':'✓'}</span>${ultimo?esc(txt):`<span class="sr-only">${esc(txt)}</span>`}</div>`;

    S.pend=[...(S.pend||[]),p]; render();
    try{

        'X-Chat':encodeURIComponent(canal),'X-Nombre':encodeURIComponent(f.name)}});

function pintarBanners(){
  let c=document.getElementById('banners');
  if(!c){c=document.createElement('div'); c.id='banners'; c.setAttribute('aria-live','polite'); document.body.appendChild(c);}
  c.innerHTML=(S.banners||[]).map(b=>{
    const {icono,titulo}=infoAviso(b.k), n=(S.avisos||[]).filter(x=>x.key===b.k&&!x.leido).length;
    return `<div class="noti banner" data-bid="${b.id}" role="status">
      <button class="noti-x" data-act="cerrarBanner" data-bid="${b.id}" aria-label="Cerrar aviso" title="Cerrar">×</button>
      ${icono}<div style="flex:1;min-width:0">
        <div style="display:flex;gap:8px;align-items:baseline"><b class="noti-t">${esc(titulo)}</b><span class="small" style="margin-left:auto;white-space:nowrap">ahora</span></div>
        <div class="small" style="color:var(--text)">${n>1?`${n} nuevos`:b.k.startsWith('compartir:')?'te ha compartido un documento':b.a.mencion?'te ha mencionado':'mensaje nuevo'}</div>
        <div class="small noti-m"><b>${esc(b.a.de)}:</b> ${menciones(esc(b.a.texto))}</div></div>
      <button class="noti-ver" data-act="irAviso" data-k="${esc(b.k)}" data-bid="${b.id}">Ver</button></div>`;
  }).join('');
  (S.banners||[]).forEach(b=>{if(!_tBanner[b.id]) programarBanner(b.id,BANNER_S*1000);});
  c.querySelectorAll('.banner').forEach(el=>{
    const id=el.dataset.bid;
    el.onmouseenter=()=>{const t=_tBanner[id]; if(t){clearTimeout(t.t); t.resto=Math.max(1500,t.fin-Date.now());}};
    el.onmouseleave=()=>{const t=_tBanner[id]; if(t) programarBanner(id,t.resto||BANNER_S*1000);};
  });
  aplicarIdioma();
}
// Notificaciones agrupadas por chat (o por hallazgo): una tarjeta con icono, resumen y último mensaje; «Ver» y «×»
function vAvisos(){
  const grupos={};
  (S.avisos||[]).forEach(a=>{(grupos[a.key]=grupos[a.key]||[]).push(a);});
  const tarjetas=Object.entries(grupos).map(([k,as])=>{
    as.sort((x,y)=>x.fecha<y.fecha?-1:1);
    const ult=as[as.length-1], nuevos=as.filter(a=>!a.leido).length, menc=as.filter(a=>a.mencion||!k.startsWith('chat:')).length;
    const {icono,titulo}=infoAviso(k);
    const partes=[nuevos?`${nuevos} ${nuevos===1?'nuevo':'nuevos'}`:'leídos', menc&&k.startsWith('chat:')?`${menc} ${menc===1?'mención':'menciones'}`:''].filter(Boolean);
    // Cerrada: montón con el último mensaje. Abierta: todos los mensajes del grupo (desplegar NO los marca como leídos)
    const abierta=S.expAviso.has(k), n=as.length;
    const pila=!abierta&&n>1?`pila${n>2?' p3':''}`:'';
    const lista=abierta?`<div class="noti-lista">${as.slice().reverse().map(a=>`<div class="noti-item ${a.mencion?'menc':''}">${av(a.de,24)}
        <div style="min-width:0;flex:1"><div><b>${esc(a.de)}</b> <span class="small">${hace(a.fecha)}</span>${a.leido?'':' <span class="cnt" style="height:8px;min-width:8px;padding:0" aria-label="sin leer"></span>'}</div>
        <div style="white-space:pre-wrap;overflow-wrap:anywhere">${menciones(esc(a.texto))}</div></div></div>`).join('')}
        <button class="noti-menos" data-act="expAviso" data-k="${esc(k)}">Mostrar menos</button></div>`:'';
    return {fecha:ult.fecha,nuevos,html:`<div class="noti ${nuevos?'':'leida'} ${pila} ${abierta?'abierta':''}">
      <button class="noti-x" data-act="borrarAviso" data-k="${esc(k)}" aria-label="Eliminar las notificaciones de ${esc(titulo)}" title="Eliminar">×</button>
      ${icono}
      <button class="noti-cuerpo" data-act="expAviso" data-k="${esc(k)}" aria-expanded="${abierta}" title="${abierta?'Mostrar menos':'Ver los mensajes aquí'}">
        <span style="display:flex;gap:8px;align-items:baseline"><b class="noti-t">${esc(titulo)}</b><span class="small" style="margin-left:auto;white-space:nowrap">${hace(ult.fecha)}</span></span>
        <span class="small" style="color:var(--text)">${partes.join(' · ')}</span>
        ${abierta?'':`<span class="small noti-m"><b>${esc(ult.de)}:</b> ${menciones(esc(ult.texto))}</span>`}
      </button>
      <button class="noti-ver" data-act="irAviso" data-k="${esc(k)}">Ver</button>${lista}</div>`};
  }).sort((a,b)=>(b.nuevos>0)-(a.nuevos>0)||(a.fecha<b.fecha?1:-1));
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><h3 style="margin:0">Notificaciones</h3>
      <div style="display:flex;gap:6px">${tarjetas.length?'<button class="ghost" data-act="borrarAviso" data-k="" style="font-size:12px;padding:5px 10px">Borrar todas</button>':''}
      <button class="ghost" data-act="avisos" aria-label="Cerrar" style="padding:5px 10px">×</button></div></div>`
    +(tarjetas.map(t=>t.html).join('')||'<p class="small">No tienes notificaciones.</p>');
}

function tr(s){
  const t=s.trim(); if(!t) return null;
  if(EN[t]) return s.replace(t,EN[t]);
  for(const [re,r] of EN_RE) if(re.test(t)) return s.replace(t,t.replace(re,r));
  return null;
}
function aplicarIdioma(){
  document.documentElement.lang=S.lang;
  document.getElementById('lang-es').classList.toggle('on',S.lang==='es');
  document.getElementById('lang-en').classList.toggle('on',S.lang==='en');
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT); let n;
  while((n=w.nextNode())){
    if(n.parentElement&&n.parentElement.closest('script,style,textarea,pre')) continue;   // texto de documentos: no se traduce
    if(n._es===undefined) n._es=n.nodeValue;
    const v=S.lang==='en'?(tr(n._es)??n._es):n._es;
    if(n.nodeValue!==v) n.nodeValue=v;
  }
  document.querySelectorAll('[placeholder]').forEach(el=>{
    if(el._ph===undefined) el._ph=el.placeholder;
    el.placeholder=S.lang==='en'?(tr(el._ph)??el._ph):el._ph;
  });
}

function pasaFiltroH(r){
  const d=decOf(r);
  if(S.hdec==='pend'&&d) return false;
  if((S.hdec==='approved'||S.hdec==='rejected')&&(!d||d.dec!==S.hdec)) return false;
  if(S.htipo&&r.tipo!==S.htipo) return false;
  if(S.hclau&&r.clausula!==S.hclau) return false;
  if(S.hmios&&(!d||d.user!==S.user.nombre)) return false;
  if(S.hnuevos&&ABIERTOS.has(key(r))) return false;
  if(S.hcoms&&!(S.coms||[]).some(c=>c.key===key(r))) return false;

function abrirRevision(doc){
  guardarPestana();
  S.view='revision'; S.sel={}; S.comment=''; S.extraOpen=false;
  if(!S.tabs.includes(doc)) S.tabs.push(doc);                      // cada documento abierto queda como pestaña
  const prev=S.tabEstado[doc]; if(S.doc!==doc) S.verOpen=false; S.doc=doc;
  if(prev){S.foco=prev.foco; S.pdfPag=prev.pdfPag; S.centrar=true; return;}   // vuelve a donde estabas en ese documento
  if(!R().length){S.foco=0; S.pdfPag=1; return;}                     // sin hallazgos: desde la primera página
  const p=R().findIndex(x=>!decOf(x));
  irA(p>=0?p:0);
}

S.tabs=[]; S.tabEstado={};

function cerrarPestana(doc){
  const i=S.tabs.indexOf(doc); if(i<0) return;
  S.tabs.splice(i,1); delete S.tabEstado[doc];
  if(S.doc!==doc) return;
  if(S.tabs.length){S.doc=null; abrirRevision(S.tabs[Math.min(i,S.tabs.length-1)]);}
  else{S.doc=null; S.view=S.origen[doc]||'inicio';}                  // al cerrar la última se vuelve a donde se abrió

const _orig={}, _vers={};
async function textoOriginal(doc,n){
  const k=doc+'|'+n; if(k in _orig) return _orig[k];
  try{const r=await fetch(`${D.carpeta}/${DOCS[doc].slug}_${n}.txt`,{cache:'no-store'}); _orig[k]=r.ok?await r.text():'';}catch(e){_orig[k]='';}

// (una versión manipulada no puede inyectar código en el navegador de otra persona).
const ETQ_OK=new Set(['H2','H3','H4','P','TABLE','THEAD','TBODY','TR','TH','TD','B','STRONG','BR','UL','OL','LI']);
function limpiarHTML(html){
  const doc=new DOMParser().parseFromString(`<body>${html||''}</body>`,'text/html');
  const limpiar=nodo=>{
    for(const n of [...nodo.childNodes]){
      if(n.nodeType===3) continue;
      if(n.nodeType!==1){n.remove(); continue;}
      limpiar(n);
      let t=n.tagName;
      if(t==='DIV'||t==='H1'){const p=doc.createElement(t==='H1'?'h2':'p'); while(n.firstChild) p.appendChild(n.firstChild); n.replaceWith(p); continue;}
      if(t==='STRONG'){const b=doc.createElement('b'); while(n.firstChild) b.appendChild(n.firstChild); n.replaceWith(b); continue;}
      if(!ETQ_OK.has(t)){if(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','SVG','MATH','TEMPLATE'].includes(t)) n.remove(); else n.replaceWith(...n.childNodes); continue;}
      for(const at of [...n.attributes]) if(!(['colspan','rowspan'].includes(at.name)&&/^\d{1,2}$/.test(at.value))) n.removeAttribute(at.name);
    }
  };
  limpiar(doc.body); return doc.body.innerHTML.trim();
}
function esHTML(t){return /^\s*</.test(t||'');}
function textoAHTML(t){return String(t||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>`<p>${esc(l)}</p>`).join('');}

function htmlATexto(html){                       // para comparar y descargar: tablas como «celda | celda»
  const d=document.createElement('div'); d.innerHTML=limpiarHTML(html); const out=[];
  for(const b of d.children){
    if(b.tagName==='TABLE') b.querySelectorAll('tr').forEach(tr=>out.push([...tr.children].map(c=>c.innerText.replace(/\s+/g,' ').trim()).join(' | ')));
    else if(b.tagName==='UL'||b.tagName==='OL') b.querySelectorAll('li').forEach(li=>out.push('• '+li.innerText.trim()));
    else out.push(b.innerText.trim());
  }
  return out.filter(Boolean).join('\n');
}

// Diferencias por palabras (LCS en dos niveles: líneas y, dentro de lo cambiado, palabras).
function tokensDe(s){return s.match(/\s+|[0-9A-Za-zÀ-ÿ]+|[^\s0-9A-Za-zÀ-ÿ]/g)||[];}
function lcsOps(a,b){
  const n=a.length,m=b.length; let i0=0,e=0;
  while(i0<n&&i0<m&&a[i0]===b[i0]) i0++;
  while(e<n-i0&&e<m-i0&&a[n-1-e]===b[m-1-e]) e++;
  const A=a.slice(i0,n-e),B=b.slice(i0,m-e),N=A.length,M=B.length,ops=a.slice(0,i0).map(v=>({t:'=',v}));
  if(N*M>3e6){A.forEach(v=>ops.push({t:'-',v})); B.forEach(v=>ops.push({t:'+',v}));}   // muy largo: bloque entero
  else{
    const W=M+1,T=new Uint32Array((N+1)*W);
    for(let i=N-1;i>=0;i--) for(let j=M-1;j>=0;j--) T[i*W+j]=A[i]===B[j]?T[(i+1)*W+j+1]+1:Math.max(T[(i+1)*W+j],T[i*W+j+1]);
    let i=0,j=0;
    while(i<N&&j<M){
      if(A[i]===B[j]){ops.push({t:'=',v:A[i]});i++;j++;}
      else if(T[(i+1)*W+j]>=T[i*W+j+1]) ops.push({t:'-',v:A[i++]});
      else ops.push({t:'+',v:B[j++]});
    }
    while(i<N) ops.push({t:'-',v:A[i++]}); while(j<M) ops.push({t:'+',v:B[j++]});
  }
  a.slice(n-e).forEach(v=>ops.push({t:'=',v}));
  return ops;
}
function diffTexto(a,b){
  const out=[], push=(t,s)=>{if(!s) return; const u=out[out.length-1]; if(u&&u.t===t) u.s+=s; else out.push({t,s});};
  const ol=lcsOps(a.split('\n'),b.split('\n'));
  for(let k=0;k<ol.length;){
    if(ol[k].t==='='){push('=',ol[k].v+'\n'); k++; continue;}
    const del=[],ins=[]; while(k<ol.length&&ol[k].t!=='='){(ol[k].t==='-'?del:ins).push(ol[k].v); k++;}
    lcsOps(del.length?tokensDe(del.join('\n')+'\n'):[],ins.length?tokensDe(ins.join('\n')+'\n'):[]).forEach(o=>push(o.t,o.v));
  }
  return out;
}
// Un lado del diff en HTML. lado 'b' (versión): '=' y '+' resaltado; lado 'a' (original): '=' y '-' tachado.
// Con marcarQuitado, en el lado 'b' se deja una marquita roja donde se quitó algo (sin mover el texto).
function ladoHTML(ops,lado,marcarQuitado){

    if(o.t==='=') piezas.push([o.s,'']);
    else if(o.t==='+'&&lado==='b') piezas.push([o.s,'ed-add']);
    else if(o.t==='-'&&lado==='a') piezas.push([o.s,'ln-del']);

    const j=await r.json().catch(()=>({}));

// Tooltip común: cualquier elemento con data-tv (valor) y data-tl (etiqueta). El valor manda; la etiqueta, debajo.
function tipMet(el,x,y){

  if(!t){t=document.createElement('div'); t.id='metTip'; t.setAttribute('role','tooltip'); document.body.appendChild(t);}

// Línea con cruz: la vertical busca el día más cercano y el tooltip lista las dos series
const _lineas={};
function lineaHover(hit,e){
  const L=_lineas[hit.dataset.id]; if(!L) return;
  const b=hit.getBoundingClientRect(), fx=(e.clientX-b.left)/b.width*L.W;
  const i=Math.max(0,Math.min(L.serie.length-1,Math.round((fx-L.x0)/L.dx)));
  const p=L.serie[i], x=L.x0+i*L.dx, cruz=hit.parentNode.querySelector('.mlin-x');
  cruz.setAttribute('x1',x); cruz.setAttribute('x2',x); cruz.setAttribute('visibility','visible');
  const fake={dataset:{tv:fmtFecha(p.fecha+'T12:00:00').split(',')[0],tl:L.claves.map(k=>`${k.nombre}: ${p[k.k]===null||p[k.k]===undefined?'—':fmtN(p[k.k],1)}`).join('\n')}};
  tipMet(fake,e.clientX,e.clientY);
}
function svgLinea(id,serie,claves,{hoy,fin}={}){
  const W=960,H=260,x0=44,x1=W-150,y0=30,y1=H-30;
  if(!serie.length) return '<p class="small">Sin datos para estos filtros.</p>';
  const max=Math.max(1,...serie.flatMap(p=>claves.map(k=>p[k.k]||0)));
  const paso=max<=5?1:Math.pow(10,Math.floor(Math.log10(max)))*(max/Math.pow(10,Math.floor(Math.log10(max)))>5?2:1);
  const top=Math.ceil(max/paso)*paso, Y=v=>y1-(v/top)*(y1-y0), dx=serie.length>1?(x1-x0)/(serie.length-1):0;
  _lineas[id]={serie,claves,W,x0,dx};
  const ticks=[]; for(let v=0;v<=top;v+=paso) ticks.push(v);
  const grid=ticks.map(v=>`<line x1="${x0}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}" stroke="${MCOL.grid}" stroke-width="1"/><text x="${x0-8}" y="${Y(v)+4}" text-anchor="end" class="mtick">${fmtN(v)}</text>`).join('');
  const idx=f=>serie.findIndex(p=>p.fecha===f);
  // «Hoy» se rotula hacia la izquierda y «Fin del plazo» hacia la derecha: si caen cerca no se pisan
  const marca=(f,t,lado)=>{const i=idx(f); if(i<0) return ''; const x=x0+i*dx; return `<line x1="${x}" x2="${x}" y1="${y0}" y2="${y1}" stroke="${MCOL.eje}" stroke-width="1"/><text x="${lado==='izq'?x-4:x+4}" y="${y0-8}" text-anchor="${lado==='izq'?'end':'start'}" class="mtick">${t}</text>`;};
  const lineas=claves.map(k=>{
    const pts=serie.map((p,i)=>p[k.k]===null||p[k.k]===undefined?null:[x0+i*dx,Y(p[k.k])]).filter(Boolean);
    if(!pts.length) return '';
    const ult=pts[pts.length-1], v=serie[pts.length-1+serie.findIndex(p=>p[k.k]!==null&&p[k.k]!==undefined)]?.[k.k];
    return `<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${k.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${ult[0]}" cy="${ult[1]}" r="4" fill="${k.color}" stroke="#fff" stroke-width="2"/>
      <text x="${ult[0]+8}" y="${ult[1]+4}" class="mlab">${esc(k.nombre)}</text>`;
  }).join('');
  const ejeX=`<line x1="${x0}" x2="${x1}" y1="${y1}" y2="${y1}" stroke="${MCOL.eje}" stroke-width="1"/>
    <text x="${x0}" y="${H-8}" class="mtick">${fmtF(serie[0].fecha)}</text><text x="${x1}" y="${H-8}" text-anchor="end" class="mtick">${fmtF(serie[serie.length-1].fecha)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="mchart" role="img" aria-label="${esc(claves.map(k=>k.nombre).join(' y '))} por día">${grid}${ejeX}${marca(fin,'Fin del plazo','der')}${marca(hoy,'Hoy','izq')}${lineas}
    <line class="mlin-x" x1="0" x2="0" y1="${y0}" y2="${y1}" stroke="#52514e" stroke-width="1" visibility="hidden"/>
    <rect class="mlin-hit" data-id="${id}" x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" fill="transparent"/></svg>`;
}
// Columnas apiladas por día (dos series): 2 px de hueco entre tramos, esquinas de 4 px arriba
function svgColumnas(serie,claves){
  const W=960,H=220,x0=36,x1=W-10,y0=10,y1=H-26;
  const max=Math.max(1,...serie.map(p=>claves.reduce((a,k)=>a+(p[k.k]||0),0))), top=Math.max(1,Math.ceil(max));
  const Y=v=>(v/top)*(y1-y0), bw=Math.min(24,Math.max(3,(x1-x0)/serie.length-2));
  const ticks=[0,Math.ceil(top/2),top].filter((v,i,a)=>a.indexOf(v)===i);
  let out=ticks.map(v=>`<line x1="${x0}" x2="${x1}" y1="${y1-Y(v)}" y2="${y1-Y(v)}" stroke="${MCOL.grid}"/><text x="${x0-6}" y="${y1-Y(v)+4}" text-anchor="end" class="mtick">${fmtN(v)}</text>`).join('');
  serie.forEach((p,i)=>{
    const cx=x0+(i+0.5)*((x1-x0)/serie.length)-bw/2; let base=y1;
    const tot=claves.reduce((a,k)=>a+(p[k.k]||0),0);
    claves.forEach((k,j)=>{const v=p[k.k]||0; if(!v) return; const h=Y(v); const ultimo=claves.slice(j+1).every(q=>!(p[q.k]||0));
      out+=`<path d="${rectRed(cx,base-h,bw,h-(base<y1?2:0),ultimo?4:0)}" fill="${k.color}" tabindex="0" data-tv="${fmtN(v)} ${k.nombre.toLowerCase()}" data-tl="${fmtF(p.fecha)} · ${fmtN(tot)} en total"/>`; base-=h;});
  });
  out+=`<line x1="${x0}" x2="${x1}" y1="${y1}" y2="${y1}" stroke="${MCOL.eje}"/>`;
  if(serie.length) out+=`<text x="${x0}" y="${H-8}" class="mtick">${fmtF(serie[0].fecha)}</text><text x="${x1}" y="${H-8}" text-anchor="end" class="mtick">${fmtF(serie[serie.length-1].fecha)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="mchart" role="img" aria-label="Decisiones por día">${out}</svg>`;
}
function rectRed(x,y,w,h,r){r=Math.min(r,w/2,h); return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`;}
// Barras horizontales ordenadas, un solo tono; valor al final; pinchar lleva a Auditorías con el filtro
function barrasH(items,{tl,act}={}){

  return `<div class="mbar">${items.map(x=>{const f=act&&act(x); return `<button class="mbar-f" ${f?`data-act="metIr" data-f="${esc(JSON.stringify(f))}"`:''} data-tv="${fmtN(x.n)}" data-tl="${esc(x.label)}${tl?'\n'+esc(tl(x)):''}${f?'\nPulsa para ver los documentos':''}">
      <span class="mbar-n">${esc(x.label)}</span><span class="mbar-t"><span class="mbar-b" style="width:${Math.max(2,x.n/max*88)}%"></span><span class="mbar-v">${fmtN(x.n)}</span></span></button>`;}).join('')}</div>`;
}

// Barra segmentada alta (una sola cosa partida en partes): cifra dentro si cabe; leyenda con los nombres
function segmentada(partes){
  const tot=partes.reduce((a,p)=>a+p.n,0); if(!tot) return '<p class="small">Sin datos para estos filtros.</p>';
  return `<div class="mseg" role="img" aria-label="${esc(partes.map(p=>`${p.label}: ${p.n}`).join(', '))}">${partes.filter(p=>p.n).map(p=>{const pc=p.n/tot*100;

// Mapa de calor familia × cláusula (rampa de azules; la cifra va escrita en cada celda)
function mapaCalor(m){
  if(!m.familias.length) return '<p class="small">Sin datos para estos filtros.</p>';
  const max=Math.max(1,...m.celdas.flat());
  const col=v=>v?MCOL.rampa[Math.min(MCOL.rampa.length-1,Math.floor(v/max*(MCOL.rampa.length-1)))]:'#f2f2f0';
  const tinta=v=>v&&v/max>0.45?'#fff':'#0b0b0b';
  return `<div class="mmap"><table><thead><tr><th></th>${m.clausulas.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>
    ${m.familias.map((f,i)=>`<tr><th>${esc(f)}</th>${m.celdas[i].map((v,j)=>`<td><button class="mmap-c" style="background:${col(v)};color:${tinta(v)}" ${v?`data-act="metIr" data-f="${esc(JSON.stringify({itipo:f,hclau:m.clausulas[j]==='Sin cláusula'?'—':m.clausulas[j]}))}"`:'disabled'}
      data-tv="${fmtN(v)} hallazgos" data-tl="${esc(f)} · ${esc(m.clausulas[j])}${v?'\nPulsa para ver los documentos':''}">${v||''}</button></td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="mescala"><span class="small">0</span>${MCOL.rampa.map(c=>`<i style="background:${c}"></i>`).join('')}<span class="small">${fmtN(max)}</span></div>`;
}

// Sobre qué se aplica la decisión: los seleccionados pendientes; si no hay ninguno, el hallazgo activo.
function objetivosActuales(){
  const rs=R();
  const sel=rs.filter(r=>S.sel[key(r)]&&!decOf(r));
  if(sel.length) return sel;
  const f=rs[S.foco];
  return !f||decOf(f)?[]:[f];
}

function aplicar(dec){
  const acc=dec==='approved'?'aprobar':'rechazar';
  if(!puede('revisiones',acc)){aviso(sinPermiso('revisiones',acc)); return;}      // el servidor también lo rechaza
  const bloq=bloqueoDecision(S.doc); if(bloq){aviso(bloq); return;}
  const comentario=(S.comment||'').trim();
  const fecha=new Date().toISOString();
  const objs=objetivosActuales();
  objs.forEach(r=>{S.dec[key(r)]={dec,note:comentario,fecha,user:S.user.nombre};});
  if(SRV) api('/api/decision',{keys:objs.map(key),dec,note:comentario}).then(sondear);   // compartida con el equipo
  else persist();
  S.sel={}; S.comment='';
  const n=nextPending(S.foco);
  if(n>=0) irA(n);
  render();
}

  S.extra.push({documento:S.doc,referencia:(S.extraForm.ref||'').trim(),comentario:txt,fecha:new Date().toISOString()});

}

function csvEsc(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function toCSV(rows,cols){return cols.join(',')+'\n'+rows.map(r=>cols.map(c=>csvEsc(r[c])).join(',')).join('\n')+'\n';}
function baja(nombre,texto){

  const a=document.createElement('a');

}

function edicionDe(r){const e=(S.ediciones||{})[key(r)]; return e&&e.length?e[e.length-1]:null;}

  const cols=['documento','ubicacion','tipo','clausula','justificacion','decision','revisor','comentario','editado_por','tipo_original','clausula_original','justificacion_original'];
  const rows=RES.map(r=>{const d=decOf(r), e=edicionDe(r); return {documento:r.documento,ubicacion:r.ubicacion,

async function exportar(cual,fmt){
  const acc=cual==='res'?'descargar_respuestas':'descargar_revision';
  if(!puede('historico',acc)){aviso(sinPermiso('historico',acc)); return;}
  const f=datosExport(cual);
  if(fmt==='csv') return bajaBlob(f.nombre+'.csv',new Blob([(cual==='res'?'':'﻿')+toCSV(f.rows,f.cols)],{type:'text/csv;charset=utf-8'}));
  if(fmt==='json') return bajaBlob(f.nombre+'.json',new Blob([JSON.stringify(f.rows,null,2)],{type:'application/json'}));
  if(fmt==='xlsx'){
    try{
      const X=await cargarXLSX(), ws=X.utils.json_to_sheet(f.rows,{header:f.cols}), wb=X.utils.book_new();
      X.utils.book_append_sheet(wb,ws,'Hallazgos'); X.writeFile(wb,f.nombre+'.xlsx');
    }catch(e){                                          // sin internet: hoja de Excel clásica (.xls), sin librerías

      const x=`<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="Hallazgos"><Table>${filas.map(fi=>'<Row>'+fi.map(v=>`<Cell><Data ss:Type="String">${esc(v)}</Data></Cell>`).join('')+'</Row>').join('')}</Table></Worksheet></Workbook>`;
      bajaBlob(f.nombre+'.xls',new Blob([x],{type:'application/vnd.ms-excel'}));
      aviso('Sin internet: se ha exportado como Excel clásico (.xls)');
    }
    return;
  }
  if(fmt==='doc'){
    const h=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${esc(f.titulo)}</title>
      <style>@page{size:29.7cm 21cm;mso-page-orientation:landscape;margin:1.5cm}body{font-family:Arial,sans-serif;font-size:9pt}h1{font-size:15pt;color:#1a4c7c}table{border-collapse:collapse}td,th{border:1px solid #999;padding:3px 5px;vertical-align:top}th{background:#1a4c7c;color:#fff}</style></head><body>${tablaHTML(f)}</body></html>`;
    return bajaBlob(f.nombre+'.doc',new Blob(['﻿'+h],{type:'application/msword'}));
  }
  if(fmt==='pdf'){                                     // informe imprimible: en la ventana de imprimir, «Guardar como PDF»
    const w=window.open('','_blank');
    if(!w){aviso('El navegador ha bloqueado la ventana: permite las ventanas emergentes'); return;}
    w.document.write(`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>${esc(f.nombre)}</title>
      <style>@page{size:A4 landscape;margin:12mm}body{font-family:Arial,sans-serif;font-size:9pt;color:#1c1c1e}h1{font-size:15pt;color:#1a4c7c;margin:0 0 4px}p{color:#6e6e73;margin:0 0 10px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #d1d1d6;padding:3px 5px;vertical-align:top;text-align:left}th{background:#1a4c7c;color:#fff}tr{page-break-inside:avoid}</style></head>
      <body>${tablaHTML(f)}<script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`);
    w.document.close();
  }
}

      ${(()=>{const ev=evaluarDoc(S.doc); return `<div class="veredicto" style="--vc:${(VCOL[ev.v]||['#00205b'])[0]};--vb:${(VCOL[ev.v]||['','#f2f4f8'])[1]}">
        <div><span class="small">Veredicto con las reglas de aceptación</span><b>${esc(ev.v)}</b></div>
        ${ev.fallos.length?`<ul>${ev.fallos.map(f=>`<li><b>${esc(f.regla.nombre)}</b> · ${esc(f.motivo)} <span class="small">(${f.regla.efecto==='rechazar'?'rechaza':'revisión manual'})</span></li>`).join('')}</ul>`:'<p class="small" style="margin:6px 0 0">Cumple todas las reglas activas.</p>'}</div>`;})()}
      ${rs.map(x=>vMotivo(x)).join('')}

      <button data-act="volver" style="width:100%;margin-top:10px">Volver al listado</button>

  }

  const puedes=objetivosActuales().length>0&&!bloq, pAp=puede('revisiones','aprobar'), pRe=puede('revisiones','rechazar');
