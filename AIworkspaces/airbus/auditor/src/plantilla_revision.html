<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revisión de hallazgos · Reto Airbus</title>
<!-- Diseño: prototipo de Valentina (prototipo-revision-hallazgos.html). Datos: generados por generar_revision.py
     a partir de respuestas.csv, la traza del verificador y los PDF del corpus. No editar a mano: se regenera. -->
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--sec:#6e6e73;--sep:#d1d1d6;--tint:#0a84ff;--ok:#34c759;--warn:#ff9f0a;--err:#ff3b30;--r:14px;font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-size:15px;line-height:1.4}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 16px;background:var(--tint);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:#e5e5ea;color:var(--text)}
button.ok{background:var(--ok)}
button.warn{background:var(--warn)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid rgba(10,132,255,.45);outline-offset:2px}
input,select,textarea{font:inherit;padding:9px 11px;border:1px solid var(--sep);border-radius:10px;background:#fff;color:var(--text)}
input[type=checkbox]{width:18px;height:18px;padding:0;margin:0;flex:none;accent-color:var(--tint)}
a{color:var(--tint)}
.hidden{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-card{background:#fff;border-radius:20px;padding:36px;width:380px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.login-card h1{font-size:22px;margin:0 0 4px}
.login-card p{color:var(--sec);margin:0 0 20px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;color:var(--sec)}
.login-card button{width:100%;padding:12px}
.topbar{position:sticky;top:0;height:56px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--sep);display:flex;align-items:center;gap:14px;padding:0 20px;z-index:5}
.burger{background:none;color:var(--text);padding:4px 8px;font-size:22px;line-height:1}
.topbar .title{font-weight:600;font-size:17px}
.drawer{position:fixed;top:0;bottom:0;left:0;width:290px;background:#fff;box-shadow:4px 0 24px rgba(0,0,0,.12);transform:translateX(-102%);transition:transform .25s;z-index:20;padding:20px;display:flex;flex-direction:column;gap:6px}
.drawer.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:18}
.sidemodal{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.15);z-index:30;padding:22px;overflow:auto}
.dialog{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(520px,92vw);background:#fff;border-radius:16px;padding:22px;z-index:35;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.dialog input,.dialog textarea{width:100%}
.user{padding:14px;border-radius:12px;background:var(--bg);margin-bottom:12px}
.user b{display:block;font-size:16px}
.user span{color:var(--sec);font-size:13px}
.nav-item{text-align:left;background:none;color:var(--text);padding:11px 12px;border-radius:10px;font-size:15px}
.nav-item:hover{background:#f0f0f5}
.nav-item.active{background:#e5f1ff;color:var(--tint);font-weight:600}
.nav-item.sub{padding-left:30px;font-size:14px}
main{padding:18px 20px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.sp{flex:1}
h2{font-size:22px;margin:0 0 4px}
h3{margin:0 0 8px;font-size:16px}
.sub{color:var(--sec);margin:0 0 14px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--sep);font-size:14px;vertical-align:top}
th{color:var(--sec);font-weight:500;font-size:13px}
tr.clic{cursor:pointer}
tr.clic:hover td{background:#f7f7fa}
tr.hl td{background:#fff6cc}
.small{font-size:13px;color:var(--sec)}
.note{font-size:12px;color:var(--sec);background:#f7f7fa;border-radius:10px;padding:10px;margin-top:12px}
.st{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--text);white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.two{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.right{position:sticky;top:74px;max-height:calc(100vh - 150px);display:flex;flex-direction:column;overflow:hidden}
.lista-scroll{max-height:min(190px,24vh);overflow:auto;flex:none}
.motivo-scroll{margin-top:12px;flex:1 1 auto;min-height:90px;overflow:auto}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:8px;border-bottom:1px solid var(--sep)}
.hrow.on{background:#e5f1ff}
.hrow .nm{flex:1;text-align:left;background:none;color:var(--text);padding:0;font-weight:600;font-size:14px}
.pnav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.iconbtn{background:#e5e5ea;color:var(--text);padding:8px 10px;display:inline-flex;align-items:center}
.pdfwrap{background:#e9e9ee;border-radius:10px;padding:18px}
.sumrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--sep);font-size:14px}
.rule{background:#f7f7fa;border-radius:10px;padding:12px;font-size:14px;margin:10px 0}
.fbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.fbtns button{font-size:14px;padding:11px 8px}
.log{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--sec);background:#f7f7fa;border-radius:10px;padding:12px;max-height:320px;overflow:auto}
.chat{display:flex;flex-direction:column;height:520px}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:8px 0}
.m{padding:10px 13px;border-radius:14px;max-width:88%;font-size:14px}
.m.u{align-self:flex-end;background:var(--tint);color:#fff}
.m.a{align-self:flex-start;background:var(--bg)}
.chatin{display:flex;gap:8px}
.chatin input{flex:1}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{background:#e5e5ea;color:var(--text)}
.tabs button.on{background:var(--tint);color:#fff}
mark{background:#ffe27a;padding:0 2px;border-radius:3px}
.cita{border-left:3px solid var(--warn);background:#fff8ec;padding:6px 10px;border-radius:0 8px 8px 0;margin:4px 0;font-size:13px;color:var(--text)}
.hscroll{max-height:560px;overflow:auto}
/* Inicio con la estructura de lista de Marina, en el sistema de diseño de Apple de Valentina */
.seg{display:inline-flex;flex-wrap:wrap;background:#e5e5ea;border-radius:9px;padding:2px;gap:2px}
.seg button{background:none;color:var(--text);padding:6px 12px;border-radius:7px;font-size:13px}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.seg .n{color:var(--sec);margin-left:6px;font-weight:400}
.dlist{display:flex;flex-direction:column;gap:8px}
.drow{display:grid;grid-template-columns:240px minmax(0,1fr) 170px;gap:16px;align-items:center;background:#fff;border-radius:12px;padding:12px 16px;border-left:4px solid var(--c);box-shadow:0 1px 2px rgba(0,0,0,.04);cursor:pointer;transition:box-shadow .15s}
.drow:hover{box-shadow:0 3px 10px rgba(0,0,0,.08)}
.drow.off{cursor:default}
.drow.off:hover{box-shadow:0 1px 2px rgba(0,0,0,.04)}
.drow .cod{font-weight:700;font-size:15px}
.drow .tit{font-size:14px;margin-bottom:6px}
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;background:var(--pb);color:var(--pc);margin:0 4px 3px 0;white-space:nowrap}
.estado{justify-self:end;text-align:right}
.mini{height:4px;background:#e5e5ea;border-radius:999px;overflow:hidden;width:120px;margin:6px 0 0 auto}
/* Barra superior: idioma, avisos y usuario; revisión en equipo (debate, menciones, presencia) */
.topbar .seg button{padding:4px 10px;font-size:13px}
.bell{position:relative;background:#f2f2f7;color:var(--text);padding:7px 9px;border-radius:10px;display:inline-flex;align-items:center}
.badge{position:absolute;top:-6px;right:-7px;background:var(--err);color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:18px;height:18px;padding:0 5px;display:flex;align-items:center;justify-content:center}
.who{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.av{width:28px;height:28px;border-radius:50%;background:#1a4c7c;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.avisos{position:fixed;top:62px;right:16px;width:min(380px,92vw);max-height:70vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.2);z-index:40;padding:16px}
.aviso{display:block;width:100%;text-align:left;background:#fdeef2;color:var(--text);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14px}
.aviso.leido{background:#f7f7fa}
/* Notificaciones tipo macOS: tarjeta translúcida, icono, resumen, «Ver» y × para eliminar */
.avisos{background:rgba(246,246,248,.96);backdrop-filter:blur(14px)}
.noti{position:relative;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.92);border-radius:18px;padding:12px 14px;margin-top:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.noti.leida{opacity:.7}
.noti .ico{width:40px;height:40px;border-radius:10px;background:#eef0f4;display:inline-flex;align-items:center;justify-content:center;font-size:18px;flex:none;color:#3a3a3c;font-weight:700}
.noti .av{width:40px!important;height:40px!important;font-size:14px}
.noti-t{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.noti-m{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.noti-ver{background:#e9e9ee;color:var(--text);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;flex:none}
.noti-x{position:absolute;top:-7px;left:-7px;width:22px;height:22px;border-radius:50%;padding:0;background:#e5e5ea;color:#3a3a3c;font-size:14px;line-height:22px;box-shadow:0 1px 3px rgba(0,0,0,.2);opacity:0;transition:opacity .15s}
.noti:hover .noti-x,.noti-x:focus-visible{opacity:1}
@media (hover:none){.noti-x{opacity:1}}
/* Exportar en varios formatos */
.exp-p{margin-top:8px;border:1px solid var(--sep);border-radius:12px;padding:10px 12px;background:#fff}
.exp-g{padding:6px 0}.exp-g+.exp-g{border-top:1px solid var(--sep);margin-top:4px;padding-top:10px}
.exp-b{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.exp-b button{font-size:13px;padding:6px 12px}
/* Ediciones de un hallazgo */
.editado{font-size:12px;color:#0a6fd6;background:#e5f1ff;border-radius:8px;padding:4px 8px;margin-top:6px}
.orig{font-size:12px;color:var(--sec);background:#f7f7fa;border:1px dashed var(--sep);border-radius:8px;padding:8px 10px;margin-top:8px}
.enlace{background:none;color:var(--tint);padding:0;font-size:12px;text-decoration:underline}
/* Adjuntos del chat */
.adj-img img{max-width:min(320px,100%);max-height:240px;border-radius:10px;margin-top:6px;display:block;border:1px solid var(--sep)}
button.adj-img{all:unset;cursor:zoom-in;display:block;border-radius:10px}
button.adj-img:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
/* Vista previa de adjuntos dentro de la página */
#prevAdj{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:24px}
.prev-fondo{position:absolute;inset:0;background:rgba(0,0,0,.72)}
.prev-caja{position:relative;display:flex;flex-direction:column;width:min(1100px,100%);max-height:100%;background:#1c1c1e;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.prev-cab{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;background:#2c2c2e;color:#fff}
.prev-cab .adj-n{color:#fff}
.prev-x{width:34px;height:34px;border-radius:50%;padding:0;background:rgba(255,255,255,.16);color:#fff;font-size:22px;line-height:34px;flex:none}
.prev-x:hover{background:rgba(255,255,255,.28)}
.prev-cuerpo{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:12px}
.prev-cuerpo img,.prev-cuerpo video{max-width:100%;max-height:calc(100vh - 140px);object-fit:contain;border-radius:6px}
.prev-cuerpo iframe{width:100%;height:calc(100vh - 140px);border:0;background:#fff;border-radius:6px}
.prev-cuerpo pre{width:100%;max-height:calc(100vh - 140px);margin:0;overflow:auto;background:#fff;color:var(--text);padding:16px;border-radius:6px;white-space:pre-wrap;font-size:13px}
.adj-vid{max-width:min(420px,100%);border-radius:10px;margin-top:6px;display:block}
.adj-aud{margin-top:6px}.adj-aud audio{max-width:100%}
.adj-arch{display:flex;align-items:center;gap:10px;border:1px solid var(--sep);border-radius:12px;padding:8px 12px;margin-top:6px;max-width:420px;background:#fff}
.adj-ico{font-size:24px}.adj-n{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ghostlink{font-size:13px;color:var(--tint);text-decoration:none;padding:4px 8px;border-radius:8px;background:#f0f6ff;white-space:nowrap}
.pend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#f0f0f5;border-radius:999px;padding:4px 6px 4px 10px;font-size:13px}
.chip.err{background:#fdeef0;color:#d70015}
.clip{cursor:pointer;font-size:20px;padding:6px 8px;border-radius:10px;background:#f0f0f5;align-self:flex-end}
.chatbox.soltar{outline:3px dashed var(--tint);outline-offset:-6px}
.msg-ed{opacity:.55;padding:0 6px}.mens:hover .msg-ed,.msg-ed:focus-visible{opacity:1}
/* Lista de @ menciones */
.sugmenc{position:fixed;z-index:70;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);border:1px solid var(--sep);overflow:hidden;max-height:300px;overflow-y:auto}
.sugmenc button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#fff;color:var(--text);border-radius:0;padding:7px 12px;font-size:14px}
.sugmenc button.on,.sugmenc button:hover{background:#e5f1ff}
/* Montón (como macOS): con 2+ notificaciones del mismo chat asoman 1 o 2 tarjetas por debajo */
.noti.pila{margin-bottom:8px}
.noti.pila.p3{margin-bottom:13px}
.noti.pila::after,.noti.pila.p3::before{content:'';position:absolute;z-index:-1;border-radius:0 0 16px 16px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.noti.pila::after{left:9px;right:9px;bottom:-7px;height:14px;background:rgba(255,255,255,.8)}
.noti.pila.p3::before{left:19px;right:19px;bottom:-13px;height:14px;background:rgba(255,255,255,.6)}
.noti-cuerpo{all:unset;display:block;flex:1;min-width:0;cursor:pointer;border-radius:8px}
.noti-cuerpo:focus-visible{outline:2px solid var(--tint);outline-offset:3px}
.noti-cuerpo>span{display:block}
.noti.abierta{flex-wrap:wrap}
.noti-lista{flex-basis:100%;border-top:1px solid var(--sep);margin-top:4px;padding-top:6px;max-height:260px;overflow:auto}
.noti-item{display:flex;gap:8px;padding:6px 2px;font-size:13px}
.noti-item.menc{background:#eaf3ff;border-radius:8px;padding:6px}
.noti-item .av{width:24px!important;height:24px!important;font-size:10px;flex:none}
.noti-menos{background:none;color:var(--tint);font-size:12px;font-weight:600;padding:4px 2px}
/* «Visto» en el chat (solo en tus mensajes): ✓ enviado · ✓✓ azul visto */
.visto{font-size:11px;color:var(--sec);margin-top:2px}
.visto .tk{letter-spacing:-3px;margin-right:5px}
.visto.si .tk{color:var(--tint)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cnt{display:inline-flex;align-items:center;justify-content:center;background:var(--err);color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:18px;height:18px;padding:0 5px;margin-left:6px;vertical-align:middle}
/* Lista propia para «Nuevo privado»: siempre se despliega hacia abajo */
.desplegable{margin-top:6px;border:1px solid var(--sep);border-radius:10px;overflow:hidden;background:#fff}
.desplegable button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#fff;color:var(--text);border-radius:0;padding:8px 12px;font-size:14px;border-bottom:1px solid #f0f0f5}
.desplegable button:last-child{border-bottom:0}
.desplegable button:hover{background:#f0f0f5}
.pres{font-size:12px;color:#c2185b;display:flex;align-items:center;gap:6px;margin:0 0 8px}
.debate{margin-top:10px;border-top:1px solid var(--sep);padding-top:10px}
.com{background:#f7f7fa;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px}
.com .q{color:var(--sec);font-size:12px;margin-bottom:2px}
.mention{color:var(--tint);font-weight:600}
.envivo{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sec)}
.envivo i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.envivo.off i{background:var(--err)}
@media (max-width:700px){.who span:last-child,.envivo span{display:none}}
/* Chat del equipo (estructura del de Marina) */
.chatgrid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.dialog .miembro input[type=checkbox]{width:18px;flex:none}
.dialog .miembro select{flex:none;width:auto;max-width:190px}
.miembro .acc{display:flex;gap:4px;flex:none}
.miembro .acc button{padding:4px 7px;font-size:13px}
.canal{display:block;width:100%;text-align:left;background:none;color:var(--text);padding:9px 12px;border-radius:10px;font-weight:600;margin-bottom:2px}
.canal:hover{background:#f0f0f5}
.canal.on{background:#e5f1ff;color:var(--tint);box-shadow:inset 3px 0 0 #c2185b}
.miembro{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--sep)}
.miembro:last-child{border-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;background:#c7c7cc;flex:none}
.dot.on{background:var(--ok)}
.chatbox{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:440px}
.chatlist{flex:1;overflow:auto;padding:4px 2px}
.mens{display:flex;gap:10px;padding:9px 0}
.ref{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--sep);border-left:4px solid var(--c);border-radius:10px;padding:8px 12px;margin-top:6px;background:#fff;cursor:pointer;max-width:620px}
.ref:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.plegar{display:flex;align-items:center;gap:8px;width:100%;background:none;color:var(--text);padding:4px 2px;font-weight:700;font-size:15px;text-align:left}
.plegar .flecha{display:inline-block;transition:transform .15s;color:var(--sec);font-size:12px}
.plegar[aria-expanded="false"] .flecha{transform:rotate(-90deg)}
.plegar .n{margin-left:auto;font-weight:400;font-size:12px;color:var(--sec)}
.fcanal{display:flex;align-items:center;gap:2px}
.fcanal .canal{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-btn{background:none;color:var(--sec);padding:4px 7px;border-radius:8px;font-size:13px;opacity:.55}
.fcanal:hover .mini-btn,.mini-btn:focus-visible{opacity:1}
.mini-btn:hover{background:#f0f0f5;color:var(--text)}
.rolpill{font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;background:#e5e5ea;color:#3a3a3c;margin-left:4px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c1c1e;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;display:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media (max-width:900px){.chatgrid{grid-template-columns:1fr}.chatbox{height:70vh}}
/* Menú lateral con los colores del de Marina: azul marino, texto blanco y opción activa en blanco */
.drawer{background:#1a4c7c;color:#fff}
.drawer .user{background:rgba(255,255,255,.12)}
.drawer .user b{color:#fff}
.drawer .user span{color:rgba(255,255,255,.72)}
.drawer .nav-item{color:rgba(255,255,255,.92)}
.drawer .nav-item:hover{background:rgba(255,255,255,.12)}
.drawer .nav-item.active{background:#dfe3ea;color:#16324f;font-weight:600}
/* Icono + texto en cada opción del menú */
.nav-item,.nav-salir{display:flex;align-items:center;gap:12px}
.nav-salir{justify-content:center}
.ni{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-item.sub .ni{width:17px;height:17px}
/* Editor de versiones de un PDF (el original no se toca) */
#editor{position:fixed;inset:0;z-index:85;display:flex;align-items:center;justify-content:center;padding:20px}
.ed-caja{position:relative;display:flex;flex-direction:column;width:min(1280px,100%);height:100%;max-height:900px;background:var(--bg);border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.ed-cab{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 18px;background:#16324f;color:#fff}
.ed-cab .small{color:rgba(255,255,255,.75)}
.ed-cuerpo{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:12px}
.ed-pag{overflow:auto;background:#fff;border-radius:10px;border:1px solid var(--sep)}
.ed-pag img{width:100%;display:block}
.ed-texto{display:flex;flex-direction:column;gap:6px;min-height:0}
.ed-texto textarea{flex:1;min-height:200px;resize:none;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:12px;border-radius:10px}
.ed-pie{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:#fff;border-top:1px solid var(--sep)}
@media (max-width:800px){.ed-cuerpo{grid-template-columns:1fr;grid-template-rows:40% 60%}}
/* Sección Versiones */
.ver-fila{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--sep);margin-top:10px}
.ver-fila .ghost{font-size:13px;padding:6px 12px}
.ver-orig{background:#f7fbf8;border-radius:10px;padding:10px;border-top:none}
.ver-cmp{background:#f7f7fa;border-radius:10px;padding:10px;margin-top:6px}
.ver-col2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ver-col2 pre{margin:4px 0 0;max-height:360px;overflow:auto;background:#fff;border:1px solid var(--sep);border-radius:8px;padding:10px;white-space:pre-wrap;font-size:12px}
@media (max-width:700px){.ver-col2{grid-template-columns:1fr}}
/* Pestañas de documentos abiertos (como Safari) */
.tabs{display:flex;gap:4px;overflow-x:auto;margin:-4px 0 12px;padding:4px;background:#e5e5ea;border-radius:12px;scrollbar-width:thin}
.tab{display:flex;align-items:center;flex:0 1 220px;min-width:120px;border-radius:9px;background:transparent}
.tab:hover{background:rgba(255,255,255,.55)}
.tab.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tab-b{all:unset;flex:1;min-width:0;display:flex;align-items:center;gap:4px;padding:7px 4px 7px 12px;font-size:13px;cursor:pointer;border-radius:9px}
.tab.on .tab-b{font-weight:600}
.tab-b:focus-visible,.tab-x:focus-visible{outline:2px solid var(--tint);outline-offset:-2px}
.tab-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab-x{background:none;color:var(--sec);width:24px;height:24px;padding:0;border-radius:6px;font-size:16px;line-height:24px;margin-right:4px;flex:none}
.tab-x:hover{background:#d8d8de;color:var(--text)}
/* Aviso emergente (10 s) con el mismo aspecto que las tarjetas de la campanita */
#banners{position:fixed;top:66px;right:16px;width:min(380px,calc(100vw - 32px));z-index:60;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#banners .banner{pointer-events:auto;margin:0;background:rgba(250,250,252,.97);backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.18);animation:bannerIn .25s ease-out}
@keyframes bannerIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#banners .banner{animation:none}}
/* Filtros de hallazgos en Inicio */
.ffil{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.ffil input[type=search]{background:#f2f2f7;border:none}
.fdec{align-self:flex-start}
.fdec button.on{background:#16324f;color:#fff}
.ln-add{background:#fff1b8;border-radius:3px}
.ln-del{background:#ffd9d6;border-radius:3px;text-decoration:line-through;text-decoration-color:rgba(215,0,21,.45)}
.fsel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fsel select{width:100%}
.fopt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fconf{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sec);margin-right:4px}
.fconf input{width:140px;accent-color:#16324f}
.fconf output{font-variant-numeric:tabular-nums;min-width:32px}
.fchk{display:inline-flex;align-items:center;gap:6px;background:#f2f2f7;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.fchk input{margin:0;accent-color:#16324f}
@media (max-width:700px){.fsel{grid-template-columns:1fr}}
.drawer .nav-item.sub{color:rgba(255,255,255,.72)}
.drawer .nav-item.sub.active{color:#1a4c7c}
.drawer button.ghost{background:rgba(255,255,255,.14);color:#fff}
.drawer button.ghost:hover{background:rgba(255,255,255,.22)}
@media (max-width:900px){.drow{grid-template-columns:1fr;gap:8px}.estado{justify-self:start;text-align:left}.mini{margin-left:0}}
@media (max-width:1200px){.two{grid-template-columns:1fr}.right{position:static;max-height:none}.g2{grid-template-columns:1fr}}
/* Asistente IA: botón flotante y panel lateral derecho; busca en toda la aplicación y propone a dónde ir */
.fab.moviendo{cursor:grabbing;transition:none;transform:scale(1.04);box-shadow:0 16px 34px rgba(26,76,124,.45)}
.fab{touch-action:none;user-select:none;cursor:grab}
.fab{position:fixed;right:22px;bottom:22px;z-index:25;display:inline-flex;align-items:center;gap:8px;padding:12px 18px 12px 14px;border-radius:999px;background:#1a4c7c;color:#fff;font-weight:600;box-shadow:0 8px 24px rgba(26,76,124,.35);transition:transform .15s,box-shadow .15s}
.fab:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(26,76,124,.42)}
.asis{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.15);z-index:30;display:flex;flex-direction:column}
.asis.entra{animation:asis-in .22s ease-out}
@keyframes asis-in{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.asis-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--sep)}
.asis-h .ico{width:34px;height:34px;border-radius:10px;background:#e5f1ff;color:#1a4c7c;display:inline-flex;align-items:center;justify-content:center;flex:none}
.asis .msgs{padding:14px 18px;gap:12px}
.asis .chatin{padding:12px 18px 16px;border-top:1px solid var(--sep)}
.sug{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 10px}
.sug button{background:#f2f2f7;color:var(--text);font-size:13px;padding:6px 10px;border-radius:999px}
.sug button:hover{background:#e5e5ea}
.ctas{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.cta{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:#fff;color:#1a4c7c;border:1px solid #c9dcef;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600}
.cta:hover{background:#e5f1ff}
.cta .fl{font-size:12px;font-weight:400;color:var(--sec);display:block;margin-top:1px}
.chipf{display:inline-flex;align-items:center;gap:8px;background:#e5f1ff;color:#1a4c7c;border-radius:999px;padding:5px 6px 5px 12px;font-size:13px;font-weight:600;margin-bottom:10px}
.chipf button{background:#fff;color:#1a4c7c;padding:2px 8px;border-radius:999px;font-size:12px}
</style>

<body>

<div id="login">
  <form class="login-card" id="loginForm">
    <h1>Revisión de hallazgos</h1>
    <p>Prototipo · Reto Airbus</p>
    <div class="field"><label for="em">Correo corporativo</label><input id="em" value="" placeholder="nombre@airbus.example" autocomplete="username"></div>
    <div class="field"><label for="pw">Contraseña</label><input id="pw" type="password" value="" autocomplete="current-password"></div>
    <button type="submit">Entrar</button>
  </form>
</div>

<div id="app" class="hidden">
  <div class="topbar">
    <button class="burger" data-act="drawer" aria-label="Abrir menú" aria-expanded="false">☰</button>
    <div class="title" id="ttl">Inicio</div>
    <span aria-label="Marca Airbus (texto provisional)" style="font-weight:700;letter-spacing:.12em;font-size:13px;color:var(--sec)">AIRBUS</span>
    <div class="sp"></div>
    <span class="envivo hidden" id="envivo" title="Revisión en equipo"><i></i><span>En equipo</span></span>
    <div class="seg" role="group" aria-label="Idioma"><button data-act="lang" data-v="es" id="lang-es" class="on">ES</button><button data-act="lang" data-v="en" id="lang-en">EN</button></div>
    <button class="bell hidden" id="bell" data-act="avisos" aria-label="Avisos" title="Avisos">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="badge hidden" id="bellN">0</span>
    </button>
    <div class="who"><span class="av" id="uAv"></span><span id="uTop"></span></div>
  </div>

  <aside class="drawer" id="drawer" aria-label="Menú principal">
    <div class="user"><b id="uN"></b><span id="uC"></span></div>
    <!-- Iconos de línea (estilo Feather): heredan el color del texto, así el activo cambia de color solo -->
    <button class="nav-item" data-act="nav" data-v="inicio"><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v11h5v-6h4v6h5V9"/></svg>Inicio</button>
    <button class="nav-item" data-act="nav" data-v="ia"><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="13" width="3.5" height="7" rx="1"/><rect x="10.25" y="8" width="3.5" height="12" rx="1"/><rect x="16.5" y="4" width="3.5" height="16" rx="1"/></svg>Panel de control IA</button>
    <button class="nav-item" data-act="nav" data-v="historico"><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>Histórico</button>
    <button class="nav-item" data-act="nav" data-v="versiones"><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>Versiones</button>
    <button class="nav-item" data-act="nav" data-v="chat"><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Chat</button>
    <button class="nav-item" data-act="nav" data-v="reglas"><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Configuración</button>
    <button class="nav-item sub" data-act="nav" data-v="reglas"><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>Reglas</button>
    <button class="nav-item sub" data-act="nav" data-v="usuarios"><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.5A6.5 6.5 0 0 1 21.5 20"/></svg>Usuarios y roles</button>

  </aside>
  <div class="scrim hidden" id="scrim" data-act="drawer"></div>

  <main id="view"></main>

<script>
// Datos reales: los inserta generar_revision.py (respuestas.csv + traza + corpus). Nada se calcula aquí con IA.
const D=/*__DATOS__*/null;
const RES=D.res, DOCS=D.docs, ETAPAS=D.etapas, MET=D.metricas, LOG=D.log;
const EASA_URL=D.easa;
const COLS=['documento','ubicacion','tipo','clausula','justificacion'];
const TIPOS=['No cumple','Inconsistencia','Cobertura faltante','Trazabilidad incorrecta','No verificable'];
const DECTXT={approved:'Aprobado',rejected:'Rechazado'};
const FUENTES=[
  {r:1,n:'Part-IS de EASA (IS.I.OR.200 a 260)',p:'Obligaciones y plazos legales. Muchos plazos no se repiten en los documentos internos.',url:EASA_URL},
  {r:2,n:'STD-SEC-001 (estándar corporativo, versión vigente)',p:'Valores numéricos de NIMBUS (plazos, longitudes, periodos) y criterios de control operativo.',url:''},
  {r:3,n:'LISTA-DOC (lista maestra)',p:'Documentos y versiones en vigor. Un documento sustituido no es referencia.',url:''},
  {r:4,n:'Políticas, manual, procedimientos, especificaciones (SRS)',p:'Deben respetar lo anterior.',url:''},
  {r:5,n:'Registros, informes, declaraciones, actas',p:'Demuestran si lo anterior se cumple en la práctica.',url:''}
];

const S={
  user:{nombre:'',cargo:'Auditor · Calidad Part-IS'},
  view:'inicio', doc:null, foco:0, pdfPag:1,
  sel:{}, comment:'', q:'', tipo:'', uploads:[],
  criteriosOpen:false, extraOpen:false, extraForm:{ref:'',txt:''},
  iq:'', iest:'', itipo:'', agente:null, umbral:80,
  // Filtros de hallazgos en Inicio: un documento se muestra si tiene algún hallazgo que los cumpla
  hdec:'', htipo:'', hclau:'', hconf:0, hmios:false, hnuevos:false, hcoms:false,
  dec:{}, extra:[], hl:[],
  msgs:[{r:'a',t:'Hola. Busco en toda la aplicación: documentos, hallazgos, decisiones, agentes y métricas, reglas, equipo y chat. Si la respuesta está en una sección, te propongo ir a ella con los filtros puestos. Con la revisión en equipo encendida, además leo los PDF del corpus y te respondo con la IA citando las fuentes.'}],
  asisOpen:false, soloHl:false, hlTxt:''
};
const LS='rv_real_'+D.id;
try{S.dec=JSON.parse(localStorage.getItem(LS+'_dec')||'{}');}catch(e){S.dec={};}
try{S.extra=JSON.parse(localStorage.getItem(LS+'_extra')||'[]');}catch(e){S.extra=[];}
try{S.lang=localStorage.getItem('rv_lang')||'es';}catch(e){S.lang='es';}
try{S.ediciones=JSON.parse(localStorage.getItem(LS+'_edic')||'{}');}catch(e){S.ediciones={};}

// ---------- Revisión en equipo: con servidor.py (http://…) las decisiones, comentarios, menciones y presencia se
// comparten; abierta con doble clic (file://) todo sigue funcionando solo en este navegador.
const SRV=location.protocol.startsWith('http');
Object.assign(S,{coms:[],avisos:[],pres:{},ccom:'',cq:'',avisosOpen:false,online:null,
  mensajes:[],canales:['general'],canal:'general',ctx:'',chatAbajo:true,expAviso:new Set()});
let _firma='';
// Equipo: con servidor llega de colaboracion.json (gestionable en Configuración → Usuarios y roles); sin él, esta lista
const ROLES={Administrador:'Gestiona el equipo y los chats; decide sobre los hallazgos.',
  Aprobador:'Decide y firma las decisiones de los demás.',Revisor:'Aprueba o rechaza hallazgos y comenta.'};
S.equipo=[{n:'Sergio',c:'sergio@airbus.es',rol:'Administrador'},{n:'Marina',c:'marina@airbus.es',rol:'Aprobador'},
  {n:'Nelson',c:'nelson@airbus.es',rol:'Revisor'},{n:'Valentina',c:'valentina@airbus.es',rol:'Revisor'},
  {n:'Daniela',c:'daniela@airbus.es',rol:'Revisor'}];
S.chats=[{id:'general',tipo:'canal',nombre:'general',autor:'',miembros:{}}];
S.abierto={canales:true,grupos:true,privados:true,equipo:true}; S.dlg=null;
function miRol(){const m=S.equipo.find(x=>x.n===S.user.nombre); return m?m.rol:'';}
function esAdmin(){return miRol()==='Administrador';}
function aviso(txt){S.toast=txt; pintarToast(); clearTimeout(S._tt); S._tt=setTimeout(()=>{S.toast=''; pintarToast();},3500);}
function pintarToast(){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div'); t.id='toast'; t.setAttribute('role','status'); document.body.appendChild(t);}
  t.textContent=S.toast||''; t.style.display=S.toast?'block':'none';
}
const COLAV=['#1a4c7c','#c2185b','#248a3d','#a442d6','#c76a00','#0a6fd6'];
const NUM=new Map(RES.map((r,i)=>[r.documento+'|'+r.ubicacion,i+1]));     // #número de cada hallazgo para el chat
function ini(n){return String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');}
function colorDe(n){let h=0; for(const ch of String(n)) h=(h*31+ch.charCodeAt(0))>>>0; return COLAV[h%COLAV.length];}
function av(n,t=32){return `<span class="av" style="width:${t}px;height:${t}px;background:${colorDe(n)}">${esc(ini(n))}</span>`;}
function hace(iso){const m=(Date.now()-new Date(iso))/60000; if(m<1) return 'ahora'; if(m<60) return `hace ${Math.round(m)} min`; if(m<1440) return `hace ${Math.round(m/60)} h`; return fmtFecha(iso);}
function enLinea(n){return n===S.user.nombre||Object.keys(S.pres||{}).some(u=>u.toLowerCase()===n.toLowerCase());}
function menciones(html){return html.replace(/@([\wáéíóúñü.\-]+)/gi,'<span class="mention">@$1</span>');}
async function api(ruta,datos){
  try{
    const r=await fetch(ruta,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...datos,user:S.user.nombre})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok&&j.error) aviso(j.error);
    return {ok:r.ok,...j};
  }catch(e){aviso('Sin conexión con el servidor'); return {ok:false};}
}
function focoKey(){if(S.view!=='revision') return ''; const r=R()[S.foco]; return r?key(r):'';}
async function sondear(){
  if(!SRV||!S.user.nombre) return;
  try{
    const r=await fetch(`/api/estado?user=${encodeURIComponent(S.user.nombre)}&key=${encodeURIComponent(focoKey())}`,{cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    const d=await r.json();
    Object.assign(S,{dec:d.dec,coms:d.comentarios,avisos:d.avisos,pres:d.presencia,
                     mensajes:d.mensajes||[],chats:d.chats||S.chats,ediciones:d.ediciones||{},versiones:d.versiones||{}});
    if(d.equipo&&d.equipo.length) S.equipo=d.equipo;
    detectarNuevos(S.avisos||[]);
    if(!S.chats.some(c=>c.id===S.canal)) S.canal='general';         // el chat abierto se borró o ya no eres miembro
    const kAbierto='chat:'+S.canal;                                   // lo que ya estás viendo no queda como «nuevo»
    if(S.view==='chat'&&S.avisos.some(x=>x.key===kAbierto&&!x.leido)){
      S.avisos.forEach(x=>{if(x.key===kAbierto) x.leido=true;}); api('/api/leido',{key:kAbierto});
    }
    const firma=d.seq+'|'+JSON.stringify(d.presencia);
    const cambio=firma!==_firma||S.online!==true;      // solo se redibuja si hay novedades
    _firma=firma; S.online=true;
    if(cambio) render();
  }catch(e){if(S.online!==false){S.online=false; render();}}
}
async function enviarComentario(){
  const txt=(S.ccom||'').trim(), r=R()[S.foco];
  if(!txt||!r) return;
  S.ccom=''; S.coms.push({key:key(r),user:S.user.nombre,texto:txt,fecha:new Date().toISOString()}); render();
  await api('/api/comentario',{key:key(r),texto:txt}); sondear();
}
// Quién más está mirando este hallazgo y el hilo de comentarios con @menciones.
function vPresencia(r){
  if(!SRV||!r) return '';
  const otros=Object.entries(S.pres||{}).filter(([u,k])=>k===key(r)&&u!==S.user.nombre).map(([u])=>u);
  return otros.length?`<div class="pres"><span class="av" style="width:20px;height:20px;font-size:10px;background:#c2185b">${esc(ini(otros[0]))}</span><span>${esc(otros.join(', '))} también ${otros.length>1?'están':'está'} en este hallazgo</span></div>`:'';
}
function vDebate(r){
  if(!r) return '';
  if(!SRV) return `<p class="note">Para comentar y avisar a compañeros con @nombre, abrid la revisión en equipo: <b>python servidor.py</b>.</p>`;
  const lista=(S.coms||[]).filter(c=>c.key===key(r)).map(c=>`<div class="com"><div class="q"><b>${esc(c.user)}</b> · ${fmtFecha(c.fecha)}</div>${menciones(esc(c.texto))}</div>`).join('');
  const enLinea=Object.keys(S.pres||{}).filter(u=>u!==S.user.nombre);
  return `<div class="debate"><b style="font-size:14px">Debate</b>
    ${lista||'<div class="small" style="margin:6px 0">Sin comentarios todavía.</div>'}
    <form id="comForm" class="chatin" style="margin-top:6px"><input id="ccom" value="${esc(S.ccom)}" placeholder="Comenta; usa @nombre para avisar" autocomplete="off" aria-label="Comentario para el equipo"><button type="submit">Enviar</button></form>
    ${enLinea.length?`<div class="small" style="margin-top:6px">En línea: ${enLinea.map(u=>esc(u)).join(', ')}</div>`:''}</div>`;
}
// ---------- Chat del equipo: canales, @menciones (avisan en la campanita) y #número para enlazar un hallazgo.
function tarjetaRef(n){
  const r=RES[n-1]; if(!r) return '';
  const d=decOf(r), est=d?DECTXT[d.dec]:'Pendiente';
  const c=d?(d.dec==='approved'?ECOL['Completado']:GRIS):ECOL['Pendiente'];
  return `<div class="ref" style="--c:${d?(d.dec==='approved'?'var(--ok)':'var(--sec)'):(r.tipo==='No verificable'?'var(--warn)':'var(--err)')}" data-act="abrirH" data-doc="${esc(r.documento)}" data-u="${esc(r.ubicacion)}" role="button" tabindex="0">
    <div style="min-width:0"><b>${esc(r.documento)}</b> <span class="small">${esc(r.ubicacion)}</span>
    <div class="small">${esc(r.justificacion.slice(0,120))}${r.justificacion.length>120?'…':''}</div></div>${pill('● '+est,c)}</div>`;
}
function textoChat(t){
  const h=menciones(esc(t)).replace(/(^|\s)#(\d{1,4})\b/g,(m,a,n)=>`${a}<a href="#" data-act="abrirNum" data-n="${n}" class="mention">#${n}</a>`);
  const nums=[...new Set([...t.matchAll(/(?:^|\s)#(\d{1,4})\b/g)].map(m=>+m[1]))];
  return h+nums.map(tarjetaRef).join('');
}

// Edición de mensajes: solo durante EDITAR_MIN minutos desde que se envió (el servidor aplica el mismo límite)
const EDITAR_MIN=30;
function minEditables(m){return Math.max(0,Math.ceil(EDITAR_MIN-(Date.now()-new Date(m.fecha))/60000));}
// Cada 30 s: si algún ✎ ha caducado o cambia su «quedan N min», se redibuja el chat (salvo mientras editas)
setInterval(()=>{
  if(S.view!=='chat'||S.editMsg) return;
  const firma=(S.mensajes||[]).filter(m=>m.canal===S.canal&&m.user===S.user.nombre&&m.id).map(minEditables).join(',');
  if(firma!==S._firmaEd){S._firmaEd=firma; render();}
},30000);
// «Visto» de un mensaje tuyo: ✓ nadie lo ha visto · ✓✓ gris lo han visto algunos · ✓✓ azul lo han visto todos.
// El texto con nombres solo va en tu último mensaje del chat (como en las apps de mensajería); en los demás, al pasar el ratón.
function vVisto(m,chat,ultimo){
  if(!m.id) return '<div class="visto"><span class="tk">✓</span>Enviando…</div>';
  const para=chat.tipo==='canal'?S.equipo.map(x=>x.n):Object.keys(chat.miembros||{});
  const otros=para.filter(n=>n!==S.user.nombre), v=Object.keys(m.vistos||{}).filter(n=>n!==S.user.nombre);
  const todos=otros.length>0&&otros.every(n=>v.includes(n));
  let txt;
  if(!v.length) txt='Enviado';
  else if(chat.tipo==='privado') txt=`Visto ${hace(m.vistos[v[0]])}`;
  else if(todos) txt='Visto por todos';
  else txt=`Visto por ${v.length>3?v.slice(0,3).join(', ')+` y ${v.length-3} más`:v.join(', ')}`;
  const titulo=v.length?v.map(n=>`${n} · ${fmtFecha(m.vistos[n])}`).join('\n'):'Todavía no lo ha visto nadie';
  return `<div class="visto ${todos?'si':''}" title="${esc(titulo)}"><span class="tk" aria-hidden="true">${v.length?'✓✓':'✓'}</span>${ultimo?esc(txt):`<span class="sr-only">${esc(txt)}</span>`}</div>`;
}
// Marca como vistos los mensajes de otros del chat abierto, solo si la pestaña está a la vista
function marcarVistos(){
  if(!SRV||!S.user.nombre||S.view!=='chat'||document.visibilityState!=='visible') return;
  const yo=S.user.nombre, canal=S.canal||'general';
  const nuevos=(S.mensajes||[]).filter(m=>m.canal===canal&&m.id&&m.user!==yo&&!(m.vistos||{})[yo]);
  if(!nuevos.length) return;
  const ahora=new Date().toISOString();
  nuevos.forEach(m=>{m.vistos={...(m.vistos||{}),[yo]:ahora};});    // así no se repite la petición en el siguiente sondeo
  api('/api/visto',{chat:canal,ids:nuevos.map(m=>m.id)});
}
document.addEventListener('visibilitychange',marcarVistos);
async function enviarMensaje(){
  const t=(S.ctx||'').trim(), listos=(S.pend||[]).filter(p=>p.id);
  if(!t&&!listos.length) return;
  if((S.pend||[]).some(p=>!p.id&&!p.error)){aviso('Espera a que terminen de subirse los archivos'); return;}
  const canal=S.canal||'general';
  S.ctx=''; S.pend=[]; cerrarSug();
  S.mensajes.push({canal,user:S.user.nombre,texto:t,fecha:new Date().toISOString(),adjuntos:listos}); S.chatAbajo=true; render();
  await api('/api/mensaje',{chat:canal,texto:t,adjuntos:listos.map(p=>p.id)}); sondear();
}
// ---------- Adjuntos del chat: imágenes, vídeos, audios, PDF, Word, Excel… (máx. 25 MB; solo los ve quien está en el chat)
function tam(b){return b<1024?b+' B':b<1048576?(b/1024).toFixed(0)+' KB':(b/1048576).toFixed(1)+' MB';}
function iconoArchivo(n){
  const e=(n.split('.').pop()||'').toLowerCase();
  return {pdf:'📕',doc:'📘',docx:'📘',odt:'📘',xls:'📗',xlsx:'📗',csv:'📗',ods:'📗',ppt:'📙',pptx:'📙',zip:'🗜️',rar:'🗜️','7z':'🗜️',txt:'📄',md:'📄',json:'🧾'}[e]||'📎';
}
function urlAdj(a,descargar){return `/api/adjunto?id=${encodeURIComponent(a.id)}&user=${encodeURIComponent(S.user.nombre)}${descargar?'&descargar=1':''}`;}
function vAdjuntos(as){
  return (as||[]).map(a=>{
    const u=urlAdj(a), t=a.tipo||'';
    if(!a.id) return '';
    // Imágenes, PDF y texto se previsualizan en una ventana dentro de la página (ya no en una pestaña nueva)
    if(t.startsWith('image/')) return `<button class="adj-img" data-act="prevAdj" data-id="${esc(a.id)}" aria-label="Ver ${esc(a.nombre)}" title="Ver"><img src="${u}" alt="${esc(a.nombre)}" loading="lazy"></button>`;
    if(t.startsWith('video/')) return `<video class="adj-vid" controls preload="metadata" src="${u}" aria-label="${esc(a.nombre)}"></video>`;
    if(t.startsWith('audio/')) return `<div class="adj-aud"><audio controls preload="metadata" src="${u}" aria-label="${esc(a.nombre)}"></audio><div class="small">${esc(a.nombre)}</div></div>`;
    return `<div class="adj-arch"><span class="adj-ico">${iconoArchivo(a.nombre)}</span><div style="min-width:0;flex:1"><div class="adj-n">${esc(a.nombre)}</div><div class="small">${tam(a.tam||0)}</div></div>
      ${t==='application/pdf'||t==='text/plain'?`<button class="ghostlink" data-act="prevAdj" data-id="${esc(a.id)}">Abrir</button>`:''}<a class="ghostlink" href="${urlAdj(a,true)}">Descargar</a></div>`;
  }).join('');
}
// Ventana de vista previa de un adjunto: fondo oscuro, × para cerrar (también Esc o clic fuera) y «Descargar»
function buscarAdj(id){for(const m of S.mensajes||[]) for(const a of m.adjuntos||[]) if(a.id===id) return a; return null;}
function abrirPrev(id,origen){S.prev=buscarAdj(id); S._prevOrigen=origen; pintarPrev();}
function cerrarPrev(){S.prev=null; pintarPrev(); if(S._prevOrigen&&document.body.contains(S._prevOrigen)) S._prevOrigen.focus();}
function pintarPrev(){
  let c=document.getElementById('prevAdj');
  if(!S.prev){if(c) c.remove(); document.body.style.overflow=''; return;}
  if(!c){c=document.createElement('div'); c.id='prevAdj'; document.body.appendChild(c);}
  const a=S.prev, u=urlAdj(a), t=a.tipo||'';
  const cuerpo=t.startsWith('image/')?`<img src="${u}" alt="${esc(a.nombre)}">`
    :t==='application/pdf'?`<iframe src="${u}" title="${esc(a.nombre)}"></iframe>`
    :t.startsWith('video/')?`<video src="${u}" controls autoplay></video>`
    :t.startsWith('audio/')?`<audio src="${u}" controls autoplay></audio>`
    :t==='text/plain'?'<pre id="prevTxt">Cargando…</pre>'
    :`<p class="sub" style="color:#fff">Este tipo de archivo no tiene vista previa. Descárgalo para abrirlo.</p>`;
  c.innerHTML=`<div class="prev-fondo" data-act="cerrarPrev"></div>
    <div class="prev-caja" role="dialog" aria-modal="true" aria-label="Vista previa de ${esc(a.nombre)}">
      <div class="prev-cab"><span class="adj-ico">${iconoArchivo(a.nombre)}</span><b class="adj-n" style="flex:1">${esc(a.nombre)}</b>
        <a class="ghostlink" href="${urlAdj(a,true)}">Descargar</a>
        <button class="prev-x" data-act="cerrarPrev" aria-label="Cerrar vista previa" title="Cerrar (Esc)">×</button></div>
      <div class="prev-cuerpo">${cuerpo}</div></div>`;
  document.body.style.overflow='hidden';
  c.querySelector('.prev-x').focus();
  if(t==='text/plain') fetch(u).then(r=>r.text()).then(x=>{const p=document.getElementById('prevTxt'); if(p) p.textContent=x.slice(0,200000);})
    .catch(()=>{const p=document.getElementById('prevTxt'); if(p) p.textContent='No se pudo cargar el archivo.';});
  aplicarIdioma();
}
async function subirArchivos(files){
  const canal=S.canal||'general';
  for(const f of files){
    if(f.size>25*1024*1024){aviso(`«${f.name}» pasa de 25 MB`); continue;}
    const p={nombre:f.name,tipo:f.type||'application/octet-stream',tam:f.size,id:null};
    S.pend=[...(S.pend||[]),p]; render();
    try{
      const r=await fetch('/api/subir',{method:'POST',body:f,headers:{'Content-Type':p.tipo,'X-User':encodeURIComponent(S.user.nombre),
        'X-Chat':encodeURIComponent(canal),'X-Nombre':encodeURIComponent(f.name)}});
      const j=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(j.error||r.status);
      p.id=j.id;
    }catch(e){p.error=true; aviso(`No se pudo subir «${f.name}»: ${e.message}`);}
    render();
  }
}
function vPendientes(){
  return (S.pend||[]).length?`<div class="pend">${S.pend.map((p,i)=>`<span class="chip ${p.error?'err':''}">${iconoArchivo(p.nombre)} ${esc(p.nombre)} <span class="small">${p.error?'error':p.id?tam(p.tam):'subiendo…'}</span>
    <button class="mini-btn" data-act="quitarPend" data-i="${i}" aria-label="Quitar ${esc(p.nombre)}" style="opacity:1;padding:0 4px">×</button></span>`).join('')}</div>`:'';
}
// ---------- @ menciones: al escribir «@» aparece la lista de personas (en grupos y privados, solo las de dentro)
function textoMencion(el){const v=el.value.slice(0,el.selectionStart); const m=v.match(/(^|\s)@([\wáéíóúñü.\-]*)$/i); return m?m[2]:null;}
function sinTildes(t){return String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
function candidatosMencion(q){
  const c=S.view==='chat'?S.chats.find(x=>x.id===S.canal):null;
  const base=c&&c.tipo!=='canal'?S.equipo.filter(m=>m.n in c.miembros):S.equipo;
  return base.filter(m=>m.n!==S.user.nombre&&sinTildes(m.n).startsWith(sinTildes(q||''))).slice(0,8);
}
function pintarSugerencias(el){
  const q=textoMencion(el), c=q===null?[]:candidatosMencion(q);
  let box=document.getElementById('sugMenc');
  if(!c.length){cerrarSug(); return;}
  const i=S.sug&&S.sug.el===el.id?Math.min(S.sug.i,c.length-1):0;
  S.sug={el:el.id,items:c.map(m=>m.n),i};
  if(!box){box=document.createElement('div'); box.id='sugMenc'; box.className='sugmenc'; box.setAttribute('role','listbox'); box.setAttribute('aria-label','Mencionar a'); document.body.appendChild(box);}
  const r=el.getBoundingClientRect();
  box.style.left=r.left+'px'; box.style.width=Math.min(330,r.width)+'px'; box.style.bottom=(window.innerHeight-r.top+6)+'px';
  box.innerHTML='<div class="small" style="padding:6px 12px">Mencionar a…</div>'+c.map((m,j)=>`<button role="option" aria-selected="${j===i}" class="${j===i?'on':''}" data-act="elegirMencion" data-v="${esc(m.n)}">${av(m.n,24)}<span><b>${esc(m.n)}</b> <span class="small">${esc(m.c)}</span></span></button>`).join('');
}
function elegirMencion(n){
  const el=S.sug&&document.getElementById(S.sug.el); if(!el){cerrarSug(); return;}
  const pos=el.selectionStart, antes=el.value.slice(0,pos).replace(/@([\wáéíóúñü.\-]*)$/i,'@'+n+' ');
  el.value=antes+el.value.slice(pos); el.focus(); el.setSelectionRange(antes.length,antes.length);
  if(el.id==='ctx') S.ctx=el.value; else if(el.id==='ccom') S.ccom=el.value;
  cerrarSug();
}
function cerrarSug(){const b=document.getElementById('sugMenc'); if(b) b.remove(); S.sug=null;}

  if(c) Object.assign(m,c.miembros); else m[S.user.nombre]='admin';
  S.dlg={id:c?c.id:null,nombre:c?c.nombre:'',miembros:m};
  render();
  setTimeout(()=>{const i=document.getElementById('gN'); if(i) i.focus();},30);
}

function nombreChat(c){
  if(!c) return '';
  if(c.tipo==='privado') return Object.keys(c.miembros).find(n=>n!==S.user.nombre)||'Privado';
  return c.tipo==='canal'?'#'+c.nombre:c.nombre;
}
function noLeidos(id){return (S.avisos||[]).filter(a=>!a.leido&&a.key==='chat:'+id).length;}
function pintarBarra(){

// Título e icono de un grupo de notificaciones (chat o hallazgo): lo usan la campanita y el aviso emergente
function infoAviso(k){
  if(k.startsWith('chat:')){
    const ch=S.chats.find(c=>c.id===k.slice(5)), titulo=ch?nombreChat(ch):k.slice(5);
    return {titulo,icono:!ch?'<span class="ico">💬</span>':ch.tipo==='privado'?av(titulo,40):`<span class="ico">${ch.tipo==='grupo'?'👥':'#'}</span>`};
  }
  const [doc,u]=k.split('|'); return {titulo:`${doc} · ${u}`,icono:'<span class="ico">📄</span>'};
}
// Aviso emergente: cuando llega una notificación nueva sale arriba a la derecha y se oculta sola a los 10 s
// (el ratón encima lo pausa). La notificación sigue en la campanita. Uno por chat; como mucho 3 a la vez.
const BANNER_S=10;
let _avisosVistos=null;                       // firmas de las notificaciones ya conocidas (null = primera carga)
const firmaAviso=a=>[a.key,a.de,a.fecha,a.texto].join('|');
function detectarNuevos(avisos){
  const firmas=new Set(avisos.map(firmaAviso));
  if(_avisosVistos===null){_avisosVistos=firmas; return;}           // al entrar no salta lo que ya había
  const nuevos=avisos.filter(a=>!_avisosVistos.has(firmaAviso(a))&&!a.leido);
  _avisosVistos=firmas;
  nuevos.forEach(a=>{
    if(S.view==='chat'&&a.key==='chat:'+S.canal) return;            // ya lo estás viendo
    S.banners=(S.banners||[]).filter(b=>b.k!==a.key);                // el más reciente sustituye al anterior del mismo chat
    S.banners.unshift({id:Math.random().toString(36).slice(2),k:a.key,a}); S.banners=S.banners.slice(0,3);
  });
  if(nuevos.length) pintarBanners();
}
function quitarBanner(id){S.banners=(S.banners||[]).filter(b=>b.id!==id); clearTimeout((_tBanner[id]||{}).t); delete _tBanner[id]; pintarBanners();}
const _tBanner={};
function programarBanner(id,ms){clearTimeout((_tBanner[id]||{}).t); _tBanner[id]={t:setTimeout(()=>quitarBanner(id),ms),fin:Date.now()+ms};}
function pintarBanners(){
  let c=document.getElementById('banners');
  if(!c){c=document.createElement('div'); c.id='banners'; c.setAttribute('aria-live','polite'); document.body.appendChild(c);}
  c.innerHTML=(S.banners||[]).map(b=>{
    const {icono,titulo}=infoAviso(b.k), n=(S.avisos||[]).filter(x=>x.key===b.k&&!x.leido).length;
    return `<div class="noti banner" data-bid="${b.id}" role="status">
      <button class="noti-x" data-act="cerrarBanner" data-bid="${b.id}" aria-label="Cerrar aviso" title="Cerrar">×</button>
      ${icono}<div style="flex:1;min-width:0">
        <div style="display:flex;gap:8px;align-items:baseline"><b class="noti-t">${esc(titulo)}</b><span class="small" style="margin-left:auto;white-space:nowrap">ahora</span></div>
        <div class="small" style="color:var(--text)">${n>1?`${n} nuevos`:b.a.mencion?'te ha mencionado':'mensaje nuevo'}</div>
        <div class="small noti-m"><b>${esc(b.a.de)}:</b> ${menciones(esc(b.a.texto))}</div></div>
      <button class="noti-ver" data-act="irAviso" data-k="${esc(b.k)}" data-bid="${b.id}">Ver</button></div>`;
  }).join('');
  (S.banners||[]).forEach(b=>{if(!_tBanner[b.id]) programarBanner(b.id,BANNER_S*1000);});
  c.querySelectorAll('.banner').forEach(el=>{
    const id=el.dataset.bid;
    el.onmouseenter=()=>{const t=_tBanner[id]; if(t){clearTimeout(t.t); t.resto=Math.max(1500,t.fin-Date.now());}};
    el.onmouseleave=()=>{const t=_tBanner[id]; if(t) programarBanner(id,t.resto||BANNER_S*1000);};
  });
  aplicarIdioma();
}
// Notificaciones agrupadas por chat (o por hallazgo): una tarjeta con icono, resumen y último mensaje; «Ver» y «×»
function vAvisos(){
  const grupos={};
  (S.avisos||[]).forEach(a=>{(grupos[a.key]=grupos[a.key]||[]).push(a);});
  const tarjetas=Object.entries(grupos).map(([k,as])=>{
    as.sort((x,y)=>x.fecha<y.fecha?-1:1);
    const ult=as[as.length-1], nuevos=as.filter(a=>!a.leido).length, menc=as.filter(a=>a.mencion||!k.startsWith('chat:')).length;
    const {icono,titulo}=infoAviso(k);
    const partes=[nuevos?`${nuevos} ${nuevos===1?'nuevo':'nuevos'}`:'leídos', menc&&k.startsWith('chat:')?`${menc} ${menc===1?'mención':'menciones'}`:''].filter(Boolean);
    // Cerrada: montón con el último mensaje. Abierta: todos los mensajes del grupo (desplegar NO los marca como leídos)
    const abierta=S.expAviso.has(k), n=as.length;
    const pila=!abierta&&n>1?`pila${n>2?' p3':''}`:'';
    const lista=abierta?`<div class="noti-lista">${as.slice().reverse().map(a=>`<div class="noti-item ${a.mencion?'menc':''}">${av(a.de,24)}
        <div style="min-width:0;flex:1"><div><b>${esc(a.de)}</b> <span class="small">${hace(a.fecha)}</span>${a.leido?'':' <span class="cnt" style="height:8px;min-width:8px;padding:0" aria-label="sin leer"></span>'}</div>
        <div style="white-space:pre-wrap;overflow-wrap:anywhere">${menciones(esc(a.texto))}</div></div></div>`).join('')}
        <button class="noti-menos" data-act="expAviso" data-k="${esc(k)}">Mostrar menos</button></div>`:'';
    return {fecha:ult.fecha,nuevos,html:`<div class="noti ${nuevos?'':'leida'} ${pila} ${abierta?'abierta':''}">
      <button class="noti-x" data-act="borrarAviso" data-k="${esc(k)}" aria-label="Eliminar las notificaciones de ${esc(titulo)}" title="Eliminar">×</button>
      ${icono}
      <button class="noti-cuerpo" data-act="expAviso" data-k="${esc(k)}" aria-expanded="${abierta}" title="${abierta?'Mostrar menos':'Ver los mensajes aquí'}">
        <span style="display:flex;gap:8px;align-items:baseline"><b class="noti-t">${esc(titulo)}</b><span class="small" style="margin-left:auto;white-space:nowrap">${hace(ult.fecha)}</span></span>
        <span class="small" style="color:var(--text)">${partes.join(' · ')}</span>
        ${abierta?'':`<span class="small noti-m"><b>${esc(ult.de)}:</b> ${menciones(esc(ult.texto))}</span>`}
      </button>
      <button class="noti-ver" data-act="irAviso" data-k="${esc(k)}">Ver</button>${lista}</div>`};
  }).sort((a,b)=>(b.nuevos>0)-(a.nuevos>0)||(a.fecha<b.fecha?1:-1));
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><h3 style="margin:0">Notificaciones</h3>
      <div style="display:flex;gap:6px">${tarjetas.length?'<button class="ghost" data-act="borrarAviso" data-k="" style="font-size:12px;padding:5px 10px">Borrar todas</button>':''}
      <button class="ghost" data-act="avisos" aria-label="Cerrar" style="padding:5px 10px">×</button></div></div>`
    +(tarjetas.map(t=>t.html).join('')||'<p class="small">No tienes notificaciones.</p>');
}

function tr(s){
  const t=s.trim(); if(!t) return null;
  if(EN[t]) return s.replace(t,EN[t]);
  for(const [re,r] of EN_RE) if(re.test(t)) return s.replace(t,t.replace(re,r));

}
function aplicarIdioma(){
  document.documentElement.lang=S.lang;
  document.getElementById('lang-es').classList.toggle('on',S.lang==='es');
  document.getElementById('lang-en').classList.toggle('on',S.lang==='en');
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT); let n;
  while((n=w.nextNode())){
    if(n.parentElement&&n.parentElement.closest('script,style,textarea,pre')) continue;   // texto de documentos: no se traduce
    if(n._es===undefined) n._es=n.nodeValue;
    const v=S.lang==='en'?(tr(n._es)??n._es):n._es;
    if(n.nodeValue!==v) n.nodeValue=v;
  }
  document.querySelectorAll('[placeholder]').forEach(el=>{
    if(el._ph===undefined) el._ph=el.placeholder;
    el.placeholder=S.lang==='en'?(tr(el._ph)??el._ph):el._ph;
  });
}

function pasaFiltroH(r){
  const d=decOf(r);
  if(S.hdec==='pend'&&d) return false;
  if((S.hdec==='approved'||S.hdec==='rejected')&&(!d||d.dec!==S.hdec)) return false;
  if(S.htipo&&r.tipo!==S.htipo) return false;
  if(S.hclau&&r.clausula!==S.hclau) return false;
  if(S.hconf>0&&(r.conf||0)<S.hconf) return false;
  if(S.hmios&&(!d||d.user!==S.user.nombre)) return false;
  if(S.hnuevos&&ABIERTOS.has(key(r))) return false;
  if(S.hcoms&&!(S.coms||[]).some(c=>c.key===key(r))) return false;
  return true;
}

const _orig={}, _vers={};
async function textoOriginal(doc,n){
  const k=doc+'|'+n; if(k in _orig) return _orig[k];
  try{const r=await fetch(`${D.carpeta}/${DOCS[doc].slug}_${n}.txt`,{cache:'no-store'}); _orig[k]=r.ok?await r.text():'';}catch(e){_orig[k]='';}
  return _orig[k];

async function textoVersion(doc,n){
  const k=doc+'|'+n; if(_vers[k]) return _vers[k];
  const r=await fetch(`/api/version?doc=${encodeURIComponent(doc)}&n=${n}`,{cache:'no-store'});
  if(!r.ok) throw new Error('versión no encontrada');
  return (_vers[k]=(await r.json()).paginas||{});
}
function versionesDe(doc){return ((S.versiones||{})[doc]||[]).slice().sort((a,b)=>a.n-b.n);}
async function abrirEditor(doc,base){

  S.ed={doc,base,pag:Math.min(S.doc===doc?S.pdfPag||1:1,DOCS[doc].paginas),textos:{},orig:{},basePags:{},nota:'',cargando:true};
  pintarEditor();

function cambiosEditor(){

async function descargarVersion(doc,n){

// Comparación sencilla por líneas: se marca cada línea que no aparece (tal cual) en el otro texto
function lineasMarcadas(texto,otro,clase){
  const hay=new Set(otro.split('\n'));
  return texto.split('\n').map(l=>hay.has(l)?esc(l):`<span class="${clase}">${esc(l)||' '}</span>`).join('\n');
}
function vPestanas(){
  return `<div class="tabs" role="tablist" aria-label="Documentos abiertos">${S.tabs.map(d=>{

// Sobre qué se aplica la decisión: los seleccionados pendientes; si no hay ninguno, el hallazgo activo.
function objetivosActuales(){
  const rs=R();
  const sel=rs.filter(r=>S.sel[key(r)]&&!decOf(r));
  if(sel.length) return sel;
  const f=rs[S.foco];
  return !f||decOf(f)?[]:[f];
}

function aplicar(dec){
  const comentario=(S.comment||'').trim();
  const fecha=new Date().toISOString();
  const objs=objetivosActuales();
  objs.forEach(r=>{S.dec[key(r)]={dec,note:comentario,fecha,user:S.user.nombre};});
  if(SRV) api('/api/decision',{keys:objs.map(key),dec,note:comentario}).then(sondear);   // compartida con el equipo
  else persist();
  S.sel={}; S.comment='';
  const n=nextPending(S.foco);
  if(n>=0) irA(n);
  render();
}

// Comentario sin hallazgo de la IA: lo que la IA no señaló. Va a feedback.csv para mejorar el auditor.
function guardarExtra(){
  const txt=(S.extraForm.txt||'').trim();
  if(!txt) return;
  S.extra.push({documento:S.doc,referencia:(S.extraForm.ref||'').trim(),comentario:txt,fecha:new Date().toISOString()});
  persist();
  S.extraForm={ref:'',txt:''}; S.extraOpen=false;
  render();
}

function csvEsc(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function toCSV(rows,cols){return cols.join(',')+'\n'+rows.map(r=>cols.map(c=>csvEsc(r[c])).join(',')).join('\n')+'\n';}
function baja(nombre,texto){
  const blob=new Blob([texto],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
// respuestas.csv: solo los hallazgos de la solución, nunca las decisiones del revisor.
function exportRespuestas(){baja('respuestas.csv',toCSV(RES.map(r=>({documento:r.documento,ubicacion:r.ubicacion,tipo:r.tipo,clausula:r.clausula,justificacion:r.justificacion})),COLS));}
// feedback.csv: decisiones del revisor y comentarios sin hallazgo, separados del CSV oficial.
function feedbackRows(){
  const dec=RES.filter(r=>decOf(r)).map(r=>{const d=decOf(r);return {
    documento:r.documento,ubicacion:r.ubicacion,ia_tipo:r.tipo,ia_clausula:r.clausula,
    decision:DECTXT[d.dec],nota:d.note,usuario:d.user||'',fecha:d.fecha};});
  const sinHallazgo=S.extra.map(x=>({
    documento:x.documento,ubicacion:x.referencia,ia_tipo:'(sin hallazgo de la IA)',ia_clausula:'',
    decision:'Omitido por la IA',nota:x.comentario,usuario:S.user.nombre,fecha:x.fecha}));
  return dec.concat(sinHallazgo);
}
function exportFeedback(){
  baja('feedback.csv',toCSV(feedbackRows(),['documento','ubicacion','ia_tipo','ia_clausula','decision','nota','usuario','fecha']));
}

// ---------- Exportar en varios formatos. «Respuestas del auditor» = la salida oficial, sin tocar (guía §6.2: el CSV
// que se entrega sale de la solución, sin retoques a mano). «Revisión del equipo» = con decisiones y ediciones.
function edicionDe(r){const e=(S.ediciones||{})[key(r)]; return e&&e.length?e[e.length-1]:null;}
function datosExport(cual){
  if(cual==='res') return {nombre:'respuestas',titulo:'Respuestas del auditor (salida oficial, sin retoques)',cols:COLS,
    rows:RES.map(r=>({documento:r.documento,ubicacion:r.ubicacion,tipo:r.tipo,clausula:r.clausula,justificacion:r.justificacion}))};
  const cols=['documento','ubicacion','tipo','clausula','justificacion','decision','revisor','comentario','editado_por','tipo_original','clausula_original','justificacion_original'];
  const rows=RES.map(r=>{const d=decOf(r), e=edicionDe(r); return {documento:r.documento,ubicacion:r.ubicacion,
    tipo:e?e.tipo:r.tipo,clausula:e?e.clausula:r.clausula,justificacion:e?e.justificacion:r.justificacion,
    decision:d?DECTXT[d.dec]:'Pendiente',revisor:d?(d.user||''):'',comentario:d?(d.note||''):'',editado_por:e?e.user:'',
    tipo_original:e?r.tipo:'',clausula_original:e?r.clausula:'',justificacion_original:e?r.justificacion:''};})
    .concat(S.extra.map(x=>({documento:x.documento,ubicacion:x.referencia,tipo:'(sin hallazgo de la IA)',clausula:'',
      justificacion:x.comentario,decision:'Omitido por la IA',revisor:S.user.nombre,comentario:'',editado_por:'',tipo_original:'',clausula_original:'',justificacion_original:''})));
  return {nombre:'revision_equipo',titulo:'Revisión del equipo (decisiones, comentarios y ediciones)',cols,rows};
}
function bajaBlob(nombre,blob){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nombre;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function tablaHTML(f){
  return `<h1>${esc(f.titulo)}</h1><p>Auditoría Part-IS · NIMBUS Aerospace · ${esc(new Date().toLocaleString('es-ES'))} · ${f.rows.length} filas</p>
    <table><thead><tr>${f.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${f.rows.map(r=>'<tr>'+f.cols.map(c=>`<td>${esc(r[c])}</td>`).join('')+'</tr>').join('')}</tbody></table>`;
}
function cargarXLSX(){
  return new Promise((ok,ko)=>{
    if(window.XLSX) return ok(window.XLSX);
    const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=()=>ok(window.XLSX); s.onerror=ko; document.head.appendChild(s);
  });
}
async function exportar(cual,fmt){
  const f=datosExport(cual);
  if(fmt==='csv') return bajaBlob(f.nombre+'.csv',new Blob([(cual==='res'?'':'﻿')+toCSV(f.rows,f.cols)],{type:'text/csv;charset=utf-8'}));
  if(fmt==='json') return bajaBlob(f.nombre+'.json',new Blob([JSON.stringify(f.rows,null,2)],{type:'application/json'}));
  if(fmt==='xlsx'){
    try{
      const X=await cargarXLSX(), ws=X.utils.json_to_sheet(f.rows,{header:f.cols}), wb=X.utils.book_new();
      X.utils.book_append_sheet(wb,ws,'Hallazgos'); X.writeFile(wb,f.nombre+'.xlsx');
    }catch(e){                                          // sin internet: hoja de Excel clásica (.xls), sin librerías
      const filas=[f.cols].concat(f.rows.map(r=>f.cols.map(c=>r[c])));
      const x=`<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="Hallazgos"><Table>${filas.map(fi=>'<Row>'+fi.map(v=>`<Cell><Data ss:Type="String">${esc(v)}</Data></Cell>`).join('')+'</Row>').join('')}</Table></Worksheet></Workbook>`;
      bajaBlob(f.nombre+'.xls',new Blob([x],{type:'application/vnd.ms-excel'}));
      aviso('Sin internet: se ha exportado como Excel clásico (.xls)');
    }
    return;
  }
  if(fmt==='doc'){
    const h=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${esc(f.titulo)}</title>
      <style>@page{size:29.7cm 21cm;mso-page-orientation:landscape;margin:1.5cm}body{font-family:Calibri,Arial;font-size:9pt}h1{font-size:15pt;color:#1a4c7c}table{border-collapse:collapse}td,th{border:1px solid #999;padding:3px 5px;vertical-align:top}th{background:#1a4c7c;color:#fff}</style></head><body>${tablaHTML(f)}</body></html>`;
    return bajaBlob(f.nombre+'.doc',new Blob(['﻿'+h],{type:'application/msword'}));
  }
  if(fmt==='pdf'){                                     // informe imprimible: en la ventana de imprimir, «Guardar como PDF»
    const w=window.open('','_blank');
    if(!w){aviso('El navegador ha bloqueado la ventana: permite las ventanas emergentes'); return;}
    w.document.write(`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>${esc(f.nombre)}</title>
      <style>@page{size:A4 landscape;margin:12mm}body{font-family:-apple-system,"Segoe UI",Arial,sans-serif;font-size:9pt;color:#1c1c1e}h1{font-size:15pt;color:#1a4c7c;margin:0 0 4px}p{color:#6e6e73;margin:0 0 10px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #d1d1d6;padding:3px 5px;vertical-align:top;text-align:left}th{background:#1a4c7c;color:#fff}tr{page-break-inside:avoid}</style></head>
      <body>${tablaHTML(f)}<script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`);
    w.document.close();
  }
}

function contrastado(r){

}
function leido(r){return r.leido?`<div class="cita">«${esc(r.leido)}»</div>`:'<span>Sin cita literal (defecto por ausencia).</span>';}

// Motivo de un hallazgo: estado, cláusula, justificación de la IA y, si ya decidiste, tu decisión y comentario.
function vMotivo(r){
  if(!r) return '';
  const d=decOf(r), k=key(r), e=edicionDe(r), hist=(S.ediciones||{})[k]||[];
  const dec=d?`<div class="small" style="margin-top:8px">Tu decisión: <b style="color:var(--text)">${DECTXT[d.dec]}</b>${d.note?` · Comentario: ${esc(d.note)}`:''}</div>`:'';
  // Modo edición: tipo, cláusula y justificación. El original del auditor se conserva siempre.
  if(S.editH===k){
    const v=S.editVals||{};
    return `<div class="card" style="padding:14px 16px;background:#fff;box-shadow:none;border:2px solid var(--tint)">
      <div class="small"><b>#${NUM.get(k)}</b> · ${esc(r.ubicacion)} · <b>Editar hallazgo</b></div>

      <select id="eT" style="width:100%">${TIPOS.map(t=>`<option ${t===(v.tipo??(e?e.tipo:r.tipo))?'selected':''}>${t}</option>`).join('')}</select>
      <label class="small" for="eC" style="display:block;margin-top:8px">Cláusula</label>
      <input id="eC" value="${esc(v.clausula??(e?e.clausula:r.clausula))}" style="width:100%" placeholder="IS.I.OR.2xx">
      <label class="small" for="eJ" style="display:block;margin-top:8px">Justificación</label>
      <textarea id="eJ" rows="4" style="width:100%">${esc(v.justificacion??(e?e.justificacion:r.justificacion))}</textarea>
      <div class="fbtns"><button class="ghost" data-act="cancelarEdicion">Cancelar</button><button class="ok" data-act="guardarEdicion" data-k="${esc(k)}">Guardar edición</button></div>
      <p class="note">Se guarda como una versión nueva: el original del auditor no se pierde y el CSV oficial no cambia.</p></div>`;
  }
  const tipo=e?e.tipo:r.tipo, clausula=e?e.clausula:r.clausula, just=e?e.justificacion:r.justificacion;
  const marca=e?`<div class="editado">✎ Editado por <b>${esc(e.user)}</b> · ${hace(e.fecha)}${hist.length>1?` · ${hist.length} ediciones`:''}

  const original=e&&S.verOrig===k?`<div class="orig"><b>Original del auditor</b>

      ${hist.length>1?`<div style="margin-top:6px"><b>Historial</b>${hist.map(h=>`<div>· ${esc(h.user)} (${hace(h.fecha)}): ${esc(h.tipo)} · ${esc(h.clausula)}</div>`).join('')}</div>`:''}
      <button class="enlace" data-act="deshacerEdicion" data-k="${esc(k)}">Volver al original</button></div>`:'';
  return `<div class="card" style="padding:14px 16px;background:#fafafc;box-shadow:none;border:1px solid var(--sep)">
    <div style="display:flex;gap:8px;align-items:flex-start"><div class="small" style="flex:1"><b title="Número para enlazarlo en el chat">#${NUM.get(k)}</b> · ${esc(r.ubicacion)} · página ${r.pagina} · ${esc(r.origen)} · confianza ${Math.round(r.conf*100)}%</div>

function estadoDoc(rs){
  const pend=rs.filter(r=>!decOf(r)).length;
  return !rs.length?'Sin hallazgos':pend===0?'Completado':pend===rs.length?'Pendiente':'En revisión';
}

// Colores de las etiquetas (paleta de Apple): [texto, fondo, barra]
const GRIS=['#6e6e73','rgba(142,142,147,.16)','var(--sep)'];
const TCOL={'No cumple':['#d70015','rgba(255,59,48,.12)'],'Inconsistencia':['#c76a00','rgba(255,159,10,.16)'],
  'Cobertura faltante':['#a442d6','rgba(175,82,222,.13)'],'Trazabilidad incorrecta':['#0a6fd6','rgba(10,132,255,.12)'],'No verificable':GRIS};
const ECOL={'Pendiente':['#0a6fd6','rgba(10,132,255,.12)','var(--tint)'],'En revisión':['#c76a00','rgba(255,159,10,.16)','var(--warn)'],
  'Completado':['#248a3d','rgba(52,199,89,.15)','var(--ok)'],'Sin hallazgos':GRIS,'Cargado · sin procesar':GRIS};
function pill(txt,c){return `<span class="pill" style="--pc:${c[0]};--pb:${c[1]}">${txt}</span>`;}

    return {nombre:c,titulo:info.titulo,version:info.version,tipo:info.familia,hall:rs.length,pend:rs.length-hechos.length,
            hechos:hechos.length,tipos,quien,est:estadoDoc(rs),abrir:rs.length>0};
  }).sort((a,b)=>(b.pend-a.pend)||(b.hall-a.hall)||a.nombre.localeCompare(b.nombre));
  S.uploads.forEach(u=>docs.push({nombre:u.nombre,titulo:'Cargado el '+fmtFecha(u.fecha),version:'',tipo:'Archivo manual',hall:0,pend:0,hechos:0,tipos:{},quien:[],est:'Cargado · sin procesar',abrir:false}));

        <select id="itipo" aria-label="Familia del documento"><option value="">Cualquier familia</option>${familias.map(t=>`<option ${S.itipo===t?'selected':''}>${esc(t)}</option>`).join('')}</select>

        <label class="fconf">Confianza ≥ <input id="hconf" type="range" min="0" max="1" step="0.05" value="${S.hconf}" aria-label="Confianza mínima"><output id="hconfV">${S.hconf.toFixed(2)}</output></label>
        ${casilla('hmios','Míos')}${casilla('hnuevos','Nuevos')}${casilla('hcoms','Con comentarios')}
        ${fh||S.itipo||S.iq?'<button class="enlace" data-act="limpiarFiltros" style="margin-left:auto">Limpiar filtros</button>':''}
      </div>
    </div>`;
  return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:4px"><h2 style="margin:0">Inicio</h2>${pill(`${docs.length} documentos · ${RES.length} hallazgos`,GRIS)}</div>
    <p class="sub">Documentos auditados. Pulsa uno para revisar sus hallazgos junto al PDF.</p>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px"><div class="seg" role="tablist" aria-label="Estado del documento">${pestanas}</div>

      <label style="cursor:pointer;padding:9px 16px;border-radius:10px;background:#e5e5ea;font-size:14px;margin-left:auto">Cargar archivo<input id="archivo" type="file" accept=".pdf,.docx,.csv,.xlsx" style="display:none"></label></div>
    ${filtrosH}

    <p class="note">Al cargar un archivo, esta pantalla solo lo registra. La auditoría la hace la solución: <b>python auditar.py</b> genera respuestas.csv sin intervención manual.</p>`;
}
