// ---------- Asistente IA: busca en TODA la aplicación (datos ya calculados, sin llamadas a IA) y, si la respuesta
// está en una sección, propone un botón para ir a ella con los filtros puestos.
function norm(s){return String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
const VACIAS=new Set('que cual cuales como donde cuando cuanto cuantos cuantas los las del con por para una uno unos unas sobre hay tiene tienen esta estan este esto son ver dame muestrame ensename busca buscar quiero necesito lista listado the and with for show find what which how many are of in on to me all todos todas'.split(' '));
function palabras(s){return norm(s).split(/[^a-z0-9.\-]+/).filter(w=>w.length>2&&!VACIAS.has(w));}
function listaH(hits){return hits.slice(0,6).map(h=>`<mark>${esc(h.documento)} · ${esc(h.ubicacion)}</mark>`).join(', ')+(hits.length>6?'…':'');}
function plural(n,uno,varios){return `${n} ${n===1?uno:varios}`;}

function answer(q){
  const s=norm(q).trim(), ws=palabras(q);
  const partes=[], ctas=[], vistos=new Set();
  const add=(label,detalle,dest)=>{const k=JSON.stringify(dest); if(vistos.has(k)) return; vistos.add(k); ctas.push({label,detalle,dest});};
  const verH=(hits,txt,extra={})=>add(`Ver ${plural(hits.length,'hallazgo','hallazgos')} en Histórico`,`Histórico · ${txt}`,
    {view:'historico',hl:hits.map(key),hlTxt:txt,...extra});
  const hablaDocs=/document|expedient|archivo/.test(s), hablaHall=/hallazg|defect|finding/.test(s);

  // 1. Hallazgos: tipo, cláusula, documento concreto, decisiones
  const TIPOS_N=[['no verificable','No verificable'],['inconsist','Inconsistencia'],['no cumple','No cumple'],['incumpl','No cumple'],
                 ['cobertura','Cobertura faltante'],['trazab','Trazabilidad incorrecta']];
  const tipo=(TIPOS_N.find(([k])=>s.includes(k))||[])[1];
  const cl=s.match(/(?:is\.?i\.?or\.?\s*)?\b(2[0-6]\d)\b/);
  const doc=Object.keys(DOCS).find(c=>s.includes(norm(c)));
  let base=doc?RES.filter(r=>r.documento===doc):RES;
  if(tipo){
    const hits=base.filter(r=>r.tipo===tipo);
    partes.push(hits.length?`Hay ${plural(hits.length,'hallazgo','hallazgos')} de tipo <b>${esc(tipo)}</b>${doc?' en '+esc(doc):''}: ${listaH(hits)}.`:`No hay hallazgos de tipo <b>${esc(tipo)}</b>${doc?' en '+esc(doc):''}.`);
    if(hits.length) add(`Ver «${tipo}» en Histórico`,`Histórico · Tipo: ${tipo}${doc?' · '+doc:''}`,{view:'historico',tipo,q:doc||''});
  }
  if(cl){
    const c='IS.I.OR.'+cl[1], hits=base.filter(r=>r.clausula===c);
    partes.push(hits.length?`La cláusula <b>${c}</b> aparece en ${plural(hits.length,'hallazgo','hallazgos')}: ${listaH(hits)}.`:`Ningún hallazgo cita la cláusula <b>${c}</b>.`);
    if(hits.length) verH(hits,'Cláusula '+c);
  }
  const dec=/aprobad|approved/.test(s)?'approved':/rechazad|rejected/.test(s)?'rejected':null;
  if(dec){
    const hits=base.filter(r=>decOf(r)&&decOf(r).dec===dec), txt=DECTXT[dec];
    partes.push(hits.length?`Has marcado como <b>${txt.toLowerCase()}</b> ${plural(hits.length,'hallazgo','hallazgos')}: ${listaH(hits)}.`:`Todavía no hay hallazgos ${txt.toLowerCase()}s.`);
    if(hits.length) verH(hits,'Decisión: '+txt);
  }
  if(/pendient|sin decid|sin revis|por revis/.test(s)&&(hablaHall||doc)&&!hablaDocs){
    const hits=base.filter(r=>!decOf(r));
    partes.push(`Quedan ${plural(hits.length,'hallazgo','hallazgos')} sin decisión${doc?' en '+esc(doc):''}.`);
    if(hits.length) verH(hits,'Sin decisión'+(doc?' · '+doc:''));
  }
  if(doc){
    const info=DOCS[doc], rs=RES.filter(r=>r.documento===doc);
    partes.push(`<b>${esc(doc)}</b> · ${esc(info.titulo)} (v${esc(info.version)}, ${esc(info.familia)}): ${plural(rs.length,'hallazgo','hallazgos')}, estado <b>${esc(estadoDoc(rs))}</b>.`);
    if(rs.length) add(`Revisar ${doc} junto al PDF`,'Revisión · '+plural(rs.length,'hallazgo','hallazgos'),{view:'revision',doc});
  }

  // 2. Documentos (Inicio): estado y familia
  const EST_N=[['sin hallazgo','Sin hallazgos'],['en revision','En revisión'],['complet','Completado'],['terminad','Completado'],['pendient','Pendiente']];
  const iest=(EST_N.find(([k])=>s.includes(k))||[])[1];
  const familias=[...new Set(Object.values(DOCS).map(d=>d.familia))];
  const fam=familias.find(f=>s.includes(norm(f)))||familias.find(f=>palabras(f).some(w=>w.length>5&&ws.includes(w)));
  if((hablaDocs||fam||(iest&&!hablaHall&&!doc))&&(iest||fam)){
    const docsF=Object.keys(DOCS).filter(c=>{const rs=RES.filter(r=>r.documento===c);return (!iest||estadoDoc(rs)===iest)&&(!fam||DOCS[c].familia===fam);});
    const cual=[iest&&`estado «${iest}»`,fam&&`familia «${fam}»`].filter(Boolean).join(' y ');
    partes.push(`Hay ${plural(docsF.length,'documento','documentos')} con ${esc(cual)}${docsF.length?': '+docsF.slice(0,6).map(c=>`<mark>${esc(c)}</mark>`).join(', ')+(docsF.length>6?'…':''):''}.`);
    add('Ver documentos en Inicio',`Inicio · ${[iest&&'Estado: '+iest,fam&&'Familia: '+fam].filter(Boolean).join(' · ')}`,{view:'inicio',iest:iest||'',itipo:fam||''});
  }

  // 3. Panel de control IA: métricas y agentes
  let ag=ETAPAS.findIndex(e=>s.includes(norm(e.n)));            // nombre completo del agente, o «agente» + una palabra suya
  if(ag<0&&/agente/.test(s)) ag=ETAPAS.findIndex(e=>palabras(e.n).some(w=>w.length>4&&w!=='agente'&&ws.includes(w)));
  if(MET&&/\bf1\b|precis|recall|exhaust|metric|puntu|resultado|clave|rendimiento|acierto/.test(s)){
    partes.push(`Resultado frente a la clave: F1 <b>${esc(MET.f1)}</b>, precisión ${esc(MET.precision)}, recall ${esc(MET.recall)}, defectos encontrados ${esc(MET.encontrados)}.`);
    add('Ver métricas en el Panel de control IA','Panel de control IA · Resultado frente a la clave',{view:'ia'});
  }
  if(ag>=0||/agente|flujo|pipeline|descart|registro de ejec|log\b/.test(s)){
    const e=ETAPAS[ag>=0?ag:0];
    partes.push(ag>=0?`<b>Agente ${ag+1} · ${esc(e.n)}</b>: ${esc(e.d)}`:`La solución tiene ${ETAPAS.length} agentes: ${ETAPAS.map((x,i)=>`${i+1}. ${esc(x.n)}`).join(' · ')}.`);
    add(ag>=0?`Ver el agente ${ag+1} en el Panel de control IA`:'Ver el flujo de agentes',`Panel de control IA${ag>=0?' · Agente '+(ag+1)+' abierto':''}`,{view:'ia',agente:ag>=0?ag:null});
  }

  // 4. Configuración: reglas, criterio de aceptación, equipo
  if(/regla|umbral|criterio|aceptac|\bv[1-5]\b|jerarq|std-sec|lista-doc|normativ|verificador/.test(s)){
    partes.push(`Las reglas del verificador (V1 a V5), la jerarquía normativa y el umbral de aceptación (ahora ${S.umbral} %) están en Configuración.`);
    add('Ir a Configuración · Reglas','Configuración · Reglas y criterio de aceptación',{view:'reglas'});
  }
  const persona=S.equipo.find(m=>ws.includes(norm(m.n)));
  if(persona){
    const hits=RES.filter(r=>decOf(r)&&decOf(r).user===persona.n);
    partes.push(`<b>${esc(persona.n)}</b> es ${esc(persona.rol||'Revisor')} (${esc(persona.c)}) y ha decidido ${plural(hits.length,'hallazgo','hallazgos')}.`);
    if(hits.length) verH(hits,'Decididos por '+persona.n);
    add(`Ver a ${persona.n} en Usuarios y roles`,'Configuración · Usuarios y roles',{view:'usuarios'});
  } else if(/equipo|usuario|rol\b|roles|miembro|admin|aprobador|revisor|quien/.test(s)){
    partes.push(`El equipo tiene ${plural(S.equipo.length,'persona','personas')}: ${S.equipo.map(m=>`${esc(m.n)} (${esc(m.rol||'Revisor')})`).join(', ')}.`);
    add('Ir a Usuarios y roles','Configuración · Usuarios y roles',{view:'usuarios'});
  }

  // 5. Chat del equipo
  if(/chat|mensaje|canal|conversa/.test(s)){
    partes.push(SRV?`Hay ${plural((S.mensajes||[]).length,'mensaje','mensajes')} en ${plural((S.chats||[]).length,'chat','chats')}.`:'El chat del equipo necesita la revisión en equipo (python servidor.py).');
    add('Ir al Chat','Chat · #'+(S.canal||'general'),{view:'chat',canal:S.canal||'general'});
  }

  // 6. Sin intención clara: búsqueda por texto en hallazgos, documentos y mensajes
  if(!partes.length&&ws.length){
    const hits=RES.filter(r=>{const t=norm(r.documento+' '+r.ubicacion+' '+r.justificacion+' '+r.tipo+' '+(r.leido||''));return ws.some(w=>t.includes(w));});
    if(hits.length){partes.push(`Encontré ${plural(hits.length,'hallazgo que menciona','hallazgos que mencionan')} «${esc(q.trim())}»: ${listaH(hits)}.`); verH(hits,'Texto: '+q.trim());}
    const docsT=Object.keys(DOCS).filter(c=>ws.some(w=>norm(c+' '+DOCS[c].titulo).includes(w)));
    if(docsT.length){partes.push(`${plural(docsT.length,'documento coincide','documentos coinciden')}: ${docsT.slice(0,6).map(c=>`<mark>${esc(c)}</mark>`).join(', ')}${docsT.length>6?'…':''}.`);
      add('Ver documentos en Inicio','Inicio · Búsqueda: '+ws[0],{view:'inicio',iq:ws[0]});}
    const msgs=(S.mensajes||[]).filter(m=>ws.some(w=>norm(m.texto).includes(w)));
    if(msgs.length){partes.push(`También aparece en ${plural(msgs.length,'mensaje','mensajes')} del chat.`); add('Ver en el Chat','Chat · #'+msgs[msgs.length-1].canal,{view:'chat',canal:msgs[msgs.length-1].canal});}
  }
  const text=partes.length?partes.join('<br><br>')
    :'No encuentro nada con esos términos. Prueba con un tipo de hallazgo («no cumple»), una cláusula («IS.I.OR.230»), un código de documento, «documentos pendientes», «F1», «reglas» o el nombre de alguien del equipo.';
  return {text,ctas:ctas.slice(0,4),vacia:!partes.length};
}

// ---------- Asistente IA con modelo (RAG local: ChromaDB + Llama en Ollama, vía servidor.py → _rag/servidor_rag.py).
// Primero se enseña al instante la búsqueda en la app (con sus botones «Ver…»); después llega la respuesta del modelo,
// que lee los documentos del corpus y los datos ya calculados de la app (el modelo no calcula ni inventa).
const plano=h=>{const d=document.createElement('div'); d.innerHTML=h; return d.textContent||'';};
function datosApp(q,a){
  const s=norm(q), ws=palabras(q), L=[];
  L.push(`Documentos auditados: ${Object.keys(DOCS).length}. Hallazgos de la solución: ${RES.length}.`);
  if(MET) L.push(`Métricas frente a la clave: F1 ${MET.f1}, precisión ${MET.precision}, recall ${MET.recall}, defectos encontrados ${MET.encontrados}.`);
  if(!a.vacia) L.push('Resultado de la búsqueda en la app: '+plano(a.text));
  const doc=Object.keys(DOCS).find(c=>s.includes(norm(c)));
  const hits=doc?RES.filter(r=>r.documento===doc)
    :RES.filter(r=>{const t=norm(r.documento+' '+r.ubicacion+' '+r.justificacion+' '+r.tipo+' '+r.clausula);return ws.some(w=>t.includes(w));});
  if(doc) L.push(`Documento ${doc}: ${DOCS[doc].titulo} (v${DOCS[doc].version}, ${DOCS[doc].familia}).`);
  hits.slice(0,15).forEach(r=>{const d=decOf(r);
    L.push(`- Hallazgo ${r.documento} · ${r.ubicacion} · ${r.tipo} · ${r.clausula}${d?' · decisión: '+DECTXT[d.dec]:''} · ${String(r.justificacion||'').slice(0,220)}`);});
  return L.join('\n').slice(0,4000);
}
function textoIA(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');}
function bajarAsis(){const m=document.getElementById('msgs'); if(m) m.scrollTop=m.scrollHeight;}

async function preguntarIA(q,a){
  const historial=S.msgs.filter(m=>m.r==='u'||m.ia).slice(-7,-1).map(m=>({r:m.r,t:plano(m.t).slice(0,600)}));
  const m={r:'a',ia:true,t:'<span class="small">🤖 Leyendo los documentos…</span>'};
  S.msgs.push(m); render(); bajarAsis();
  try{
    const r=await fetch('/api/asistente',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({user:S.user.nombre||'anon',pregunta:q.trim(),datos_app:datosApp(q,a),historial})});
    const d=await r.json();
    if(!r.ok||d.error) throw new Error(d.error||r.status);
    const fu=(d.fuentes||[]).map(f=>`<mark>${esc(f.split('/').pop())}</mark>`).join(' ');
    m.t=`<b>🤖 Asistente IA</b><br>${textoIA(d.respuesta)}${fu?`<div class="small" style="margin-top:6px">Fuentes: ${fu}</div>`:''}`;
  }catch(e){
    m.t=`<span class="small">El asistente con IA no responde (${esc(String(e.message||e))}). Arriba tienes lo que encontré en la app.</span>`;
  }
  render(); bajarAsis();
}

function sendChat(q){
  if(!q||!q.trim()) return;
  S.msgs.push({r:'u',t:esc(q.trim())});
  const a=answer(q);
  if(!(SRV&&a.vacia)) S.msgs.push({r:'a',t:a.text,ctas:a.ctas});   // con IA, no enseñar «no encuentro nada»
  S.cq=''; render(); bajarAsis();
  if(SRV) preguntarIA(q,a);
}

// Lleva a la sección con los filtros que propuso el asistente.
function irDestino(d){
  S.asisOpen=false;
  if(d.view==='historico'){S.tipo=d.tipo||''; S.q=d.q||''; S.hl=d.hl||[]; S.soloHl=!!S.hl.length; S.hlTxt=d.hlTxt||'';}
  if(d.view==='inicio'){S.iq=d.iq||''; S.iest=d.iest||''; S.itipo=d.itipo||'';}
  if(d.view==='ia') S.agente=d.agente??null;
  if(d.view==='chat'&&d.canal){S.canal=d.canal; S.chatAbajo=true;}
  if(d.view==='revision'){abrirRevision(d.doc); if(d.u){const i=R().findIndex(r=>r.ubicacion===d.u); if(i>=0) irA(i);}}
  else S.view=d.view;
  render(); window.scrollTo(0,0);
}

let _arrastre=null;
document.addEventListener('pointerdown',e=>{
  const f=e.target.closest&&e.target.closest('.fab'); if(!f||e.button!==0) return;
  const r=f.getBoundingClientRect();
  _arrastre={f,dx:e.clientX-r.left,dy:e.clientY-r.top,x0:e.clientX,y0:e.clientY,movido:false};
  try{f.setPointerCapture(e.pointerId);}catch(err){}
});
document.addEventListener('pointermove',e=>{
  if(!_arrastre) return;
  if(!_arrastre.movido&&Math.hypot(e.clientX-_arrastre.x0,e.clientY-_arrastre.y0)<6) return;   // un clic normal no mueve nada
  _arrastre.movido=true;
  const f=_arrastre.f;
  const x=Math.min(Math.max(8,e.clientX-_arrastre.dx),window.innerWidth-f.offsetWidth-8);
  const y=Math.min(Math.max(64,e.clientY-_arrastre.dy),window.innerHeight-f.offsetHeight-8);
  Object.assign(f.style,{left:x+'px',top:y+'px',right:'auto',bottom:'auto'}); f.classList.add('moviendo');
  S.fabPos={x,y};
});
document.addEventListener('pointerup',()=>{
  if(!_arrastre) return;
  const movido=_arrastre.movido; _arrastre.f.classList.remove('moviendo'); _arrastre=null;
  if(movido){S._sinClic=true; try{localStorage.setItem('rv_fab',JSON.stringify(S.fabPos));}catch(err){}}
});
document.addEventListener('dblclick',e=>{
  if(!(e.target.closest&&e.target.closest('.fab'))) return;
  S.fabPos=null; S.asisOpen=false; try{localStorage.removeItem('rv_fab');}catch(err){} render();
});

// Criterio de aceptación: umbral sobre los hallazgos ya decididos. Define cuándo un documento se aprueba o se rechaza.
function criterioCard(){
  const dec=RES.filter(x=>decOf(x));
  const pend=RES.length-dec.length;
  const ap=dec.filter(x=>decOf(x).dec==='approved').length;
  const pct=dec.length?Math.round(ap/dec.length*100):null;
  const u=S.umbral;
  const cuenta={Aprobado:0,Rechazado:0,'En revisión':0};
  Object.keys(DOCS).forEach(c=>{
    const rs=RES.filter(r=>r.documento===c); if(!rs.length) return;
    const ds=rs.filter(r=>decOf(r));
    if(ds.length<rs.length){cuenta['En revisión']++;return;}
    const p=ds.filter(r=>decOf(r).dec==='approved').length/ds.length*100;
    cuenta[p>=u?'Aprobado':'Rechazado']++;
  });
  return `<div class="card" style="margin-bottom:16px"><h3>Criterio de aceptación</h3>
    <p class="small">Un documento se aprueba cuando el porcentaje de hallazgos aprobados por el auditor es igual o mayor que el umbral y no quedan hallazgos pendientes. En otro caso queda en revisión o rechazado.</p>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0">
      <label class="small" for="umbral">Umbral de aceptación (%)</label>
      <input id="umbral" type="number" min="0" max="100" value="${u}" style="width:100px">
    </div>
    <div class="sumrow"><span>Aceptación actual</span><b>${pct===null?'—':pct+'%'}</b></div>
    <div class="sumrow"><span>Hallazgos pendientes</span><b>${pend}</b></div>
    <div class="sumrow"><span>Documentos aprobados</span>${st('ok',cuenta.Aprobado)}</div>
    <div class="sumrow"><span>Documentos rechazados</span>${st('fail',cuenta.Rechazado)}</div>
    <div class="sumrow"><span>Documentos en revisión</span>${st('doubt',cuenta['En revisión'])}</div>
    <p class="note">La aceptación se calcula sobre los hallazgos ya decididos. Cambiar el umbral afecta a los documentos que aún no se han cerrado.</p>
  </div>`;
}

      </div>
    </div>`:'';
  document.getElementById('view').innerHTML=VIEWS[S.view]()+criterios+comentario+(S.view==='chat'?vDlgGrupo():'')+vAsistente();
  scr.forEach(([s,y])=>{const el=document.querySelector(s); if(el&&y) el.scrollTop=y;});
  const cl=document.getElementById('chatlist');                   // chat: baja al último mensaje si hay nuevos
  if(cl){
    const n=(S.mensajes||[]).filter(m=>m.canal===(S.canal||'general')).length;
    if(S.chatAbajo||n!==S._nMsg) cl.scrollTop=cl.scrollHeight; else cl.scrollTop=S._yChat||0;
    S._nMsg=n; S.chatAbajo=false;
    cl.onscroll=()=>{S._yChat=cl.scrollTop;};
    marcarVistos();
  }
  if(actId){const el=document.getElementById(actId); if(el&&el!==document.activeElement&&'value' in el){el.focus(); try{el.setSelectionRange(pos,pos);}catch(e){}}}
  pintarBarra();
  aplicarIdioma();
  if(S.view==='revision') centrarCita();
}

function toggleDrawer(force){
  const d=document.getElementById('drawer');
  const open=typeof force==='boolean'?force:!d.classList.contains('open');
  d.classList.toggle('open',open);
  document.getElementById('scrim').classList.toggle('hidden',!open);
  document.querySelector('.burger').setAttribute('aria-expanded',String(open));
}

document.addEventListener('click',e=>{

  if(a==='editarMsg'){
    const m=(S.mensajes||[]).find(x=>x.id===Number(el.dataset.id));
    if(!m||minEditables(m)<=0){aviso(`Solo se puede editar un mensaje durante ${EDITAR_MIN} minutos`); render(); return;}
    S.editMsg=Number(el.dataset.id); S.editTxt=undefined; render(); const t=document.getElementById('eMsg'); if(t){t.focus(); t.setSelectionRange(t.value.length,t.value.length);} return;}
  if(a==='cancelarMsg'){S.editMsg=null; S.editTxt=undefined; render(); return;}
  if(a==='guardarMsg'){
    const id=Number(el.dataset.id), texto=(document.getElementById('eMsg').value||'').trim();
    api('/api/mensaje/editar',{id,texto}).then(r=>{if(r.ok){S.editMsg=null; S.editTxt=undefined; sondear();}});
    return;
  }
  if(a==='quitarPend'){S.pend.splice(Number(el.dataset.i),1); render(); return;}
  if(a==='lang'){S.lang=el.dataset.v; try{localStorage.setItem('rv_lang',S.lang);}catch(err){} render(); return;}
  if(a==='avisos'){S.avisosOpen=!S.avisosOpen; pintarBarra(); aplicarIdioma(); return;}
  if(a==='borrarAviso'){                                      // × de una tarjeta, o «Borrar todas» (clave vacía)
    const k=el.dataset.k;
    S.avisos=(S.avisos||[]).filter(x=>k&&x.key!==k);
    pintarBarra(); aplicarIdioma(); api('/api/avisos/borrar',k?{key:k}:{});
    return;
  }
  if(a==='expAviso'){                                         // desplegar / plegar el montón (no marca nada como leído)
    const k=el.dataset.k; S.expAviso.has(k)?S.expAviso.delete(k):S.expAviso.add(k);
    pintarBarra(); aplicarIdioma();
    const b=[...document.querySelectorAll('#avisos .noti-cuerpo')].find(x=>x.dataset.k===k); if(b) b.focus();
    return;
  }
  if(a==='cerrarBanner'){quitarBanner(el.dataset.bid); return;}
  if(a==='vaciarChat'){
    const c=S.chats.find(x=>x.id===el.dataset.v); if(!c) return;
    if(!confirm(`¿Vaciar ${nombreChat(c)}? Los mensajes se borran solo para ti: los demás los siguen viendo. No se puede deshacer.`)) return;
    S.mensajes=(S.mensajes||[]).filter(m=>m.canal!==c.id); S.avisos=(S.avisos||[]).filter(x=>x.key!=='chat:'+c.id); render();
    api('/api/chat/vaciar',{id:c.id}).then(r=>{if(r.ok) aviso('Chat vaciado'); sondear();});
    return;
  }
  if(a==='prevAdj'){abrirPrev(el.dataset.id,el); return;}
  if(a==='editarDoc'){abrirEditor(el.dataset.doc,el.dataset.n?Number(el.dataset.n):undefined); return;}
  if(a==='cerrarEditor'){
    if(S.ed&&!cambiosEditor().igual&&!confirm('¿Cerrar sin guardar? Se perderán los cambios de esta edición.')) return;
    S.ed=null; pintarEditor(); return;
  }
  if(a==='edPag'){const e=S.ed; if(!e) return; e.pag=Math.min(DOCS[e.doc].paginas,Math.max(1,e.pag+Number(el.dataset.v))); cargarPaginaEditor(); return;}
  if(a==='edRestaurar'){const e=S.ed; if(!e) return; e.textos[e.pag]=e.orig[e.pag]; pintarEditor(); return;}
  if(a==='edGuardar'){guardarVersion(); return;}
  if(a==='verCmp'){const d=el.dataset.doc,n=Number(el.dataset.n); if(S.cmp&&S.cmp.doc===d&&S.cmp.n===n){S.cmp=null; render();} else compararVersion(d,n); return;}
  if(a==='descVer'){descargarVersion(el.dataset.doc,Number(el.dataset.n)).catch(()=>aviso('No se pudo preparar el archivo')); return;}
  if(a==='irPestana'){if(el.dataset.doc!==S.doc){abrirRevision(el.dataset.doc); render();} return;}
  if(a==='cerrarPestana'){cerrarPestana(el.dataset.doc); render(); window.scrollTo(0,0); return;}
  if(a==='cerrarPrev'){cerrarPrev(); return;}
  if(a==='irAviso'){                                          // «Ver»: abre el chat o el hallazgo y borra ese grupo de la campanita
    const k=el.dataset.k;
    (S.banners||[]).filter(b=>b.k===k).forEach(b=>quitarBanner(b.id));
    S.avisos=(S.avisos||[]).filter(x=>x.key!==k); S.expAviso.delete(k); api('/api/avisos/borrar',{key:k});
  }
  if(a==='irAviso'&&el.dataset.k.startsWith('chat:')){
    S.avisosOpen=false; S.view='chat'; S.canal=el.dataset.k.slice(5); S.chatAbajo=true; render(); window.scrollTo(0,0); return;
  }
  if(a==='nuevoCanal'){
    const nombre=(prompt('Nombre del nuevo canal público (lo verá todo el equipo):')||'').trim(); if(!nombre) return;
    api('/api/chat/crear',{tipo:'canal',nombre}).then(r=>{if(r.ok){S.canal=r.id; S.chatAbajo=true; sondear();}});
    return;
  }
  if(a==='menuPrivado'){S.privOpen=!S.privOpen; render(); return;}
  if(a==='abrirPrivado'){
    S.privOpen=false;
    api('/api/chat/crear',{tipo:'privado',con:el.dataset.v}).then(r=>{if(r.ok){S.canal=r.id; S.chatAbajo=true; S.abierto.privados=true; sondear();}});
    return;
  }
  if(a==='canal'){S.canal=el.dataset.v; S.chatAbajo=true; render(); return;}
  if(a==='plegar'){S.abierto[el.dataset.v]=!S.abierto[el.dataset.v]; render(); return;}
  if(a==='plegarGrupo'){const k='g:'+el.dataset.v; S.abierto[k]=el.getAttribute('aria-expanded')!=='true'; render(); return;}
  if(a==='renombrarChat'){                                          // canal público: solo el administrador del equipo
    const c=S.chats.find(x=>x.id===el.dataset.v); if(!c) return;
    const nuevo=(prompt(`Nuevo nombre para #${c.nombre}:`,c.nombre)||'').trim();
    if(!nuevo||nuevo===c.nombre) return;
    api('/api/chat/editar',{id:c.id,nombre:nuevo}).then(sondear);
    return;
  }
  if(a==='borrarChat'){
    const c=S.chats.find(x=>x.id===el.dataset.v); if(!c) return;
    if(!confirm(`¿Eliminar ${nombreChat(c)} y todos sus mensajes? No se puede deshacer.`)) return;
    api('/api/chat/borrar',{id:c.id}).then(r=>{if(r.ok&&S.canal===c.id) S.canal='general'; sondear();});
    return;
  }
  if(a==='nuevoGrupo'){abrirDlgGrupo(null); return;}
  if(a==='gestionarGrupo'){abrirDlgGrupo(S.chats.find(x=>x.id===el.dataset.v)); return;}
  if(a==='cerrarDlg'){S.dlg=null; render(); return;}
  if(a==='guardarGrupo'){
    const g=S.dlg; g.nombre=(document.getElementById('gN').value||'').trim();
    if(!g.nombre){aviso('Pon un nombre al grupo'); return;}
    const p=g.id?api('/api/chat/editar',{id:g.id,nombre:g.nombre,miembros:g.miembros}):api('/api/chat/crear',{tipo:'grupo',nombre:g.nombre,miembros:g.miembros});
    p.then(r=>{if(r.ok){S.dlg=null; if(r.id){S.canal=r.id; S.chatAbajo=true;} sondear(); render();}});
    return;
  }
  if(a==='salirGrupo'){
    const c=S.chats.find(x=>x.id===el.dataset.v); if(!c) return;
    if(!confirm(`¿Salir del grupo ${c.nombre}? Dejarás de ver sus mensajes.`)) return;
    api('/api/chat/salir',{id:c.id}).then(r=>{if(r.ok) S.canal='general'; sondear();});
    return;
  }
  if(a==='privado'){
    api('/api/chat/crear',{tipo:'privado',con:el.dataset.v}).then(r=>{if(r.ok){S.canal=r.id; S.chatAbajo=true; S.abierto.privados=true; sondear();}});
    return;
  }
  if(a==='bajaEq'){
    const n=el.dataset.v;
    if(!confirm(`¿Eliminar a ${n} del equipo? Sus mensajes y decisiones se conservan.`)) return;
    api('/api/equipo/baja',{n}).then(sondear);
    return;
  }
  if(a==='mencionar'){
    if(el.dataset.chat&&el.dataset.chat!==S.canal){S.canal=el.dataset.chat; S.chatAbajo=true;}   // se menciona dentro de su grupo
    S.ctx=(S.ctx?S.ctx.replace(/\s*$/,' '):'')+'@'+el.dataset.v+' '; render();
    const t=document.getElementById('ctx'); if(t){t.focus(); t.setSelectionRange(t.value.length,t.value.length);} return;
  }
  if(a==='abrirNum'){
    e.preventDefault(); const r=RES[Number(el.dataset.n)-1]; if(!r) return;
    abrirRevision(r.documento); const i=R().findIndex(x=>x.ubicacion===r.ubicacion); if(i>=0) irA(i);
    render(); window.scrollTo(0,0); return;
  }
  if(a==='irAviso'){
    const [doc]=el.dataset.k.split('|'); S.avisosOpen=false;
    abrirRevision(doc); const i=R().findIndex(r=>key(r)===el.dataset.k); if(i>=0) irA(i);
    render(); window.scrollTo(0,0); return;
  }
  if(a==='asis'&&S._sinClic){S._sinClic=false; return;}         // se acaba de arrastrar: no se abre
  if(a==='asis'){S.asisOpen=!S.asisOpen; S.asisAnim=S.asisOpen; render(); if(S.asisOpen){const m=document.getElementById('msgs'); if(m) m.scrollTop=m.scrollHeight; const i=document.getElementById('cq'); if(i) i.focus();} return;}
  if(a==='sug'){sendChat(el.dataset.v); return;}
  if(a==='cta'){const c=(S.msgs[Number(el.dataset.m)]||{}).ctas; if(c&&c[Number(el.dataset.c)]) irDestino(c[Number(el.dataset.c)].dest); return;}
  if(a==='limpiarHl'){S.hl=[]; S.soloHl=false; S.hlTxt=''; render(); return;}
  if(a==='drawer') toggleDrawer();
  else if(a==='nav'){S.view=el.dataset.v; toggleDrawer(false); render(); window.scrollTo(0,0);}
  else if(a==='abrir'){abrirRevision(el.dataset.doc); render(); window.scrollTo(0,0);}
  else if(a==='iest'){S.iest=el.dataset.v; render();}
  else if(a==='hdec'){S.hdec=el.dataset.v; render();}
  else if(a==='limpiarFiltros'){Object.assign(S,{iq:'',itipo:'',hdec:'',htipo:'',hclau:'',hconf:0,hmios:false,hnuevos:false,hcoms:false}); render();}
  else if(a==='abrirH'){abrirRevision(el.dataset.doc); const i=R().findIndex(r=>r.ubicacion===el.dataset.u); if(i>=0) irA(i); render(); window.scrollTo(0,0);}
  else if(a==='volver'){S.view='inicio'; S.sel={}; S.comment=''; render(); window.scrollTo(0,0);}
  else if(a==='criterios'){S.criteriosOpen=true; render();}
  else if(a==='cerrarCriterios'){S.criteriosOpen=false; render();}
  else if(a==='toggleExtra'){S.extraOpen=!S.extraOpen; render();}
  else if(a==='guardarExtra') guardarExtra();
  else if(a==='goto'){irA(Number(el.dataset.i)); render();}
  else if(a==='toggle'){const k=el.dataset.k; S.sel[k]=!S.sel[k]; render();}
  else if(a==='todos'){
    const pend=pendientes();
    const todos=pend.every(x=>S.sel[key(x)]);
    S.sel={};
    if(!todos) pend.forEach(x=>{S.sel[key(x)]=true;});
    render();
  }
  else if(a==='aprobar') aplicar('approved');
  else if(a==='rechazar') aplicar('rejected');
  else if(a==='pdfpag'){
    const n=S.pdfPag+Number(el.dataset.d);
    if(n<1||n>DOCS[S.doc].paginas) return;
    S.pdfPag=n; render();
  }
  else if(a==='agente'){const i=Number(el.dataset.i); S.agente=S.agente===i?null:i; render();}
  else if(a==='editarHallazgo'){S.editH=el.dataset.k; S.editVals={}; render();}
  else if(a==='cancelarEdicion'){S.editH=null; S.editVals={}; render();}
  else if(a==='verOriginal'){S.verOrig=S.verOrig===el.dataset.k?null:el.dataset.k; render();}
  else if(a==='guardarEdicion'||a==='deshacerEdicion'){
    const k=el.dataset.k;
    if(a==='deshacerEdicion'&&!confirm('¿Quitar todas las ediciones y volver al original del auditor?')) return;
    const campos=a==='guardarEdicion'?{tipo:document.getElementById('eT').value,clausula:document.getElementById('eC').value.trim(),justificacion:document.getElementById('eJ').value.trim()}:null;
    if(campos&&(!campos.clausula||!campos.justificacion)){aviso('Pon la cláusula y la justificación'); return;}
    if(SRV){
      api(campos?'/api/edicion':'/api/edicion/deshacer',{key:k,...(campos||{})}).then(r=>{if(r.ok){S.editH=null; S.verOrig=null; sondear();}});
    }else{                                                   // sin servidor: se guarda en este navegador
      S.ediciones=S.ediciones||{};
      if(campos) (S.ediciones[k]=S.ediciones[k]||[]).push({user:S.user.nombre,fecha:new Date().toISOString(),...campos}); else delete S.ediciones[k];
      try{localStorage.setItem(LS+'_edic',JSON.stringify(S.ediciones));}catch(err){}
      S.editH=null; S.verOrig=null; render();
    }
  }
  else if(a==='menuExp'){S.expOpen=!S.expOpen; render();}
  else if(a==='exportar'){exportar(el.dataset.c,el.dataset.f);}
  else if(a==='exres') exportRespuestas();
  else if(a==='exfb') exportFeedback();
  else if(a==='logout'){S.view='inicio'; document.getElementById('app').classList.add('hidden'); document.getElementById('login').classList.remove('hidden'); toggleDrawer(false);}
});

document.addEventListener('change',e=>{
  if(e.target.id==='ftipo'){S.tipo=e.target.value; render();}
  if(e.target.id==='itipo'){S.itipo=e.target.value; render();}
  if(e.target.id==='htipo'){S.htipo=e.target.value; render();}
  if(e.target.id==='verNuevo'&&e.target.value){const d=e.target.value; e.target.value=''; abrirEditor(d);}
  if(e.target.id==='cmpPag'){compararVersion(e.target.dataset.doc,Number(e.target.dataset.n),Number(e.target.value));}
  if(e.target.id==='hclau'){S.hclau=e.target.value; render();}
  if(e.target.id==='hconf'){S.hconf=Number(e.target.value)||0; render();}
  if(['hmios','hnuevos','hcoms'].includes(e.target.id)){S[e.target.id]=e.target.checked; render();}
  if(e.target.id==='iest'){S.iest=e.target.value; render();}
  if(e.target.id==='umbral'){S.umbral=Math.min(100,Math.max(0,Number(e.target.value)||0)); render();}
  if(e.target.dataset&&e.target.dataset.rol){api('/api/equipo/rol',{n:e.target.dataset.rol,rol:e.target.value}).then(sondear);}
  // Ventana de grupo: marcar quién entra y su papel (se guarda al pulsar «Crear grupo» / «Guardar cambios»)
  if(S.dlg&&e.target.dataset&&e.target.dataset.gmiem){
    const n=e.target.dataset.gmiem; S.dlg.nombre=(document.getElementById('gN').value||'');
    if(e.target.checked) S.dlg.miembros[n]=S.dlg.miembros[n]||'miembro'; else delete S.dlg.miembros[n];
    render();
  }
  if(S.dlg&&e.target.dataset&&e.target.dataset.grol){S.dlg.miembros[e.target.dataset.grol]=e.target.value;}
  if(e.target.id==='adjInput'&&e.target.files.length){subirArchivos([...e.target.files]); e.target.value='';}
  if(e.target.id==='nuevoPrivado'&&e.target.value){
    api('/api/chat/crear',{tipo:'privado',con:e.target.value}).then(r=>{if(r.ok){S.canal=r.id; S.chatAbajo=true; S.abierto.privados=true; sondear();}});
  }
  if(e.target.id==='archivo'){
    const f=e.target.files&&e.target.files[0];
    if(f){S.uploads.push({nombre:f.name,fecha:new Date().toISOString()}); render();}
  }
});

// En el chat, Intro envía y Mayúsculas+Intro hace salto de línea. Con la lista de @ abierta: ↑ ↓ eligen, Intro/Tab
// mencionan y Esc la cierra.
document.addEventListener('keydown',e=>{
  if(S.ed&&e.key==='Escape'){e.preventDefault(); document.querySelector('#editor [data-act="cerrarEditor"]')?.click(); return;}
  if(S.prev){                                                     // vista previa abierta: Esc cierra, Tab no sale de ella
    if(e.key==='Escape'){e.preventDefault(); cerrarPrev(); return;}
    if(e.key==='Tab'){const f=[...document.querySelectorAll('#prevAdj a,#prevAdj button,#prevAdj video,#prevAdj audio,#prevAdj iframe')];
      const i=f.indexOf(document.activeElement); if(e.shiftKey?i<=0:i===f.length-1){e.preventDefault(); f[e.shiftKey?f.length-1:0].focus();}}
  }
  if(S.sug&&e.target.id===S.sug.el){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault(); S.sug.i=(S.sug.i+(e.key==='ArrowDown'?1:-1)+S.sug.items.length)%S.sug.items.length; pintarSugerencias(e.target); return;}
    if(e.key==='Enter'||e.key==='Tab'){e.preventDefault(); elegirMencion(S.sug.items[S.sug.i]); return;}
    if(e.key==='Escape'){cerrarSug(); return;}
  }
  if(e.key==='Escape'&&S.asisOpen){S.asisOpen=false; render(); return;}      // cierra el Asistente IA
  if(e.target.id==='ctx'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault(); enviarMensaje();}
  if(e.target.id==='eMsg'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault(); document.querySelector('[data-act="guardarMsg"]')?.click();}
  if(e.target.id==='eMsg'&&e.key==='Escape'){S.editMsg=null; render();}
});

document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='loginForm'){
    const em=(document.getElementById('em').value||'revisor').trim();
    // Si es alguien del equipo (por correo o por nombre), se usa su nombre del equipo: así las @menciones le llegan
    const loc=em.split('@')[0].toLowerCase(), m=S.equipo.find(x=>x.c===em.toLowerCase()||x.n.toLowerCase()===loc.split(/[._\-\s]+/)[0]);
    S.user.nombre=m?m.n:(em.split('@')[0].split(/[._-]+/).filter(Boolean).map(w=>w[0].toUpperCase()+w.slice(1)).join(' ')||'Revisor');
    if(m) S.user.cargo=`${m.rol} · Calidad Part-IS`;
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    render();
    if(SRV&&!S.sondeo){S.sondeo=setInterval(sondear,2500); sondear();}   // novedades del equipo cada 2,5 s
  } else if(e.target.id==='chatForm'){
    sendChat(document.getElementById('cq').value);
    const c=document.getElementById('cq'); if(c) c.focus();
  } else if(e.target.id==='comForm'){
    enviarComentario();
  } else if(e.target.id==='chatEq'){
    enviarMensaje();
  } else if(e.target.id==='altaEq'){
    const n=document.getElementById('aN').value.trim(), c=document.getElementById('aC').value.trim(), rol=document.getElementById('aR').value;
    api('/api/equipo/alta',{n,c,rol}).then(r=>{if(r.ok){aviso(`${n} añadido al equipo`); sondear();}});
  } else if(e.target.id==='canalForm'){
    const nombre=(document.getElementById('ncanal').value||'').trim(); if(!nombre) return;
    api('/api/chat/crear',{tipo:'canal',nombre}).then(r=>{if(r.ok){S.canal=r.id; S.chatAbajo=true; sondear();}});
  }
});

// Con servidor, el equipo actual llega antes del inicio de sesión (para reconocer a cada uno por su correo)
if(SRV) fetch('/api/estado',{cache:'no-store'}).then(r=>r.json()).then(d=>{if(d.equipo&&d.equipo.length) S.equipo=d.equipo;}).catch(()=>{});
render();
</script>
</body>
</html>
