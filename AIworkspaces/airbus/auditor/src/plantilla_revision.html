<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revisión de hallazgos · Reto Airbus</title>
<!-- Diseño: prototipo de Valentina (prototipo-revision-hallazgos.html). Datos: generados por generar_revision.py
     a partir de respuestas.csv, la traza del verificador y los PDF del corpus. No editar a mano: se regenera. -->
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--sec:#6e6e73;--sep:#d1d1d6;--tint:#0a84ff;--ok:#34c759;--warn:#ff9f0a;--err:#ff3b30;--r:14px;font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-size:15px;line-height:1.4}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 16px;background:var(--tint);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:#e5e5ea;color:var(--text)}
button.ok{background:var(--ok)}
button.warn{background:var(--warn)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid rgba(10,132,255,.45);outline-offset:2px}
input,select,textarea{font:inherit;padding:9px 11px;border:1px solid var(--sep);border-radius:10px;background:#fff;color:var(--text)}
input[type=checkbox]{width:18px;height:18px;padding:0;margin:0;flex:none;accent-color:var(--tint)}
a{color:var(--tint)}
.hidden{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-card{background:#fff;border-radius:20px;padding:36px;width:380px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.login-card h1{font-size:22px;margin:0 0 4px}
.login-card p{color:var(--sec);margin:0 0 20px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;color:var(--sec)}
.login-card button{width:100%;padding:12px}
.topbar{position:sticky;top:0;height:56px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--sep);display:flex;align-items:center;gap:14px;padding:0 20px;z-index:5}
.burger{background:none;color:var(--text);padding:4px 8px;font-size:22px;line-height:1}
.topbar .title{font-weight:600;font-size:17px}
.drawer{position:fixed;top:0;bottom:0;left:0;width:290px;background:#fff;box-shadow:4px 0 24px rgba(0,0,0,.12);transform:translateX(-102%);transition:transform .25s;z-index:20;padding:20px;display:flex;flex-direction:column;gap:6px}
.drawer.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:18}
.sidemodal{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.15);z-index:30;padding:22px;overflow:auto}
.dialog{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(520px,92vw);background:#fff;border-radius:16px;padding:22px;z-index:35;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.dialog input,.dialog textarea{width:100%}
.user{padding:14px;border-radius:12px;background:var(--bg);margin-bottom:12px}
.user b{display:block;font-size:16px}
.user span{color:var(--sec);font-size:13px}
.nav-item{text-align:left;background:none;color:var(--text);padding:11px 12px;border-radius:10px;font-size:15px}
.nav-item:hover{background:#f0f0f5}
.nav-item.active{background:#e5f1ff;color:var(--tint);font-weight:600}
.nav-item.sub{padding-left:30px;font-size:14px}
main{padding:18px 20px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.sp{flex:1}
h2{font-size:22px;margin:0 0 4px}
h3{margin:0 0 8px;font-size:16px}
.sub{color:var(--sec);margin:0 0 14px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--sep);font-size:14px;vertical-align:top}
th{color:var(--sec);font-weight:500;font-size:13px}
tr.clic{cursor:pointer}
tr.clic:hover td{background:#f7f7fa}
tr.hl td{background:#fff6cc}
.small{font-size:13px;color:var(--sec)}
.note{font-size:12px;color:var(--sec);background:#f7f7fa;border-radius:10px;padding:10px;margin-top:12px}
.st{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--text);white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.two{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.right{position:sticky;top:74px;max-height:calc(100vh - 150px);display:flex;flex-direction:column;overflow:hidden}
.lista-scroll{max-height:min(190px,24vh);overflow:auto;flex:none}
.motivo-scroll{margin-top:12px;flex:1 1 auto;min-height:90px;overflow:auto}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:8px;border-bottom:1px solid var(--sep)}
.hrow.on{background:#e5f1ff}
.hrow .nm{flex:1;text-align:left;background:none;color:var(--text);padding:0;font-weight:600;font-size:14px}
.pnav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.iconbtn{background:#e5e5ea;color:var(--text);padding:8px 10px;display:inline-flex;align-items:center}
.pdfwrap{background:#e9e9ee;border-radius:10px;padding:18px}
.sumrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--sep);font-size:14px}
.rule{background:#f7f7fa;border-radius:10px;padding:12px;font-size:14px;margin:10px 0}
.fbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.fbtns button{font-size:14px;padding:11px 8px}
.log{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--sec);background:#f7f7fa;border-radius:10px;padding:12px;max-height:320px;overflow:auto}
.chat{display:flex;flex-direction:column;height:520px}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:8px 0}
.m{padding:10px 13px;border-radius:14px;max-width:88%;font-size:14px}
.m.u{align-self:flex-end;background:var(--tint);color:#fff}
.m.a{align-self:flex-start;background:var(--bg)}
.chatin{display:flex;gap:8px}
.chatin input{flex:1}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{background:#e5e5ea;color:var(--text)}
.tabs button.on{background:var(--tint);color:#fff}
mark{background:#ffe27a;padding:0 2px;border-radius:3px}
.cita{border-left:3px solid var(--warn);background:#fff8ec;padding:6px 10px;border-radius:0 8px 8px 0;margin:4px 0;font-size:13px;color:var(--text)}
.hscroll{max-height:560px;overflow:auto}
/* Inicio con la estructura de lista de Marina, en el sistema de diseño de Apple de Valentina */
.seg{display:inline-flex;flex-wrap:wrap;background:#e5e5ea;border-radius:9px;padding:2px;gap:2px}
.seg button{background:none;color:var(--text);padding:6px 12px;border-radius:7px;font-size:13px}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.seg .n{color:var(--sec);margin-left:6px;font-weight:400}
.dlist{display:flex;flex-direction:column;gap:8px}
.drow{display:grid;grid-template-columns:240px minmax(0,1fr) 170px;gap:16px;align-items:center;background:#fff;border-radius:12px;padding:12px 16px;border-left:4px solid var(--c);box-shadow:0 1px 2px rgba(0,0,0,.04);cursor:pointer;transition:box-shadow .15s}
.drow:hover{box-shadow:0 3px 10px rgba(0,0,0,.08)}
.drow.off{cursor:default}
.drow.off:hover{box-shadow:0 1px 2px rgba(0,0,0,.04)}
.drow .cod{font-weight:700;font-size:15px}
.drow .tit{font-size:14px;margin-bottom:6px}
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;background:var(--pb);color:var(--pc);margin:0 4px 3px 0;white-space:nowrap}
.estado{justify-self:end;text-align:right}
.mini{height:4px;background:#e5e5ea;border-radius:999px;overflow:hidden;width:120px;margin:6px 0 0 auto}
/* Barra superior: idioma, avisos y usuario; revisión en equipo (debate, menciones, presencia) */
.topbar .seg button{padding:4px 10px;font-size:13px}
.bell{position:relative;background:#f2f2f7;color:var(--text);padding:7px 9px;border-radius:10px;display:inline-flex;align-items:center}
.badge{position:absolute;top:-6px;right:-7px;background:var(--err);color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:18px;height:18px;padding:0 5px;display:flex;align-items:center;justify-content:center}
.who{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.av{width:28px;height:28px;border-radius:50%;background:#1a4c7c;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.avisos{position:fixed;top:62px;right:16px;width:min(380px,92vw);max-height:70vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.2);z-index:40;padding:16px}
.aviso{display:block;width:100%;text-align:left;background:#fdeef2;color:var(--text);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14px}
.aviso.leido{background:#f7f7fa}
/* Notificaciones tipo macOS: tarjeta translúcida, icono, resumen, «Ver» y × para eliminar */
.avisos{background:rgba(246,246,248,.96);backdrop-filter:blur(14px)}
.noti{position:relative;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.92);border-radius:18px;padding:12px 14px;margin-top:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.noti.leida{opacity:.7}
.noti .ico{width:40px;height:40px;border-radius:10px;background:#eef0f4;display:inline-flex;align-items:center;justify-content:center;font-size:18px;flex:none;color:#3a3a3c;font-weight:700}
.noti .av{width:40px!important;height:40px!important;font-size:14px}
.noti-t{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.noti-m{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.noti-ver{background:#e9e9ee;color:var(--text);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;flex:none}
.noti-x{position:absolute;top:-7px;left:-7px;width:22px;height:22px;border-radius:50%;padding:0;background:#e5e5ea;color:#3a3a3c;font-size:14px;line-height:22px;box-shadow:0 1px 3px rgba(0,0,0,.2);opacity:0;transition:opacity .15s}
.noti:hover .noti-x,.noti-x:focus-visible{opacity:1}
@media (hover:none){.noti-x{opacity:1}}
.cnt{display:inline-flex;align-items:center;justify-content:center;background:var(--err);color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:18px;height:18px;padding:0 5px;margin-left:6px;vertical-align:middle}
/* Lista propia para «Nuevo privado»: siempre se despliega hacia abajo */
.desplegable{margin-top:6px;border:1px solid var(--sep);border-radius:10px;overflow:hidden;background:#fff}
.desplegable button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#fff;color:var(--text);border-radius:0;padding:8px 12px;font-size:14px;border-bottom:1px solid #f0f0f5}
.desplegable button:last-child{border-bottom:0}
.desplegable button:hover{background:#f0f0f5}
.pres{font-size:12px;color:#c2185b;display:flex;align-items:center;gap:6px;margin:0 0 8px}
.debate{margin-top:10px;border-top:1px solid var(--sep);padding-top:10px}
.com{background:#f7f7fa;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px}
.com .q{color:var(--sec);font-size:12px;margin-bottom:2px}
.mention{color:var(--tint);font-weight:600}
.envivo{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sec)}
.envivo i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.envivo.off i{background:var(--err)}
@media (max-width:700px){.who span:last-child,.envivo span{display:none}}
/* Chat del equipo (estructura del de Marina) */
.chatgrid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.dialog .miembro input[type=checkbox]{width:18px;flex:none}
.dialog .miembro select{flex:none;width:auto;max-width:190px}
.miembro .acc{display:flex;gap:4px;flex:none}
.miembro .acc button{padding:4px 7px;font-size:13px}
.canal{display:block;width:100%;text-align:left;background:none;color:var(--text);padding:9px 12px;border-radius:10px;font-weight:600;margin-bottom:2px}
.canal:hover{background:#f0f0f5}
.canal.on{background:#e5f1ff;color:var(--tint);box-shadow:inset 3px 0 0 #c2185b}
.miembro{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--sep)}
.miembro:last-child{border-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;background:#c7c7cc;flex:none}
.dot.on{background:var(--ok)}
.chatbox{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:440px}
.chatlist{flex:1;overflow:auto;padding:4px 2px}
.mens{display:flex;gap:10px;padding:9px 0}
.ref{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--sep);border-left:4px solid var(--c);border-radius:10px;padding:8px 12px;margin-top:6px;background:#fff;cursor:pointer;max-width:620px}
.ref:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.plegar{display:flex;align-items:center;gap:8px;width:100%;background:none;color:var(--text);padding:4px 2px;font-weight:700;font-size:15px;text-align:left}
.plegar .flecha{display:inline-block;transition:transform .15s;color:var(--sec);font-size:12px}
.plegar[aria-expanded="false"] .flecha{transform:rotate(-90deg)}
.plegar .n{margin-left:auto;font-weight:400;font-size:12px;color:var(--sec)}
.fcanal{display:flex;align-items:center;gap:2px}
.fcanal .canal{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-btn{background:none;color:var(--sec);padding:4px 7px;border-radius:8px;font-size:13px;opacity:.55}
.fcanal:hover .mini-btn,.mini-btn:focus-visible{opacity:1}
.mini-btn:hover{background:#f0f0f5;color:var(--text)}
.rolpill{font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;background:#e5e5ea;color:#3a3a3c;margin-left:4px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c1c1e;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;display:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media (max-width:900px){.chatgrid{grid-template-columns:1fr}.chatbox{height:70vh}}
/* Menú lateral con los colores del de Marina: azul marino, texto blanco y opción activa en blanco */
.drawer{background:#1a4c7c;color:#fff}
.drawer .user{background:rgba(255,255,255,.12)}
.drawer .user b{color:#fff}
.drawer .user span{color:rgba(255,255,255,.72)}
.drawer .nav-item{color:rgba(255,255,255,.92)}
.drawer .nav-item:hover{background:rgba(255,255,255,.12)}
.drawer .nav-item.active{background:#fff;color:#1a4c7c;font-weight:600}
.drawer .nav-item.sub{color:rgba(255,255,255,.72)}
.drawer .nav-item.sub.active{color:#1a4c7c}
.drawer button.ghost{background:rgba(255,255,255,.14);color:#fff}
.drawer button.ghost:hover{background:rgba(255,255,255,.22)}
@media (max-width:900px){.drow{grid-template-columns:1fr;gap:8px}.estado{justify-self:start;text-align:left}.mini{margin-left:0}}
@media (max-width:1200px){.two{grid-template-columns:1fr}.right{position:static;max-height:none}.g2{grid-template-columns:1fr}}
/* Asistente IA: botón flotante y panel lateral derecho; busca en toda la aplicación y propone a dónde ir */
.fab{position:fixed;right:22px;bottom:22px;z-index:25;display:inline-flex;align-items:center;gap:8px;padding:12px 18px 12px 14px;border-radius:999px;background:#1a4c7c;color:#fff;font-weight:600;box-shadow:0 8px 24px rgba(26,76,124,.35);transition:transform .15s,box-shadow .15s}
.fab:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(26,76,124,.42)}
.asis{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.15);z-index:30;display:flex;flex-direction:column}
.asis.entra{animation:asis-in .22s ease-out}
@keyframes asis-in{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.asis-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--sep)}
.asis-h .ico{width:34px;height:34px;border-radius:10px;background:#e5f1ff;color:#1a4c7c;display:inline-flex;align-items:center;justify-content:center;flex:none}
.asis .msgs{padding:14px 18px;gap:12px}
.asis .chatin{padding:12px 18px 16px;border-top:1px solid var(--sep)}
.sug{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 10px}
.sug button{background:#f2f2f7;color:var(--text);font-size:13px;padding:6px 10px;border-radius:999px}
.sug button:hover{background:#e5e5ea}
.ctas{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.cta{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:#fff;color:#1a4c7c;border:1px solid #c9dcef;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600}
.cta:hover{background:#e5f1ff}
.cta .fl{font-size:12px;font-weight:400;color:var(--sec);display:block;margin-top:1px}
.chipf{display:inline-flex;align-items:center;gap:8px;background:#e5f1ff;color:#1a4c7c;border-radius:999px;padding:5px 6px 5px 12px;font-size:13px;font-weight:600;margin-bottom:10px}
.chipf button{background:#fff;color:#1a4c7c;padding:2px 8px;border-radius:999px;font-size:12px}
</style>
</head>
<body>

<div id="login">
  <form class="login-card" id="loginForm">
    <h1>Revisión de hallazgos</h1>
    <p>Prototipo · Reto Airbus</p>
    <div class="field"><label for="em">Correo corporativo</label><input id="em" value="" placeholder="nombre@airbus.example" autocomplete="username"></div>
    <div class="field"><label for="pw">Contraseña</label><input id="pw" type="password" value="" autocomplete="current-password"></div>
    <button type="submit">Entrar</button>
  </form>
</div>

<div id="app" class="hidden">
  <div class="topbar">
    <button class="burger" data-act="drawer" aria-label="Abrir menú" aria-expanded="false">☰</button>
    <div class="title" id="ttl">Inicio</div>
    <span aria-label="Marca Airbus (texto provisional)" style="font-weight:700;letter-spacing:.12em;font-size:13px;color:var(--sec)">AIRBUS</span>
    <div class="sp"></div>
    <span class="envivo hidden" id="envivo" title="Revisión en equipo"><i></i><span>En equipo</span></span>
    <div class="seg" role="group" aria-label="Idioma"><button data-act="lang" data-v="es" id="lang-es" class="on">ES</button><button data-act="lang" data-v="en" id="lang-en">EN</button></div>
    <button class="bell hidden" id="bell" data-act="avisos" aria-label="Avisos" title="Avisos">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="badge hidden" id="bellN">0</span>
    </button>
    <div class="who"><span class="av" id="uAv"></span><span id="uTop"></span></div>
  </div>
  <div class="avisos hidden" id="avisos" role="dialog" aria-label="Avisos"></div>

  <aside class="drawer" id="drawer" aria-label="Menú principal">
    <div class="user"><b id="uN"></b><span id="uC"></span></div>
    <button class="nav-item" data-act="nav" data-v="inicio">Inicio</button>
    <button class="nav-item" data-act="nav" data-v="ia">Panel de control IA</button>
    <button class="nav-item" data-act="nav" data-v="historico">Histórico</button>
    <button class="nav-item" data-act="nav" data-v="chat">Chat</button>
    <button class="nav-item" data-act="nav" data-v="reglas">Configuración</button>
    <button class="nav-item sub" data-act="nav" data-v="reglas">Reglas</button>
    <button class="nav-item sub" data-act="nav" data-v="usuarios">Usuarios y roles</button>
    <div style="flex:1"></div>
    <button class="ghost" data-act="logout">Cerrar sesión</button>
  </aside>
  <div class="scrim hidden" id="scrim" data-act="drawer"></div>

  <main id="view"></main>
</div>

<script>
// Datos reales: los inserta generar_revision.py (respuestas.csv + traza + corpus). Nada se calcula aquí con IA.
const D=/*__DATOS__*/null;
const RES=D.res, DOCS=D.docs, ETAPAS=D.etapas, MET=D.metricas, LOG=D.log;
const EASA_URL=D.easa;
const COLS=['documento','ubicacion','tipo','clausula','justificacion'];
const TIPOS=['No cumple','Inconsistencia','Cobertura faltante','Trazabilidad incorrecta','No verificable'];
const DECTXT={approved:'Aprobado',rejected:'Rechazado'};
const FUENTES=[
  {r:1,n:'Part-IS de EASA (IS.I.OR.200 a 260)',p:'Obligaciones y plazos legales. Muchos plazos no se repiten en los documentos internos.',url:EASA_URL},
  {r:2,n:'STD-SEC-001 (estándar corporativo, versión vigente)',p:'Valores numéricos de NIMBUS (plazos, longitudes, periodos) y criterios de control operativo.',url:''},
  {r:3,n:'LISTA-DOC (lista maestra)',p:'Documentos y versiones en vigor. Un documento sustituido no es referencia.',url:''},

];

const S={
  user:{nombre:'',cargo:'Auditor · Calidad Part-IS'},
  view:'inicio', doc:null, foco:0, pdfPag:1,
  sel:{}, comment:'', q:'', tipo:'', uploads:[],
  criteriosOpen:false, extraOpen:false, extraForm:{ref:'',txt:''},
  iq:'', iest:'', itipo:'', agente:null, umbral:80,
  dec:{}, extra:[], hl:[],
  msgs:[{r:'a',t:'Hola. Busco en toda la aplicación: documentos, hallazgos, decisiones, agentes y métricas, reglas, equipo y chat. Si la respuesta está en una sección, te propongo ir a ella con los filtros puestos.'}],
  asisOpen:false, soloHl:false, hlTxt:''
};
const LS='rv_real_'+D.id;
try{S.dec=JSON.parse(localStorage.getItem(LS+'_dec')||'{}');}catch(e){S.dec={};}
try{S.extra=JSON.parse(localStorage.getItem(LS+'_extra')||'[]');}catch(e){S.extra=[];}
try{S.lang=localStorage.getItem('rv_lang')||'es';}catch(e){S.lang='es';}

// ---------- Revisión en equipo: con servidor.py (http://…) las decisiones, comentarios, menciones y presencia se
// comparten; abierta con doble clic (file://) todo sigue funcionando solo en este navegador.
const SRV=location.protocol.startsWith('http');
Object.assign(S,{coms:[],avisos:[],pres:{},ccom:'',cq:'',avisosOpen:false,online:null,
  mensajes:[],canales:['general'],canal:'general',ctx:'',chatAbajo:true});
let _firma='';
// Equipo: con servidor llega de colaboracion.json (gestionable en Configuración → Usuarios y roles); sin él, esta lista
const ROLES={Administrador:'Gestiona el equipo y los chats; decide sobre los hallazgos.',
  Aprobador:'Decide y firma las decisiones de los demás.',Revisor:'Aprueba o rechaza hallazgos y comenta.'};
S.equipo=[{n:'Sergio',c:'sergio@airbus.es',rol:'Administrador'},{n:'Marina',c:'marina@airbus.es',rol:'Aprobador'},
  {n:'Nelson',c:'nelson@airbus.es',rol:'Revisor'},{n:'Valentina',c:'valentina@airbus.es',rol:'Revisor'},
  {n:'Daniela',c:'daniela@airbus.es',rol:'Revisor'}];
S.chats=[{id:'general',tipo:'canal',nombre:'general',autor:'',miembros:{}}];
S.abierto={canales:true,grupos:true,privados:true,equipo:true}; S.dlg=null;
function miRol(){const m=S.equipo.find(x=>x.n===S.user.nombre); return m?m.rol:'';}
function esAdmin(){return miRol()==='Administrador';}
function aviso(txt){S.toast=txt; pintarToast(); clearTimeout(S._tt); S._tt=setTimeout(()=>{S.toast=''; pintarToast();},3500);}
function pintarToast(){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div'); t.id='toast'; t.setAttribute('role','status'); document.body.appendChild(t);}
  t.textContent=S.toast||''; t.style.display=S.toast?'block':'none';
}
const COLAV=['#1a4c7c','#c2185b','#248a3d','#a442d6','#c76a00','#0a6fd6'];
const NUM=new Map(RES.map((r,i)=>[r.documento+'|'+r.ubicacion,i+1]));     // #número de cada hallazgo para el chat
function ini(n){return String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');}
function colorDe(n){let h=0; for(const ch of String(n)) h=(h*31+ch.charCodeAt(0))>>>0; return COLAV[h%COLAV.length];}
function av(n,t=32){return `<span class="av" style="width:${t}px;height:${t}px;background:${colorDe(n)}">${esc(ini(n))}</span>`;}
function hace(iso){const m=(Date.now()-new Date(iso))/60000; if(m<1) return 'ahora'; if(m<60) return `hace ${Math.round(m)} min`; if(m<1440) return `hace ${Math.round(m/60)} h`; return fmtFecha(iso);}
function enLinea(n){return n===S.user.nombre||Object.keys(S.pres||{}).some(u=>u.toLowerCase()===n.toLowerCase());}
function menciones(html){return html.replace(/@([\wáéíóúñü.\-]+)/gi,'<span class="mention">@$1</span>');}
async function api(ruta,datos){
  try{
    const r=await fetch(ruta,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...datos,user:S.user.nombre})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok&&j.error) aviso(j.error);
    return {ok:r.ok,...j};
  }catch(e){aviso('Sin conexión con el servidor'); return {ok:false};}
}
function focoKey(){if(S.view!=='revision') return ''; const r=R()[S.foco]; return r?key(r):'';}
async function sondear(){
  if(!SRV||!S.user.nombre) return;
  try{
    const r=await fetch(`/api/estado?user=${encodeURIComponent(S.user.nombre)}&key=${encodeURIComponent(focoKey())}`,{cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    const d=await r.json();
    Object.assign(S,{dec:d.dec,coms:d.comentarios,avisos:d.avisos,pres:d.presencia,
                     mensajes:d.mensajes||[],chats:d.chats||S.chats});
    if(d.equipo&&d.equipo.length) S.equipo=d.equipo;
    if(!S.chats.some(c=>c.id===S.canal)) S.canal='general';         // el chat abierto se borró o ya no eres miembro
    const kAbierto='chat:'+S.canal;                                   // lo que ya estás viendo no queda como «nuevo»
    if(S.view==='chat'&&S.avisos.some(x=>x.key===kAbierto&&!x.leido)){
      S.avisos.forEach(x=>{if(x.key===kAbierto) x.leido=true;}); api('/api/leido',{key:kAbierto});
    }
    const firma=d.seq+'|'+JSON.stringify(d.presencia);
    const cambio=firma!==_firma||S.online!==true;      // solo se redibuja si hay novedades
    _firma=firma; S.online=true;
    if(cambio) render();
  }catch(e){if(S.online!==false){S.online=false; render();}}
}
async function enviarComentario(){
  const txt=(S.ccom||'').trim(), r=R()[S.foco];
  if(!txt||!r) return;
  S.ccom=''; S.coms.push({key:key(r),user:S.user.nombre,texto:txt,fecha:new Date().toISOString()}); render();
  await api('/api/comentario',{key:key(r),texto:txt}); sondear();
}
// Quién más está mirando este hallazgo y el hilo de comentarios con @menciones.
function vPresencia(r){
  if(!SRV||!r) return '';
  const otros=Object.entries(S.pres||{}).filter(([u,k])=>k===key(r)&&u!==S.user.nombre).map(([u])=>u);
  return otros.length?`<div class="pres"><span class="av" style="width:20px;height:20px;font-size:10px;background:#c2185b">${esc(ini(otros[0]))}</span><span>${esc(otros.join(', '))} también ${otros.length>1?'están':'está'} en este hallazgo</span></div>`:'';
}
function vDebate(r){
  if(!r) return '';
  if(!SRV) return `<p class="note">Para comentar y avisar a compañeros con @nombre, abrid la revisión en equipo: <b>python servidor.py</b>.</p>`;
  const lista=(S.coms||[]).filter(c=>c.key===key(r)).map(c=>`<div class="com"><div class="q"><b>${esc(c.user)}</b> · ${fmtFecha(c.fecha)}</div>${menciones(esc(c.texto))}</div>`).join('');
  const enLinea=Object.keys(S.pres||{}).filter(u=>u!==S.user.nombre);
  return `<div class="debate"><b style="font-size:14px">Debate</b>
    ${lista||'<div class="small" style="margin:6px 0">Sin comentarios todavía.</div>'}
    <form id="comForm" class="chatin" style="margin-top:6px"><input id="ccom" value="${esc(S.ccom)}" placeholder="Comenta; usa @nombre para avisar" autocomplete="off" aria-label="Comentario para el equipo"><button type="submit">Enviar</button></form>
    ${enLinea.length?`<div class="small" style="margin-top:6px">En línea: ${enLinea.map(u=>esc(u)).join(', ')}</div>`:''}</div>`;
}
// ---------- Chat del equipo: canales, @menciones (avisan en la campanita) y #número para enlazar un hallazgo.
function tarjetaRef(n){
  const r=RES[n-1]; if(!r) return '';
  const d=decOf(r), est=d?DECTXT[d.dec]:'Pendiente';
  const c=d?(d.dec==='approved'?ECOL['Completado']:GRIS):ECOL['Pendiente'];
  return `<div class="ref" style="--c:${d?(d.dec==='approved'?'var(--ok)':'var(--sec)'):(r.tipo==='No verificable'?'var(--warn)':'var(--err)')}" data-act="abrirH" data-doc="${esc(r.documento)}" data-u="${esc(r.ubicacion)}" role="button" tabindex="0">
    <div style="min-width:0"><b>${esc(r.documento)}</b> <span class="small">${esc(r.ubicacion)}</span>
    <div class="small">${esc(r.justificacion.slice(0,120))}${r.justificacion.length>120?'…':''}</div></div>${pill('● '+est,c)}</div>`;
}
function textoChat(t){
  const h=menciones(esc(t)).replace(/(^|\s)#(\d{1,4})\b/g,(m,a,n)=>`${a}<a href="#" data-act="abrirNum" data-n="${n}" class="mention">#${n}</a>`);
  const nums=[...new Set([...t.matchAll(/(?:^|\s)#(\d{1,4})\b/g)].map(m=>+m[1]))];
  return h+nums.map(tarjetaRef).join('');
}
function vChat(){
  if(!SRV) return `<h2>Chat</h2><div class="card"><p class="sub" style="margin:0">El chat del equipo necesita la revisión en equipo: en la carpeta del auditor ejecuta <b>python servidor.py</b> y abre la dirección que muestra.</p></div>`;
  const actual=S.chats.find(c=>c.id===S.canal)||S.chats[0];
  const canal=actual.id;
  const lista=(S.mensajes||[]).filter(m=>m.canal===canal).map(m=>`<div class="mens">${av(m.user)}<div style="min-width:0;flex:1">
      <div><b>${esc(m.user)}</b> <span class="small">${hace(m.fecha)}</span></div>
      <div style="white-space:pre-wrap;overflow-wrap:anywhere">${textoChat(m.texto)}</div></div></div>`).join('');
  const gestiona=c=>c.tipo==='canal'?esAdmin():c.tipo==='grupo'?c.miembros[S.user.nombre]==='admin':false;
  const nl=id=>{const n=noLeidos(id); return n?`<span class="cnt" aria-label="${n} sin leer">${n}</span>`:'';};
  const fila=(c,icono)=>`<div class="fcanal">
      <button class="canal ${c.id===canal?'on':''}" data-act="canal" data-v="${esc(c.id)}" title="${esc(nombreChat(c))}">${icono}${esc(nombreChat(c))}${nl(c.id)}</button>
      ${c.tipo==='canal'&&gestiona(c)&&c.id!=='general'?`<button class="mini-btn" data-act="renombrarChat" data-v="${esc(c.id)}" title="Renombrar" aria-label="Renombrar ${esc(nombreChat(c))}">✎</button>`:''}
      ${c.tipo==='grupo'&&gestiona(c)?`<button class="mini-btn" data-act="gestionarGrupo" data-v="${esc(c.id)}" title="Gestionar grupo" aria-label="Gestionar ${esc(c.nombre)}">✎</button>`:''}
      ${(gestiona(c)||c.tipo==='privado')&&c.id!=='general'?`<button class="mini-btn" data-act="borrarChat" data-v="${esc(c.id)}" title="Eliminar" aria-label="Eliminar ${esc(nombreChat(c))}">✕</button>`:''}</div>`;
  const de=t=>S.chats.filter(c=>c.tipo===t);
  const canales=de('canal').map(c=>fila(c,'')).join('');
  // Integrantes de un grupo, con el mismo formato que tenía el recuadro «Equipo» (papel en el grupo, conexión, 💬 y @)
  const integrante=(m,c)=>{
    const on=enLinea(m.n), yo=m.n===S.user.nombre, papel=c.miembros[m.n]==='admin'?'Admin del grupo':'Miembro';
    return `<div class="miembro">${av(m.n,30)}<div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:6px"><b style="font-size:14px">${esc(m.n)}</b>${yo?'<span class="small">(tú)</span>':''}<span class="dot ${on?'on':''}" title="${on?'En línea':'Desconectado'}"></span></div>
        <div class="small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><span class="rolpill" style="margin:0 4px 0 0">${papel}</span>${esc(m.c)}</div></div>
      ${yo?'':`<div class="acc"><button class="ghost" data-act="privado" data-v="${esc(m.n)}" title="Chat privado con ${esc(m.n)}" aria-label="Chat privado con ${esc(m.n)}">💬</button>
      <button class="ghost" data-act="mencionar" data-v="${esc(m.n)}" data-chat="${esc(c.id)}" title="Mencionar a ${esc(m.n)}" aria-label="Mencionar a ${esc(m.n)}">@</button></div>`}</div>`;
  };
  // Cada grupo: su nombre y un desplegable con sus integrantes (abierto por defecto el grupo que estás viendo)
  const grupos=de('grupo').map(c=>{
    const k='g:'+c.id, abierto=S.abierto[k]??(c.id===canal);
    const gente=S.equipo.filter(m=>m.n in c.miembros).sort((a,b)=>(c.miembros[b.n]==='admin')-(c.miembros[a.n]==='admin')||a.n.localeCompare(b.n));
    const nOn=gente.filter(m=>enLinea(m.n)).length;
    return `<div style="border-bottom:1px solid var(--sep);padding:4px 0">
      <div style="display:flex;align-items:center;gap:2px">
        <button class="mini-btn" data-act="plegarGrupo" data-v="${esc(c.id)}" aria-expanded="${abierto}" aria-label="${abierto?'Ocultar':'Ver'} integrantes de ${esc(c.nombre)}" style="opacity:1;padding:4px 6px"><span class="flecha" style="display:inline-block;transition:transform .15s;${abierto?'':'transform:rotate(-90deg)'}">▼</span></button>
        <div style="flex:1;min-width:0">${fila(c,'👥 ')}</div>
      </div>
      <div ${abierto?'':'hidden'} style="padding:0 0 4px 8px">
        <div class="small" style="margin:2px 0 2px 4px">${gente.length} integrantes · ${nOn} en línea</div>
        ${gente.map(m=>integrante(m,c)).join('')}
        ${c.miembros[S.user.nombre]==='admin'?`<button class="ghost" data-act="gestionarGrupo" data-v="${esc(c.id)}" style="width:100%;margin-top:6px;font-size:13px;padding:7px">Añadir o quitar integrantes</button>`:''}
      </div></div>`;
  }).join('')||'<p class="small" style="margin:6px 4px">Aún no estás en ningún grupo.</p>';
  const privados=de('privado').map(c=>fila(c,av(nombreChat(c),20)+' ')).join('')||'<p class="small" style="margin:6px 4px">Todavía no tienes conversaciones privadas.</p>';
  const nuevoPrivado=`<button class="ghost" data-act="menuPrivado" aria-expanded="${!!S.privOpen}" style="width:100%;margin-top:8px;font-size:14px">+ Nuevo privado ${S.privOpen?'▴':'▾'}</button>
    ${S.privOpen?`<div class="desplegable" role="menu">${S.equipo.filter(m=>m.n!==S.user.nombre).map(m=>`<button role="menuitem" data-act="abrirPrivado" data-v="${esc(m.n)}">${av(m.n,24)}${esc(m.n)}<span class="dot ${enLinea(m.n)?'on':''}" style="margin-left:auto"></span></button>`).join('')}</div>`:''}`;
  const seccion=(id,titulo,n,cuerpo)=>`<button class="plegar" data-act="plegar" data-v="${id}" aria-expanded="${S.abierto[id]}"><span class="flecha">▼</span>${titulo}<span class="n">${n}</span></button>
      <div ${S.abierto[id]?'':'hidden'}>${cuerpo}</div>`;
  // Cabecera según el tipo de chat
  let cab, sub;
  if(actual.tipo==='grupo'){
    const ms=Object.entries(actual.miembros);
    cab=`👥 ${esc(actual.nombre)}`;
    sub=`${ms.length} personas: ${ms.map(([n,r])=>esc(n)+(r==='admin'?' (admin)':'')).join(', ')}`;
  }else if(actual.tipo==='privado'){
    cab=`${av(nombreChat(actual),26)} ${esc(nombreChat(actual))}`;
    sub='🔒 Conversación privada: solo la veis vosotros dos.';
  }else{
    cab='#'+esc(actual.nombre);
    sub='Canal público del equipo. Escribe #número para enlazar un hallazgo y @nombre para avisar a alguien.';
  }
  const accionesGrupo=actual.tipo==='grupo'?`<div style="display:flex;gap:6px">
      ${gestiona(actual)?`<button class="ghost" data-act="gestionarGrupo" data-v="${esc(actual.id)}" style="font-size:13px;padding:6px 12px">Gestionar</button>`:''}
      <button class="ghost" data-act="salirGrupo" data-v="${esc(actual.id)}" style="font-size:13px;padding:6px 12px">Salir</button></div>`:'';
  return `<h2>Chat</h2>
    <div class="chatgrid">
      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="card" style="padding:12px">${seccion('canales','Canales',de('canal').length,
          `<div style="margin-top:6px">${canales}</div>
          ${esAdmin()?'<button class="ghost" data-act="nuevoCanal" style="width:100%;margin-top:8px;font-size:14px">+ Nuevo canal público</button>':''}`)}</div>
        <div class="card" style="padding:12px">${seccion('grupos','Grupos',de('grupo').length,
          `<div style="margin-top:6px">${grupos}</div><button class="ghost" data-act="nuevoGrupo" style="width:100%;margin-top:8px;font-size:14px">+ Nuevo grupo</button>`)}</div>
        <div class="card" style="padding:12px">${seccion('privados','Privados',de('privado').length,`<div style="margin-top:6px">${privados}</div>${nuevoPrivado}`)}</div>
      </div>
      <div class="card chatbox">
        <div style="border-bottom:1px solid var(--sep);padding-bottom:10px;display:flex;align-items:center;gap:12px">
          <div style="flex:1;min-width:0"><h3 style="margin:0;display:flex;align-items:center;gap:8px">${cab}</h3>
          <div class="small">${sub}</div></div>${accionesGrupo}</div>
        <div class="chatlist" id="chatlist">${lista||'<p class="small" style="margin-top:12px">Todavía no hay mensajes en este chat.</p>'}</div>
        <form id="chatEq" class="chatin" style="margin-top:8px;align-items:flex-end">
          <textarea id="ctx" rows="2" placeholder="Mensaje para ${esc(nombreChat(actual))}" aria-label="Mensaje" style="flex:1;resize:vertical">${esc(S.ctx||'')}</textarea>
          <button type="submit">Enviar</button></form>
      </div>
    </div>`;
}
// Configuración → Usuarios y roles: personas, rol, estado; alta y baja (solo administradores, el servidor lo comprueba)

    const rol=admin?`<select data-rol="${esc(m.n)}" aria-label="Rol de ${esc(m.n)}">${Object.keys(ROLES).map(r=>`<option ${r===m.rol?'selected':''}>${r}</option>`).join('')}</select>`:esc(m.rol||'Revisor');

        <label class="small" style="display:flex;flex-direction:column;gap:4px;flex:2;min-width:200px">Correo<input id="aC" type="email" placeholder="nombre@airbus.es" autocomplete="off" required></label>
        <label class="small" style="display:flex;flex-direction:column;gap:4px">Rol<select id="aR">${Object.keys(ROLES).map(r=>`<option ${r==='Revisor'?'selected':''}>${r}</option>`).join('')}</select></label>
        <button type="submit">Añadir</button></form>

  return `<div class="card"><h3>Equipo</h3><p class="small" style="margin:0 0 8px">Personas, rol y estado de conexión.</p>

    ${alta}
    <div class="card" style="margin-top:16px"><h3>Roles</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
      ${Object.entries(ROLES).map(([r,d])=>`<div><b>${r}</b><div class="small">${d}</div></div>`).join('')}</div></div>`;
}
async function enviarMensaje(){

function tr(s){
  const t=s.trim(); if(!t) return null;
  if(EN[t]) return s.replace(t,EN[t]);
  for(const [re,r] of EN_RE) if(re.test(t)) return s.replace(t,t.replace(re,r));
  return null;
}
function aplicarIdioma(){
  document.documentElement.lang=S.lang;
  document.getElementById('lang-es').classList.toggle('on',S.lang==='es');
  document.getElementById('lang-en').classList.toggle('on',S.lang==='en');
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT); let n;
  while((n=w.nextNode())){
    if(n.parentElement&&n.parentElement.closest('script,style')) continue;
    if(n._es===undefined) n._es=n.nodeValue;
    const v=S.lang==='en'?(tr(n._es)??n._es):n._es;
    if(n.nodeValue!==v) n.nodeValue=v;
  }
  document.querySelectorAll('[placeholder]').forEach(el=>{
    if(el._ph===undefined) el._ph=el.placeholder;
    el.placeholder=S.lang==='en'?(tr(el._ph)??el._ph):el._ph;
  });
}

function nextPending(from){
  const rs=R();

// Sobre qué se aplica la decisión: los seleccionados pendientes; si no hay ninguno, el hallazgo activo.
function objetivosActuales(){
  const rs=R();
  const sel=rs.filter(r=>S.sel[key(r)]&&!decOf(r));
  if(sel.length) return sel;
  const f=rs[S.foco];
  return !f||decOf(f)?[]:[f];
}

function aplicar(dec){
  const comentario=(S.comment||'').trim();
  const fecha=new Date().toISOString();
  const objs=objetivosActuales();
  objs.forEach(r=>{S.dec[key(r)]={dec,note:comentario,fecha,user:S.user.nombre};});
  if(SRV) api('/api/decision',{keys:objs.map(key),dec,note:comentario}).then(sondear);   // compartida con el equipo
  else persist();
  S.sel={}; S.comment='';
  const n=nextPending(S.foco);
  if(n>=0) irA(n);
  render();
}

function baja(nombre,texto){

  const a=document.createElement('a');

  document.body.appendChild(a); a.click(); a.remove();

}

function norm(s){return String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
const VACIAS=new Set('que cual cuales como donde cuando cuanto cuantos cuantas los las del con por para una uno unos unas sobre hay tiene tienen esta estan este esto son ver dame muestrame ensename busca buscar quiero necesito lista listado the and with for show find what which how many are of in on to me all todos todas'.split(' '));
function palabras(s){return norm(s).split(/[^a-z0-9.\-]+/).filter(w=>w.length>2&&!VACIAS.has(w));}
function listaH(hits){return hits.slice(0,6).map(h=>`<mark>${esc(h.documento)} · ${esc(h.ubicacion)}</mark>`).join(', ')+(hits.length>6?'…':'');}
function plural(n,uno,varios){return `${n} ${n===1?uno:varios}`;}

function answer(q){
  const s=norm(q).trim(), ws=palabras(q);
  const partes=[], ctas=[], vistos=new Set();
  const add=(label,detalle,dest)=>{const k=JSON.stringify(dest); if(vistos.has(k)) return; vistos.add(k); ctas.push({label,detalle,dest});};
  const verH=(hits,txt,extra={})=>add(`Ver ${plural(hits.length,'hallazgo','hallazgos')} en Histórico`,`Histórico · ${txt}`,
    {view:'historico',hl:hits.map(key),hlTxt:txt,...extra});
  const hablaDocs=/document|expedient|archivo/.test(s), hablaHall=/hallazg|defect|finding/.test(s);

  // 1. Hallazgos: tipo, cláusula, documento concreto, decisiones
  const TIPOS_N=[['no verificable','No verificable'],['inconsist','Inconsistencia'],['no cumple','No cumple'],['incumpl','No cumple'],
                 ['cobertura','Cobertura faltante'],['trazab','Trazabilidad incorrecta']];
  const tipo=(TIPOS_N.find(([k])=>s.includes(k))||[])[1];
  const cl=s.match(/(?:is\.?i\.?or\.?\s*)?\b(2[0-6]\d)\b/);
  const doc=Object.keys(DOCS).find(c=>s.includes(norm(c)));
  let base=doc?RES.filter(r=>r.documento===doc):RES;
  if(tipo){
    const hits=base.filter(r=>r.tipo===tipo);
    partes.push(hits.length?`Hay ${plural(hits.length,'hallazgo','hallazgos')} de tipo <b>${esc(tipo)}</b>${doc?' en '+esc(doc):''}: ${listaH(hits)}.`:`No hay hallazgos de tipo <b>${esc(tipo)}</b>${doc?' en '+esc(doc):''}.`);
    if(hits.length) add(`Ver «${tipo}» en Histórico`,`Histórico · Tipo: ${tipo}${doc?' · '+doc:''}`,{view:'historico',tipo,q:doc||''});
  }
  if(cl){
    const c='IS.I.OR.'+cl[1], hits=base.filter(r=>r.clausula===c);
    partes.push(hits.length?`La cláusula <b>${c}</b> aparece en ${plural(hits.length,'hallazgo','hallazgos')}: ${listaH(hits)}.`:`Ningún hallazgo cita la cláusula <b>${c}</b>.`);
    if(hits.length) verH(hits,'Cláusula '+c);
  }
  const dec=/aprobad|approved/.test(s)?'approved':/rechazad|rejected/.test(s)?'rejected':null;
  if(dec){
    const hits=base.filter(r=>decOf(r)&&decOf(r).dec===dec), txt=DECTXT[dec];
    partes.push(hits.length?`Has marcado como <b>${txt.toLowerCase()}</b> ${plural(hits.length,'hallazgo','hallazgos')}: ${listaH(hits)}.`:`Todavía no hay hallazgos ${txt.toLowerCase()}s.`);
    if(hits.length) verH(hits,'Decisión: '+txt);
  }
  if(/pendient|sin decid|sin revis|por revis/.test(s)&&(hablaHall||doc)&&!hablaDocs){
    const hits=base.filter(r=>!decOf(r));
    partes.push(`Quedan ${plural(hits.length,'hallazgo','hallazgos')} sin decisión${doc?' en '+esc(doc):''}.`);
    if(hits.length) verH(hits,'Sin decisión'+(doc?' · '+doc:''));
  }
  if(doc){
    const info=DOCS[doc], rs=RES.filter(r=>r.documento===doc);
    partes.push(`<b>${esc(doc)}</b> · ${esc(info.titulo)} (v${esc(info.version)}, ${esc(info.familia)}): ${plural(rs.length,'hallazgo','hallazgos')}, estado <b>${esc(estadoDoc(rs))}</b>.`);
    if(rs.length) add(`Revisar ${doc} junto al PDF`,'Revisión · '+plural(rs.length,'hallazgo','hallazgos'),{view:'revision',doc});
  }

  // 2. Documentos (Inicio): estado y familia
  const EST_N=[['sin hallazgo','Sin hallazgos'],['en revision','En revisión'],['complet','Completado'],['terminad','Completado'],['pendient','Pendiente']];
  const iest=(EST_N.find(([k])=>s.includes(k))||[])[1];
  const familias=[...new Set(Object.values(DOCS).map(d=>d.familia))];
  const fam=familias.find(f=>s.includes(norm(f)))||familias.find(f=>palabras(f).some(w=>w.length>5&&ws.includes(w)));
  if((hablaDocs||fam||(iest&&!hablaHall&&!doc))&&(iest||fam)){
    const docsF=Object.keys(DOCS).filter(c=>{const rs=RES.filter(r=>r.documento===c);return (!iest||estadoDoc(rs)===iest)&&(!fam||DOCS[c].familia===fam);});
    const cual=[iest&&`estado «${iest}»`,fam&&`familia «${fam}»`].filter(Boolean).join(' y ');
    partes.push(`Hay ${plural(docsF.length,'documento','documentos')} con ${esc(cual)}${docsF.length?': '+docsF.slice(0,6).map(c=>`<mark>${esc(c)}</mark>`).join(', ')+(docsF.length>6?'…':''):''}.`);
    add('Ver documentos en Inicio',`Inicio · ${[iest&&'Estado: '+iest,fam&&'Familia: '+fam].filter(Boolean).join(' · ')}`,{view:'inicio',iest:iest||'',itipo:fam||''});
  }

  // 3. Panel de control IA: métricas y agentes
  let ag=ETAPAS.findIndex(e=>s.includes(norm(e.n)));            // nombre completo del agente, o «agente» + una palabra suya
  if(ag<0&&/agente/.test(s)) ag=ETAPAS.findIndex(e=>palabras(e.n).some(w=>w.length>4&&w!=='agente'&&ws.includes(w)));
  if(MET&&/\bf1\b|precis|recall|exhaust|metric|puntu|resultado|clave|rendimiento|acierto/.test(s)){
    partes.push(`Resultado frente a la clave: F1 <b>${esc(MET.f1)}</b>, precisión ${esc(MET.precision)}, recall ${esc(MET.recall)}, defectos encontrados ${esc(MET.encontrados)}.`);
    add('Ver métricas en el Panel de control IA','Panel de control IA · Resultado frente a la clave',{view:'ia'});
  }
  if(ag>=0||/agente|flujo|pipeline|descart|registro de ejec|log\b/.test(s)){
    const e=ETAPAS[ag>=0?ag:0];
    partes.push(ag>=0?`<b>Agente ${ag+1} · ${esc(e.n)}</b>: ${esc(e.d)}`:`La solución tiene ${ETAPAS.length} agentes: ${ETAPAS.map((x,i)=>`${i+1}. ${esc(x.n)}`).join(' · ')}.`);
    add(ag>=0?`Ver el agente ${ag+1} en el Panel de control IA`:'Ver el flujo de agentes',`Panel de control IA${ag>=0?' · Agente '+(ag+1)+' abierto':''}`,{view:'ia',agente:ag>=0?ag:null});
  }

  // 4. Configuración: reglas, criterio de aceptación, equipo
  if(/regla|umbral|criterio|aceptac|\bv[1-5]\b|jerarq|std-sec|lista-doc|normativ|verificador/.test(s)){
    partes.push(`Las reglas del verificador (V1 a V5), la jerarquía normativa y el umbral de aceptación (ahora ${S.umbral} %) están en Configuración.`);
    add('Ir a Configuración · Reglas','Configuración · Reglas y criterio de aceptación',{view:'reglas'});
  }
  const persona=S.equipo.find(m=>ws.includes(norm(m.n)));
  if(persona){
    const hits=RES.filter(r=>decOf(r)&&decOf(r).user===persona.n);
    partes.push(`<b>${esc(persona.n)}</b> es ${esc(persona.rol||'Revisor')} (${esc(persona.c)}) y ha decidido ${plural(hits.length,'hallazgo','hallazgos')}.`);
    if(hits.length) verH(hits,'Decididos por '+persona.n);
    add(`Ver a ${persona.n} en Usuarios y roles`,'Configuración · Usuarios y roles',{view:'usuarios'});
  } else if(/equipo|usuario|rol\b|roles|miembro|admin|aprobador|revisor|quien/.test(s)){
    partes.push(`El equipo tiene ${plural(S.equipo.length,'persona','personas')}: ${S.equipo.map(m=>`${esc(m.n)} (${esc(m.rol||'Revisor')})`).join(', ')}.`);
    add('Ir a Usuarios y roles','Configuración · Usuarios y roles',{view:'usuarios'});
  }

  // 5. Chat del equipo
  if(/chat|mensaje|canal|conversa/.test(s)){
    partes.push(SRV?`Hay ${plural((S.mensajes||[]).length,'mensaje','mensajes')} en ${plural((S.chats||[]).length,'chat','chats')}.`:'El chat del equipo necesita la revisión en equipo (python servidor.py).');
    add('Ir al Chat','Chat · #'+(S.canal||'general'),{view:'chat',canal:S.canal||'general'});
  }

  // 6. Sin intención clara: búsqueda por texto en hallazgos, documentos y mensajes
  if(!partes.length&&ws.length){
    const hits=RES.filter(r=>{const t=norm(r.documento+' '+r.ubicacion+' '+r.justificacion+' '+r.tipo+' '+(r.leido||''));return ws.some(w=>t.includes(w));});
    if(hits.length){partes.push(`Encontré ${plural(hits.length,'hallazgo que menciona','hallazgos que mencionan')} «${esc(q.trim())}»: ${listaH(hits)}.`); verH(hits,'Texto: '+q.trim());}
    const docsT=Object.keys(DOCS).filter(c=>ws.some(w=>norm(c+' '+DOCS[c].titulo).includes(w)));
    if(docsT.length){partes.push(`${plural(docsT.length,'documento coincide','documentos coinciden')}: ${docsT.slice(0,6).map(c=>`<mark>${esc(c)}</mark>`).join(', ')}${docsT.length>6?'…':''}.`);
      add('Ver documentos en Inicio','Inicio · Búsqueda: '+ws[0],{view:'inicio',iq:ws[0]});}
    const msgs=(S.mensajes||[]).filter(m=>ws.some(w=>norm(m.texto).includes(w)));
    if(msgs.length){partes.push(`También aparece en ${plural(msgs.length,'mensaje','mensajes')} del chat.`); add('Ver en el Chat','Chat · #'+msgs[msgs.length-1].canal,{view:'chat',canal:msgs[msgs.length-1].canal});}
  }
  const text=partes.length?partes.join('<br><br>')
    :'No encuentro nada con esos términos. Prueba con un tipo de hallazgo («no cumple»), una cláusula («IS.I.OR.230»), un código de documento, «documentos pendientes», «F1», «reglas» o el nombre de alguien del equipo.';
  return {text,ctas:ctas.slice(0,4)};
}

function sendChat(q){
  if(!q||!q.trim()) return;
  S.msgs.push({r:'u',t:esc(q.trim())});

// Criterio de aceptación: umbral sobre los hallazgos ya decididos. Define cuándo un documento se aprueba o se rechaza.
function criterioCard(){
  const dec=RES.filter(x=>decOf(x));
  const pend=RES.length-dec.length;
  const ap=dec.filter(x=>decOf(x).dec==='approved').length;
  const pct=dec.length?Math.round(ap/dec.length*100):null;
  const u=S.umbral;
  const cuenta={Aprobado:0,Rechazado:0,'En revisión':0};
  Object.keys(DOCS).forEach(c=>{
    const rs=RES.filter(r=>r.documento===c); if(!rs.length) return;
    const ds=rs.filter(r=>decOf(r));
    if(ds.length<rs.length){cuenta['En revisión']++;return;}
    const p=ds.filter(r=>decOf(r).dec==='approved').length/ds.length*100;
    cuenta[p>=u?'Aprobado':'Rechazado']++;
  });
  return `<div class="card" style="margin-bottom:16px"><h3>Criterio de aceptación</h3>
    <p class="small">Un documento se aprueba cuando el porcentaje de hallazgos aprobados por el auditor es igual o mayor que el umbral y no quedan hallazgos pendientes. En otro caso queda en revisión o rechazado.</p>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0">
      <label class="small" for="umbral">Umbral de aceptación (%)</label>
      <input id="umbral" type="number" min="0" max="100" value="${u}" style="width:100px">
    </div>
    <div class="sumrow"><span>Aceptación actual</span><b>${pct===null?'—':pct+'%'}</b></div>
    <div class="sumrow"><span>Hallazgos pendientes</span><b>${pend}</b></div>
    <div class="sumrow"><span>Documentos aprobados</span>${st('ok',cuenta.Aprobado)}</div>
    <div class="sumrow"><span>Documentos rechazados</span>${st('fail',cuenta.Rechazado)}</div>
    <div class="sumrow"><span>Documentos en revisión</span>${st('doubt',cuenta['En revisión'])}</div>
    <p class="note">La aceptación se calcula sobre los hallazgos ya decididos. Cambiar el umbral afecta a los documentos que aún no se han cerrado.</p>
  </div>`;
}

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <h2 style="margin:0">Criterios de validación</h2>
        <button class="ghost" data-act="cerrarCriterios">Cerrar</button>
      </div>
      ${criteriosBody()}
    </aside>`:'';
  const comentario=S.extraOpen?`<div class="scrim" data-act="toggleExtra"></div>
    <div class="dialog" role="dialog" aria-label="Comentario sin hallazgo de la IA">
      <h2 style="margin:0 0 6px">Comentario sin hallazgo</h2>
      <p class="small" style="margin:0 0 14px">Algo que la IA no señaló. Se guarda como retroalimentación para mejorar el auditor.</p>
      <label class="small" for="xref">Referencia (ubicación o texto del documento)</label>
      <input id="xref" value="${esc(S.extraForm.ref)}" style="margin:6px 0 12px">
      <label class="small" for="xtxt">Qué debería haber señalado la IA</label>
      <textarea id="xtxt" rows="4" style="margin-top:6px">${esc(S.extraForm.txt)}</textarea>
      <div class="fbtns">
        <button class="ghost" data-act="toggleExtra">Cancelar</button>
        <button class="ok" data-act="guardarExtra">Guardar comentario</button>
      </div>
    </div>`:'';
  document.getElementById('view').innerHTML=VIEWS[S.view]()+criterios+comentario+(S.view==='chat'?vDlgGrupo():'')+vAsistente();
  scr.forEach(([s,y])=>{const el=document.querySelector(s); if(el&&y) el.scrollTop=y;});
  const cl=document.getElementById('chatlist');                   // chat: baja al último mensaje si hay nuevos
  if(cl){
    const n=(S.mensajes||[]).filter(m=>m.canal===(S.canal||'general')).length;
    if(S.chatAbajo||n!==S._nMsg) cl.scrollTop=cl.scrollHeight; else cl.scrollTop=S._yChat||0;
    S._nMsg=n; S.chatAbajo=false;
    cl.onscroll=()=>{S._yChat=cl.scrollTop;};

  if(actId){const el=document.getElementById(actId); if(el&&el!==document.activeElement&&'value' in el){el.focus(); try{el.setSelectionRange(pos,pos);}catch(e){}}}
  pintarBarra();
  aplicarIdioma();
  if(S.view==='revision') centrarCita();
}

document.addEventListener('click',e=>{
  if(S.avisosOpen&&!e.target.closest('#avisos,#bell')){S.avisosOpen=false; pintarBarra(); aplicarIdioma();}
  const el=e.target.closest('[data-act]');
  if(!el||el.disabled) return;
  const a=el.dataset.act;
  if(a==='lang'){S.lang=el.dataset.v; try{localStorage.setItem('rv_lang',S.lang);}catch(err){} render(); return;}
  if(a==='avisos'){S.avisosOpen=!S.avisosOpen; pintarBarra(); aplicarIdioma(); return;}
  if(a==='borrarAviso'){                                      // × de una tarjeta, o «Borrar todas» (clave vacía)
    const k=el.dataset.k;
    S.avisos=(S.avisos||[]).filter(x=>k&&x.key!==k);
    pintarBarra(); aplicarIdioma(); api('/api/avisos/borrar',k?{key:k}:{});
    return;
  }
  if(a==='irAviso'){                                          // «Ver»: abre el chat o el hallazgo y lo marca como leído
    S.avisos.forEach(x=>{if(x.key===el.dataset.k) x.leido=true;}); api('/api/leido',{key:el.dataset.k});
  }
  if(a==='irAviso'&&el.dataset.k.startsWith('chat:')){
    S.avisosOpen=false; S.view='chat'; S.canal=el.dataset.k.slice(5); S.chatAbajo=true; render(); window.scrollTo(0,0); return;
  }
  if(a==='nuevoCanal'){
    const nombre=(prompt('Nombre del nuevo canal público (lo verá todo el equipo):')||'').trim(); if(!nombre) return;
    api('/api/chat/crear',{tipo:'canal',nombre}).then(r=>{if(r.ok){S.canal=r.id; S.chatAbajo=true; sondear();}});
    return;
  }
  if(a==='menuPrivado'){S.privOpen=!S.privOpen; render(); return;}
  if(a==='abrirPrivado'){
    S.privOpen=false;
    api('/api/chat/crear',{tipo:'privado',con:el.dataset.v}).then(r=>{if(r.ok){S.canal=r.id; S.chatAbajo=true; S.abierto.privados=true; sondear();}});
    return;
  }
  if(a==='canal'){S.canal=el.dataset.v; S.chatAbajo=true; render(); return;}
  if(a==='plegar'){S.abierto[el.dataset.v]=!S.abierto[el.dataset.v]; render(); return;}
  if(a==='plegarGrupo'){const k='g:'+el.dataset.v; S.abierto[k]=el.getAttribute('aria-expanded')!=='true'; render(); return;}
  if(a==='renombrarChat'){                                          // canal público: solo el administrador del equipo
    const c=S.chats.find(x=>x.id===el.dataset.v); if(!c) return;
    const nuevo=(prompt(`Nuevo nombre para #${c.nombre}:`,c.nombre)||'').trim();
    if(!nuevo||nuevo===c.nombre) return;
    api('/api/chat/editar',{id:c.id,nombre:nuevo}).then(sondear);
    return;
  }
  if(a==='borrarChat'){
    const c=S.chats.find(x=>x.id===el.dataset.v); if(!c) return;
    if(!confirm(`¿Eliminar ${nombreChat(c)} y todos sus mensajes? No se puede deshacer.`)) return;
    api('/api/chat/borrar',{id:c.id}).then(r=>{if(r.ok&&S.canal===c.id) S.canal='general'; sondear();});
    return;
  }
  if(a==='nuevoGrupo'){abrirDlgGrupo(null); return;}
  if(a==='gestionarGrupo'){abrirDlgGrupo(S.chats.find(x=>x.id===el.dataset.v)); return;}
  if(a==='cerrarDlg'){S.dlg=null; render(); return;}
  if(a==='guardarGrupo'){
    const g=S.dlg; g.nombre=(document.getElementById('gN').value||'').trim();
    if(!g.nombre){aviso('Pon un nombre al grupo'); return;}
    const p=g.id?api('/api/chat/editar',{id:g.id,nombre:g.nombre,miembros:g.miembros}):api('/api/chat/crear',{tipo:'grupo',nombre:g.nombre,miembros:g.miembros});
    p.then(r=>{if(r.ok){S.dlg=null; if(r.id){S.canal=r.id; S.chatAbajo=true;} sondear(); render();}});
    return;
  }
  if(a==='salirGrupo'){
    const c=S.chats.find(x=>x.id===el.dataset.v); if(!c) return;
    if(!confirm(`¿Salir del grupo ${c.nombre}? Dejarás de ver sus mensajes.`)) return;
    api('/api/chat/salir',{id:c.id}).then(r=>{if(r.ok) S.canal='general'; sondear();});
    return;
  }
  if(a==='privado'){
    api('/api/chat/crear',{tipo:'privado',con:el.dataset.v}).then(r=>{if(r.ok){S.canal=r.id; S.chatAbajo=true; S.abierto.privados=true; sondear();}});
    return;
  }
  if(a==='bajaEq'){
    const n=el.dataset.v;
    if(!confirm(`¿Eliminar a ${n} del equipo? Sus mensajes y decisiones se conservan.`)) return;
    api('/api/equipo/baja',{n}).then(sondear);
    return;
  }
  if(a==='mencionar'){
    if(el.dataset.chat&&el.dataset.chat!==S.canal){S.canal=el.dataset.chat; S.chatAbajo=true;}   // se menciona dentro de su grupo
    S.ctx=(S.ctx?S.ctx.replace(/\s*$/,' '):'')+'@'+el.dataset.v+' '; render();
    const t=document.getElementById('ctx'); if(t){t.focus(); t.setSelectionRange(t.value.length,t.value.length);} return;
  }
  if(a==='abrirNum'){
    e.preventDefault(); const r=RES[Number(el.dataset.n)-1]; if(!r) return;
    abrirRevision(r.documento); const i=R().findIndex(x=>x.ubicacion===r.ubicacion); if(i>=0) irA(i);
    render(); window.scrollTo(0,0); return;
  }
  if(a==='irAviso'){
    const [doc]=el.dataset.k.split('|'); S.avisosOpen=false;
    abrirRevision(doc); const i=R().findIndex(r=>key(r)===el.dataset.k); if(i>=0) irA(i);
    render(); window.scrollTo(0,0); return;
  }
  if(a==='asis'){S.asisOpen=!S.asisOpen; S.asisAnim=S.asisOpen; render(); if(S.asisOpen){const m=document.getElementById('msgs'); if(m) m.scrollTop=m.scrollHeight; const i=document.getElementById('cq'); if(i) i.focus();} return;}
  if(a==='sug'){sendChat(el.dataset.v); return;}
  if(a==='cta'){const c=(S.msgs[Number(el.dataset.m)]||{}).ctas; if(c&&c[Number(el.dataset.c)]) irDestino(c[Number(el.dataset.c)].dest); return;}
  if(a==='limpiarHl'){S.hl=[]; S.soloHl=false; S.hlTxt=''; render(); return;}
  if(a==='drawer') toggleDrawer();
  else if(a==='nav'){S.view=el.dataset.v; toggleDrawer(false); render(); window.scrollTo(0,0);}
  else if(a==='abrir'){abrirRevision(el.dataset.doc); render(); window.scrollTo(0,0);}
  else if(a==='iest'){S.iest=el.dataset.v; render();}
  else if(a==='abrirH'){abrirRevision(el.dataset.doc); const i=R().findIndex(r=>r.ubicacion===el.dataset.u); if(i>=0) irA(i); render(); window.scrollTo(0,0);}
  else if(a==='volver'){S.view='inicio'; S.sel={}; S.comment=''; render(); window.scrollTo(0,0);}
  else if(a==='criterios'){S.criteriosOpen=true; render();}
  else if(a==='cerrarCriterios'){S.criteriosOpen=false; render();}
  else if(a==='toggleExtra'){S.extraOpen=!S.extraOpen; render();}
  else if(a==='guardarExtra') guardarExtra();
  else if(a==='goto'){irA(Number(el.dataset.i)); render();}
  else if(a==='toggle'){const k=el.dataset.k; S.sel[k]=!S.sel[k]; render();}
  else if(a==='todos'){
    const pend=pendientes();
    const todos=pend.every(x=>S.sel[key(x)]);
    S.sel={};
    if(!todos) pend.forEach(x=>{S.sel[key(x)]=true;});
    render();
  }
  else if(a==='aprobar') aplicar('approved');
  else if(a==='rechazar') aplicar('rejected');
  else if(a==='pdfpag'){
    const n=S.pdfPag+Number(el.dataset.d);
    if(n<1||n>DOCS[S.doc].paginas) return;
    S.pdfPag=n; render();
  }
  else if(a==='agente'){const i=Number(el.dataset.i); S.agente=S.agente===i?null:i; render();}
  else if(a==='exres') exportRespuestas();
  else if(a==='exfb') exportFeedback();
  else if(a==='logout'){S.view='inicio'; document.getElementById('app').classList.add('hidden'); document.getElementById('login').classList.remove('hidden'); toggleDrawer(false);}
});

document.addEventListener('input',e=>{
  if(e.target.id==='flt'){S.q=e.target.value; render(); const f=document.getElementById('flt'); if(f){f.focus(); f.setSelectionRange(f.value.length,f.value.length);}}
  if(e.target.id==='iq'){S.iq=e.target.value; render(); const f=document.getElementById('iq'); if(f){f.focus(); f.setSelectionRange(f.value.length,f.value.length);}}
  if(e.target.id==='fcom'){S.comment=e.target.value;}
  if(e.target.id==='ccom'){S.ccom=e.target.value;}
  if(e.target.id==='ctx'){S.ctx=e.target.value;}
  if(e.target.id==='gN'&&S.dlg){S.dlg.nombre=e.target.value;}
  if(e.target.id==='cq'){S.cq=e.target.value;}
  if(e.target.id==='xref'){S.extraForm.ref=e.target.value;}
  if(e.target.id==='xtxt'){S.extraForm.txt=e.target.value;}
});

document.addEventListener('change',e=>{
  if(e.target.id==='ftipo'){S.tipo=e.target.value; render();}
  if(e.target.id==='itipo'){S.itipo=e.target.value; render();}
  if(e.target.id==='iest'){S.iest=e.target.value; render();}
  if(e.target.id==='umbral'){S.umbral=Math.min(100,Math.max(0,Number(e.target.value)||0)); render();}
  if(e.target.dataset&&e.target.dataset.rol){api('/api/equipo/rol',{n:e.target.dataset.rol,rol:e.target.value}).then(sondear);}
  // Ventana de grupo: marcar quién entra y su papel (se guarda al pulsar «Crear grupo» / «Guardar cambios»)
  if(S.dlg&&e.target.dataset&&e.target.dataset.gmiem){
    const n=e.target.dataset.gmiem; S.dlg.nombre=(document.getElementById('gN').value||'');
    if(e.target.checked) S.dlg.miembros[n]=S.dlg.miembros[n]||'miembro'; else delete S.dlg.miembros[n];
    render();
  }
  if(S.dlg&&e.target.dataset&&e.target.dataset.grol){S.dlg.miembros[e.target.dataset.grol]=e.target.value;}
  if(e.target.id==='nuevoPrivado'&&e.target.value){
    api('/api/chat/crear',{tipo:'privado',con:e.target.value}).then(r=>{if(r.ok){S.canal=r.id; S.chatAbajo=true; S.abierto.privados=true; sondear();}});
  }
  if(e.target.id==='archivo'){
    const f=e.target.files&&e.target.files[0];
    if(f){S.uploads.push({nombre:f.name,fecha:new Date().toISOString()}); render();}
  }
});

// En el chat, Intro envía y Mayúsculas+Intro hace salto de línea
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.asisOpen){S.asisOpen=false; render(); return;}
  if(e.target.id==='ctx'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault(); enviarMensaje();}
});

document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='loginForm'){
    const em=(document.getElementById('em').value||'revisor').trim();
    // Si es alguien del equipo (por correo o por nombre), se usa su nombre del equipo: así las @menciones le llegan
    const loc=em.split('@')[0].toLowerCase(), m=S.equipo.find(x=>x.c===em.toLowerCase()||x.n.toLowerCase()===loc.split(/[._\-\s]+/)[0]);
    S.user.nombre=m?m.n:(em.split('@')[0].split(/[._-]+/).filter(Boolean).map(w=>w[0].toUpperCase()+w.slice(1)).join(' ')||'Revisor');
    if(m) S.user.cargo=`${m.rol} · Calidad Part-IS`;
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    render();
    if(SRV&&!S.sondeo){S.sondeo=setInterval(sondear,2500); sondear();}   // novedades del equipo cada 2,5 s
  } else if(e.target.id==='chatForm'){
    sendChat(document.getElementById('cq').value);
    const c=document.getElementById('cq'); if(c) c.focus();
  } else if(e.target.id==='comForm'){
    enviarComentario();
  } else if(e.target.id==='chatEq'){
    enviarMensaje();
  } else if(e.target.id==='altaEq'){
    const n=document.getElementById('aN').value.trim(), c=document.getElementById('aC').value.trim(), rol=document.getElementById('aR').value;
    api('/api/equipo/alta',{n,c,rol}).then(r=>{if(r.ok){aviso(`${n} añadido al equipo`); sondear();}});
  } else if(e.target.id==='canalForm'){
    const nombre=(document.getElementById('ncanal').value||'').trim(); if(!nombre) return;
    api('/api/chat/crear',{tipo:'canal',nombre}).then(r=>{if(r.ok){S.canal=r.id; S.chatAbajo=true; sondear();}});
  }
});

// Con servidor, el equipo actual llega antes del inicio de sesión (para reconocer a cada uno por su correo)
if(SRV) fetch('/api/estado',{cache:'no-store'}).then(r=>r.json()).then(d=>{if(d.equipo&&d.equipo.length) S.equipo=d.equipo;}).catch(()=>{});
render();
</script>
</body>
</html>
