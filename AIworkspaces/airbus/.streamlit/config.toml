# Tema visual inspirado en el enunciado del reto (azul marino + cian, tarjetas claras)
[theme]
base = "light"
primaryColor = "#0077B0"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F6FB"
textColor = "#14284B"
font = "sans serif"

[client]
toolbarMode = "minimal"

# Seguridad: la app solo se abre desde este ordenador. Sin esto, Streamlit la ofrece a toda la red (también la
# Wi-Fi del evento) y por HTTP sin cifrar, con el inicio de sesión de prototipo. Para enseñarla desde otro equipo,
# ponla detrás de un proxy con HTTPS en vez de quitar esta línea.
[server]
address = "127.0.0.1"
